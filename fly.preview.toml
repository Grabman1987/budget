app = 'budget-fg-preview'
primary_region = 'fra'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'
  build-target = 'preview'

[env]
  PORT = '3000'
  DATA_DIR = '/data'
  BUDGET_PREVIEW = '1'
  BUDGET_ORIGIN = 'https://budget-fg-preview.fly.dev'
  BUDGET_RP_ID = 'budget-fg-preview.fly.dev'
  BUDGET_TRUST_PROXY = '1'
  BUDGET_REPLICATE = '0'
  BUDGET_MARKET_SOURCES = 'fixture'
  BUDGET_MARKET_DAILY = '0'
  BUDGET_BANK_SYNC_DAILY = '0'
  DROPBOX_PAYSLIP_ROOT = ''

[[mounts]]
  source = 'preview_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    method = 'GET'
    path = '/health'
    interval = '30s'
    timeout = '5s'
    grace_period = '60s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
