# Placeholder app name: create the real app with `fly apps create` and change it here.
app = 'budget-fg'
primary_region = 'fra'

# On stop, Fly sends SIGTERM and waits this long: Litestream needs it to flush the last WAL frames.
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]

[env]
  PORT = '3000'
  DATA_DIR = '/data'

# Secrets (never in this file), set once with `fly secrets set` / `fly storage create`:
# BUDGET_SETUP_TOKEN, BUCKET_NAME, AWS_ENDPOINT_URL_S3, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# AWS_REGION. Litestream replication switches on when BUCKET_NAME is set. See docs/ops.md.

# SQLite lives on a volume: exactly one machine, in one region.
# Create once: fly volumes create budget_data --region fra --size 1
[[mounts]]
  source = 'budget_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = 'GET'
    path = '/health'
    interval = '15s'
    timeout = '3s'
    grace_period = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
