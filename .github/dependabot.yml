# Weekly update PRs, grouped so that one PR per ecosystem arrives instead of one per package.
# Major versions are never grouped: they get their own PR because they need a real review.
# GitHub Actions stay pinned to commit SHAs; Dependabot updates the SHA and the version comment.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Playwright minor updates break the offline e2e (service worker vs. setOffline since 1.57); bump it by hand with a trace review.
    ignore:
      - dependency-name: '@playwright/test'
        update-types: ['version-update:semver-minor']
      - dependency-name: playwright
        update-types: ['version-update:semver-minor']
      - dependency-name: playwright-core
        update-types: ['version-update:semver-minor']
      # ESLint 10 is blocked until eslint-plugin-jsx-a11y supports it (6.10.2 peers eslint ^3-^9); keep the a11y lint gate (#364).
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Node majors only by hand, LTS lines only (owner decision 09.10.2026: Node 25 rejected).
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    groups:
      docker:
        patterns: ['*']
