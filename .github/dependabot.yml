# Weekly update PRs, grouped so that one PR per ecosystem arrives instead of one per package.
# Major versions are never grouped: they get their own PR because they need a real review.
# GitHub Actions stay pinned to commit SHAs; Dependabot updates the SHA and the version comment.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker:
        patterns: ['*']
