name: CI

on:
  pull_request:
  # The deploy workflow starts from a successful CI run on main, so CI must run there too.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel the run on main that a deploy may be waiting for.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The encrypted-backup restore test (apps/server/src/backup) needs age; with
      # BUDGET_REQUIRE_AGE=1 it fails instead of skipping when the binary is missing.
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Typecheck, lint, unit tests
        env:
          BUDGET_REQUIRE_AGE: '1'
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (builds first)
        run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Windows is the owner's development machine: `npm ci` (no compiler needed, see .npmrc) and the
  # unit tests must pass there, including the path handling of the database package.
  check-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck, lint, unit tests
        run: npm run check

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build image (no push)
        run: docker build -t budget:ci .
      - name: Smoke-test image
        run: |
          docker run --rm --entrypoint age budget:ci --version
          docker run -d --name budget -p 3000:3000 -e BUDGET_ORIGIN=http://localhost:3000 -e BUDGET_REPLICATE=0 budget:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/health && exit 0
            sleep 1
          done
          docker logs budget
          exit 1

  restore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Version and checksums are pinned once, in the Dockerfile, and reused here.
      - name: Install pinned Litestream (checksum verified)
        run: |
          version=$(sed -n 's/^ARG LITESTREAM_VERSION=//p' Dockerfile)
          sha=$(sed -n 's/^ARG LITESTREAM_SHA256_AMD64=//p' Dockerfile)
          file="litestream-${version}-linux-x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" \
            "https://github.com/benbjohnson/litestream/releases/download/v${version}/${file}"
          echo "${sha}  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/litestream"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/litestream" litestream
          echo "LITESTREAM_BIN=$RUNNER_TEMP/litestream/litestream" >> "$GITHUB_ENV"
      - name: Ensure sqlite3 CLI
        run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
      - name: Backup and restore round trip
        run: scripts/restore-test.sh
