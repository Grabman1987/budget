name: CI

on:
  pull_request:
  # The deploy workflow starts from a successful CI run on main, so CI must run there too.
  push:
    branches: [main]
  # Full regression remains available independently of the focused pull-request lanes.
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # Never cancel the run on main that a deploy may be waiting for.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
      shards: ${{ steps.plan.outputs.shards }}
      specs: ${{ steps.plan.outputs.specs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected checks (unknown changes use full coverage)
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HIGH_RISK: ${{ contains(github.event.pull_request.labels.*.name, 'risk:high') }}
        run: node scripts/ci/change-plan.mjs

  # Push to main only: when this exact tree already passed its selected suite as a pull request (same
  # tree, PR head contains the previous main, check/check-windows/docker/restore-test green in this
  # workflow), the heavy jobs below are skipped and the aggregates report success, so deploy.yml
  # proceeds. Anything missing or unreadable means reuse=false, i.e. the full suite. Pull request
  # runs skip this job and are unaffected. Logic and tests: scripts/ci/reuse-validated-tree.mjs.
  reuse:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      reuse: ${{ steps.decide.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A crash must not fail the run: the output stays empty and the full suite runs.
      - name: Decide
        id: decide
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: node scripts/ci/reuse-validated-tree.mjs

  # `check`, `check-windows`, `docker` and `restore-test` are the required status checks (branch
  # protection, merge script): keep their names. `check` validates the lane's exact status vector.
  # Typecheck and lint (OS-independent) in one job, unit tests sharded in the next one.
  static:
    needs: [reuse, plan]
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  unit:
    needs: [reuse, plan]
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' && needs.plan.result == 'success' && needs.plan.outputs.lane != 'docs' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The encrypted-backup restore test (apps/server/src/backup) needs age; with
      # BUDGET_REQUIRE_AGE=1 it fails instead of skipping when the binary is missing.
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Unit tests, shard ${{ matrix.shard }}/2
        env:
          BUDGET_REQUIRE_AGE: '1'
        run: npx vitest run --shard=${{ matrix.shard }}/2

  # Full E2E is split by Playwright sharding (SHARDS below must match the full plan). Every shard builds
  # the bundle (seconds, so no shared build artifact) and starts its own set of test servers (fresh
  # databases, see playwright.config.ts), so shards share no state. Screenshot assertions are
  # skipped here (--ignore-snapshots, every other assertion runs): baselines are checked by the
  # separate `visual` job (also part of `check`), so full shards only prove behaviour.
  # The UI lane uses one job, mapped specs and enabled screenshot assertions instead.
  e2e:
    needs: [reuse, plan, static]
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' && needs.plan.result == 'success' && needs.plan.outputs.lane != 'docs' && needs.static.result == 'success' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      SHARDS: 12
      CI_LANE: ${{ needs.plan.outputs.lane }}
      SPECS: ${{ needs.plan.outputs.specs }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards || '[1]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allow Git reads in the container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (e2e mode)
        run: npm run build:e2e
      - name: E2E shard ${{ matrix.shard }}/${{ env.SHARDS }}
        run: |
          if [ "$CI_LANE" = "ui" ]; then
            read -r -a specs <<< "$SPECS"
            [ "${#specs[@]}" -gt 0 ] || exit 1
            # Focused runs retain screenshot assertions and every configured browser profile.
            npx playwright test "${specs[@]}"
          else
            npx playwright test --ignore-snapshots --shard=${{ matrix.shard }}/${{ env.SHARDS }}
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Required status check: green only for the exact successful/skipped vector of the selected lane.
  check:
    needs: [reuse, plan, static, unit, e2e, visual]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every check selected by the verified plan
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/change-plan.mjs --gate

  # The specs that compare screenshots (the only ones with baselines), without --ignore-snapshots.
  # Blocking via `check`. A PR that changes the UI on purpose commits reviewed Linux baselines first
  # (manual workflow update-snapshots.yml).
  visual:
    needs: [reuse, plan, static]
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' && needs.plan.outputs.lane == 'full' && needs.static.result == 'success' }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Allow Git reads in the container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build (e2e mode)
        run: npm run build:e2e
      - name: Redesign OFF/ON build and installed-PWA smoke
        run: npx tsx scripts/dev/redesign-smoke.ts
      - name: Visual specs
        run: |
          mapfile -t specs < <(grep -lE 'expectScreenshot|toHaveScreenshot' e2e/*.spec.ts)
          npx playwright test "${specs[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-visual
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Windows is the owner's development machine: `npm ci` (no compiler needed, see .npmrc) and the
  # unit tests must pass there, including the path handling of the database package. Typecheck and
  # lint are OS-independent (.gitattributes pins eol=lf) and already run on ubuntu (`static`).
  windows-unit:
    needs: [reuse, plan, static]
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' && needs.plan.outputs.lane == 'full' && needs.static.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit tests, shard ${{ matrix.shard }}/2
        run: npx vitest run --shard=${{ matrix.shard }}/2

  # Required status check: Windows success for full runs; explicit non-Windows/reuse decision otherwise.
  check-windows:
    needs: [reuse, plan, windows-unit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require Windows coverage when selected
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/change-plan.mjs --gate windows

  docker:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image (no push)
        run: docker build --build-arg BUDGET_BUILD_REVISION="$(git rev-parse HEAD)" -t budget:ci .
      - name: Smoke-test image
        run: |
          revision="$(git rev-parse HEAD)"
          docker run --rm --entrypoint age budget:ci --version
          # Throwaway pepper: production requires BUDGET_PEPPER, this container holds no data.
          docker run -d --name budget -p 3000:3000 -e BUDGET_ORIGIN=http://localhost:3000 \
            -e BUDGET_PEPPER=ci-smoke-test-pepper-not-a-secret-0123456789 -e BUDGET_REPLICATE=0 budget:ci
          for i in $(seq 1 20); do
            response="$(curl -fsS http://localhost:3000/health || true)"
            if echo "$response" | jq -e --arg revision "$revision" '.status == "ok" and .revision == $revision' >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs budget
          exit 1

      - name: Build isolated preview image (no push)
        run: docker build --target preview --build-arg BUDGET_BUILD_REVISION="$(git rev-parse HEAD)" -t budget:preview-ci .

  restore-test:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version and checksums are pinned once, in the Dockerfile, and reused here.
      - name: Install pinned Litestream (checksum verified)
        run: |
          version=$(sed -n 's/^ARG LITESTREAM_VERSION=//p' Dockerfile)
          sha=$(sed -n 's/^ARG LITESTREAM_SHA256_AMD64=//p' Dockerfile)
          file="litestream-${version}-linux-x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" \
            "https://github.com/benbjohnson/litestream/releases/download/v${version}/${file}"
          echo "${sha}  $RUNNER_TEMP/$file" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/litestream"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/litestream" litestream
          echo "LITESTREAM_BIN=$RUNNER_TEMP/litestream/litestream" >> "$GITHUB_ENV"
      - name: Ensure sqlite3 CLI
        run: command -v sqlite3 || (sudo apt-get update && sudo apt-get install -y sqlite3)
      - name: Backup and restore round trip
        run: scripts/restore-test.sh
