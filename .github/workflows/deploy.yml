name: Deploy

# Owner-authorized release batches: merging and publishing are separate operations.
# Dispatch an immutable, currently verified main revision; no automatic per-merge deployment.
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full SHA of the current main revision to publish
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Deploys never overlap and are never cancelled half way: a cut-off deploy can leave a release
# half rolled out.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub Environment holding FLY_API_TOKEN; restrict it to the main branch in the settings.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release candidate
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
        run: node scripts/ci/release-target.mjs
      - name: Select verified source
        env:
          REVISION: ${{ steps.target.outputs.revision }}
        run: git checkout --detach "$REVISION"
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # The token lives only in the env of the steps that talk to Fly, never at job level.
      # Secrets are not available in `if:` expressions, so gate through an output.
      - name: Check deploy token
        id: gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::FLY_API_TOKEN is not configured."
            exit 1
          fi
      # SQLite on one volume: exactly one machine (docs/ops.md). Without --ha=false Fly creates two
      # machines on the first deploy, i.e. two diverging databases.
      - name: Deploy
        if: steps.gate.outputs.enabled == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          revision="$(git rev-parse HEAD)"
          git fetch -q origin main
          [ "$(git rev-parse origin/main)" = "$revision" ] || { echo '::error::Main changed; select a new release candidate.'; exit 1; }
          flyctl deploy --build-arg BUDGET_BUILD_REVISION="$revision" --remote-only --ha=false
      - name: Guard - exactly one machine
        if: steps.gate.outputs.enabled == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          count=$(flyctl machines list --json | jq 'length')
          echo "machines: $count"
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one machine, found $count. SQLite needs exactly one; see docs/ops.md."
            exit 1
          fi
      - name: Verify exact live revision
        env:
          REVISION: ${{ steps.target.outputs.revision }}
        run: |
          for attempt in $(seq 1 36); do
            if curl -fsS --max-time 10 https://budget-fg.fly.dev/health | jq -e --arg sha "$REVISION" '.status == "ok" and .revision == $sha'; then exit 0; fi
            sleep 5
          done
          echo '::error::Expected revision did not become live.'
          exit 1
