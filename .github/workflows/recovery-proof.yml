name: Recovery proof

on:
  pull_request:
    paths:
      - '.github/workflows/recovery-proof.yml'
      - 'scripts/recovery-proof.ts'
      - 'apps/server/src/backup/**'
      - 'apps/server/src/receipts/**'
      - 'packages/db/**'
      - 'packages/domain/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'

permissions:
  contents: read

concurrency:
  group: recovery-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age
      - name: Restore encrypted synthetic database and receipts
        run: npx --no-install tsx scripts/recovery-proof.ts
