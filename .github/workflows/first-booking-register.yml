name: First booking register regression (manual)
run-name: Analysis-only V8 coverage (${{ github.ref_name }})

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-pilot:
    # This branch-only workflow version is never an integration candidate or a required check.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/analysis/per-spec-v8-coverage-20261030'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the pinned Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Check raw evidence classification without a browser
        run: node --test scripts/dev/coverage-pilot.node-test.mjs
      - name: Build synthetic E2E web with private hidden source maps
        run: npm run build --workspace @budget/web -- --mode e2e --sourcemap hidden
      - name: Build the unchanged synthetic E2E server
        run: npm run build --workspace @budget/server
      - name: Bind evidence to the exact checkout, bundles and hidden maps
        run: node scripts/dev/coverage-pilot.mjs --build-metadata
      - name: Run every existing funding-plan case with raw page coverage
        env:
          TEST_PROJECT: ${{ matrix.project }}
          COVERAGE_PILOT: '1'
        run: >-
          npx playwright test e2e/funding-plan.spec.ts
          --project="$TEST_PROJECT" --workers=1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-pilot-${{ matrix.project }}-${{ github.sha }}
          path: |
            coverage/v8-pilot/
            apps/web/dist/**/*.js
            apps/web/dist/**/*.js.map
          if-no-files-found: error
          retention-days: 7
