name: Visual baselines

# After CI finished on main: re-render the screenshot baselines on Linux and, if any changed, propose
# them in a PR from the bot branch. Feature PRs never carry baseline updates; the `visual` job of CI
# is not required, so a UI change merges first and the baselines follow here. Runs after CI, so it
# never delays the deploy (which waits for CI only). Any CI conclusion counts: the baselines should
# follow main even when an unrelated check was red.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: visual-baselines
  cancel-in-progress: true

jobs:
  update:
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      BOT_BRANCH: bot/visual-baselines
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      # Non-screenshot failures are reported by CI itself, not here.
      - name: Regenerate changed screenshots
        run: |
          npm run build:e2e
          mapfile -t specs < <(grep -lE 'expectScreenshot|toHaveScreenshot' e2e/*.spec.ts)
          npx playwright test --update-snapshots=changed "${specs[@]}" || true
      - name: Commit to the bot branch and open or update the PR
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git diff --quiet -- e2e && [ -z "$(git ls-files --others --exclude-standard -- e2e)" ]; then
            echo 'Baselines match main.'
            # An open bot PR is obsolete now.
            gh pr close "$BOT_BRANCH" --delete-branch --comment "Baselines on main $SHA already match; nothing to update." || true
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BOT_BRANCH"
          git add -A -- e2e
          git commit -m "chore(visual): update baselines for ${SHA:0:7}"
          git push --force origin "$BOT_BRANCH"
          if [ -n "$(gh pr list --head "$BOT_BRANCH" --state open --json number --jq '.[0].number')" ]; then
            echo 'PR exists; branch updated.'
            exit 0
          fi
          for l in 'risk:low' 'area:infra' 'visual-baselines'; do gh label create "$l" --force >/dev/null || true; done
          gh pr create --head "$BOT_BRANCH" --base main --title 'chore(visual): update baselines' \
            --label 'risk:low' --label 'area:infra' --label 'visual-baselines' --body-file - <<'BODY'
          Linux screenshot baselines re-rendered from main by `visual-baselines.yml` after a UI change merged (`ui-change` label).

          Only `e2e/**-snapshots/` changes. Review the changed PNGs, then merge.

          Note for the orchestrator: pushes made with `GITHUB_TOKEN` do not start CI. Push an empty commit to `bot/visual-baselines` to trigger the required checks before merging.
          BODY
