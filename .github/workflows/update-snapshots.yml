name: Temporary native app comparison (never integrate)
run-name: Native app worker comparison ${{ github.sha }}

# Diagnostic branch only. This registered manual workflow runs its --ref version.
# It is never merged and never supplies acceptance or required-check evidence.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Must be diagnostic/589-native-frame-20261022
        required: true
      specs:
        description: Must remain empty; retained only for input compatibility
        required: false
        default: ''
      expected_sha:
        description: Exact independently reviewed diagnostic commit
        required: true

permissions:
  contents: read

concurrency:
  group: native-frame-diagnostic-589
  cancel-in-progress: false

jobs:
  diagnostic:
    if: >-
      github.ref == 'refs/heads/diagnostic/589-native-frame-20261022'
      && inputs.branch == 'diagnostic/589-native-frame-20261022'
      && inputs.specs == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify requested revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed diagnostic source
        run: |
          echo '42b70eb85243d39246f4b40e04a13ba938ad8a5f23ba773b331e160595133007  scripts/diagnostics/webkit-native-frame-repro.cjs' | sha256sum --check
          echo 'b8413e22be31e8e4f27650f84aba3315684aca20890ae468266ffbb84b9d7496  e2e/issue-589-plan-filters.spec.ts' | sha256sum --check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install pinned browsers including setup dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Build exact product once
        run: npm run build:e2e
      - name: Record non-sensitive runtime metadata
        run: |
          node -e 'const os = require("node:os"); console.log(JSON.stringify({node:process.version, platform:process.platform, arch:process.arch, release:os.release(), cpuCount:os.cpus().length, availableParallelism:os.availableParallelism()}))'
          cat /etc/os-release
      - name: Compare one and two workers (diagnostic only)
        run: |
          mkdir -p diagnostic-results
          combined_status=0
          for worker_count in 1 2; do
            echo "NATIVE_DIAGNOSTIC_ARM workers=$worker_count"
            set +e
            PLAYWRIGHT_JSON_OUTPUT_FILE="diagnostic-results/workers-$worker_count.json" \
              /usr/bin/time -v -o "diagnostic-results/workers-$worker_count-resource.txt" \
              npx playwright test e2e/issue-589-plan-filters.spec.ts \
                --project=webkit-iphone --grep 'Plan filters configured' \
                --workers="$worker_count" --retries=0 --reporter=list,json \
                --output="diagnostic-results/workers-$worker_count"
            arm_status=$?
            set -e
            echo "NATIVE_DIAGNOSTIC_RESULT workers=$worker_count exit=$arm_status"
            echo "$arm_status" > "diagnostic-results/workers-$worker_count-exit.txt"
            cat "diagnostic-results/workers-$worker_count-resource.txt"
            if [ "$arm_status" -ne 0 ]; then combined_status=1; fi
          done
          exit "$combined_status"
      - name: Preserve separate diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-app-worker-comparison
          path: diagnostic-results/
          retention-days: 7
