name: Update e2e snapshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and workflow-only delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git show -s --format=%P HEAD)" = "7f6bd0877bde08b51d0efaf59cac7ccf4957dfad"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: format
        name: Scoped formatting with pinned patch collection
        continue-on-error: true
        run: |
          paths=(apps/web/src/budget/plan-inspector.tsx apps/web/src/budget/plan-menus.test.tsx apps/web/src/budget/plan-menus.tsx apps/web/src/budget/plan-model.test.ts apps/web/src/budget/plan-page.tsx apps/web/src/budget/plan-panel-592-593.test.tsx docs/handoff/plan-parent-residuals-449-450.md e2e/issue-449-450-plan-completion.spec.ts e2e/issue-592-593-plan-panel.spec.ts)
          : > proof-format.patch
          if npx prettier --check "${paths[@]}"; then exit 0; fi
          npx prettier --write "${paths[@]}"
          git diff --binary -- "${paths[@]}" > proof-format.patch
          git restore -- "${paths[@]}"
          test -s proof-format.patch
          exit 1
      - id: lint
        name: Scoped ESLint
        continue-on-error: true
        run: npx eslint apps/web/src/budget/plan-inspector.tsx apps/web/src/budget/plan-menus.test.tsx apps/web/src/budget/plan-menus.tsx apps/web/src/budget/plan-model.test.ts apps/web/src/budget/plan-page.tsx apps/web/src/budget/plan-panel-592-593.test.tsx e2e/issue-449-450-plan-completion.spec.ts e2e/issue-592-593-plan-panel.spec.ts
      - id: types
        name: Full workspace typecheck
        continue-on-error: true
        run: npm run typecheck
      - id: css
        name: Design-token CSS check
        continue-on-error: true
        run: node packages/ui/scripts/check-css-scale.mjs
      - id: units
        name: Literal Plan preview menus title privacy and guarded assignment Undo
        continue-on-error: true
        run: |
          npx vitest run apps/web/src/budget/plan-model.test.ts apps/web/src/budget/plan-menus.test.tsx apps/web/src/budget/plan-panel-592-593.test.tsx apps/server/src/api/budget.test.ts apps/server/src/api/plan-reset-592.test.ts
      - id: build
        name: Build for browser proof
        continue-on-error: true
        run: npm run build:e2e
      - id: browser
        name: Full new449 preview case in three canonical profiles
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          selection=(e2e/issue-449-450-plan-completion.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0)
          npx playwright test "${selection[@]}" --list --update-snapshots=none > proof-selection.txt
          cat proof-selection.txt
          feature_count=$(grep -Fc '449 all-target preview' proof-selection.txt)
          test "$feature_count" -eq 3
          for profile in desktop mobile webkit-iphone; do
            profile_count=$(grep -F "[$profile]" proof-selection.txt | grep -Fc '449 all-target preview')
            test "$profile_count" -eq 1
          done
          npx playwright test "${selection[@]}" --update-snapshots=none
      - name: Preserve new449 evidence before compatibility cleanup
        if: always()
        run: |
          if test -d test-results; then cp -a test-results proof-new-case-results; fi
      - id: compatibility
        name: Complete old588 menu and Undo plus changed592593 panel cases
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          npx playwright test e2e/issue-588-plan-menus.spec.ts e2e/issue-588-plan-menus-undo.spec.ts e2e/issue-592-593-plan-panel.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - id: baselines
        name: Assert no tracked mutation or baseline update
        continue-on-error: true
        run: git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: plan-parent-449-450-evidence
          path: |
            proof-format.patch
            proof-selection.txt
            proof-legacy-case-results/**/*.png
            proof-legacy-case-results/**/*.zip
            proof-legacy-case-results/**/*.md
            proof-new-case-results/**/*.png
            proof-new-case-results/**/*.zip
            proof-new-case-results/**/*.md
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: ignore
          retention-days: 3
      - name: Report actual scoped result
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          CSS: ${{ steps.css.outcome }}
          UNITS: ${{ steps.units.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          COMPATIBILITY: ${{ steps.compatibility.outcome }}
          BASELINES: ${{ steps.baselines.outcome }}
        run: |
          echo "RESULT format=$FORMAT lint=$LINT types=$TYPES css=$CSS units=$UNITS build=$BUILD browser=$BROWSER compatibility=$COMPATIBILITY baselines=$BASELINES"
          test "$FORMAT" = success && test "$LINT" = success && test "$TYPES" = success && test "$CSS" = success && test "$UNITS" = success && test "$BUILD" = success && test "$BROWSER" = success && test "$COMPATIBILITY" = success && test "$BASELINES" = success
