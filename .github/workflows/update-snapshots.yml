name: Reports 801 supported maximum desktop saved views proof
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      specs:
        required: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 2
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Pin exact reviewed source and two path delta
        run: |
          test "$(git rev-parse HEAD^)" = 9002e8617cb24987ebae20732d192bd7a671baa4
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/update-snapshots.yml
          git fetch --no-tags origin 5c3e3dcca4c3797edaa818ab210d8166498a4e2a
          git cat-file -e '5c3e3dcca4c3797edaa818ab210d8166498a4e2a^{commit}'
          git diff --name-only 5c3e3dcca4c3797edaa818ab210d8166498a4e2a 9002e8617cb24987ebae20732d192bd7a671baa4 > /tmp/801-max-paths.txt
          test "$(wc -l < /tmp/801-max-paths.txt)" -eq 2
          cat /tmp/801-max-paths.txt
          git rev-parse HEAD HEAD^
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Scoped formatter
        id: format
        run: xargs -d '\n' npx prettier --check < /tmp/801-max-paths.txt
      - name: Durable exact formatting patch
        if: always()
        run: |
          xargs -d '\n' npx prettier --write < /tmp/801-max-paths.txt
          git diff --binary > /tmp/801-max-format.patch
          sha256sum /tmp/801-max-format.patch
          git diff --stat
      - name: Scoped lint
        id: lint
        if: always()
        run: npx eslint e2e/issue-619-628-reports-hub.spec.ts
      - name: CSS scale
        id: css
        if: always()
        run: node packages/ui/scripts/check-css-scale.mjs
      - name: Full typecheck
        id: types
        if: always()
        run: npm run typecheck
      - name: Build E2E
        id: build
        if: always()
        run: npm run build:e2e
      - name: Complete supported maximum saved views desktop case
        id: browser
        if: always()
        run: npx playwright test e2e/issue-619-628-reports-hub.spec.ts --grep '619 supported maximum saved views' --project=desktop --workers=1 --retries=0 --update-snapshots=none
      - name: Baseline mutation guard and truthful outcomes
        if: always()
        run: |
          test -z "$(git diff --name-only -- 'e2e/*snapshots*')"
          echo 'RESULT format=${{ steps.format.outcome }} lint=${{ steps.lint.outcome }} CSS=${{ steps.css.outcome }} types=${{ steps.types.outcome }} build=${{ steps.build.outcome }} browser=${{ steps.browser.outcome }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reports-801-max-state-proof
          path: |
            /tmp/801-max-format.patch
            /tmp/801-max-paths.txt
            test-results/
          retention-days: 7
