name: Ledger FX and upcoming focused proof
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      specs:
        required: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format only reviewed repair paths and retain whole patch
        run: |
          npx prettier --write apps/server/src/api/booking-filter-594.test.ts apps/web/src/ledger/booking-table-581.test.tsx apps/web/src/ledger/booking-table.tsx apps/web/src/ledger/bookings-page.tsx apps/web/src/ledger/mutations.test.tsx docs/ledger-filters-594.md
          git diff --binary > /tmp/594-fx-upcoming-format.patch
          sha256sum /tmp/594-fx-upcoming-format.patch
          git diff --stat
      - name: Scoped ESLint
        run: npx eslint apps/server/src/api/booking-filter-594.test.ts apps/web/src/ledger/booking-table-581.test.tsx apps/web/src/ledger/booking-table.tsx apps/web/src/ledger/bookings-page.tsx apps/web/src/ledger/mutations.test.tsx
      - name: Full typecheck
        if: always()
        run: npm run typecheck
      - name: Complete existing balance and literal full-filter FX pending rollback files
        if: always()
        run: npx vitest run apps/web/src/ledger/booking-table-581.test.tsx apps/server/src/api/booking-filter-594.test.ts apps/web/src/ledger/mutations.test.tsx apps/web/src/ledger/cache.test.ts
      - name: Build E2E
        if: always()
        run: npm run build:e2e
      - name: Unchanged FX upcoming and exact full-filter acceptance
        if: always()
        run: npx playwright test e2e/fx-detail.spec.ts e2e/register-upcoming.spec.ts e2e/issue-594-ledger-filters.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ledger-594-fx-upcoming-proof
          path: |
            /tmp/594-fx-upcoming-format.patch
            test-results/
          retention-days: 7
