name: Validate globals 229 Linux preflight

# Temporary helper branch only; never copy this workflow into the task PR.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Frozen helper branch to validate (never main)
        required: true

permissions:
  contents: read

concurrency:
  group: globals-229-preflight-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.branch != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source base before running checks
        env:
          SOURCE_SHA: 85141290603c9e506d1dd043a1014a0dc5a6359d
        run: |
          git cat-file -e "$SOURCE_SHA^{commit}"
          git diff --exit-code "$SOURCE_SHA" HEAD -- . ':(exclude).github/workflows/update-snapshots.yml'
          git diff --check "$SOURCE_SHA" HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Complete repository check
        env:
          BUDGET_REQUIRE_AGE: '1'
        run: npm run check
      - name: Verify source stayed unchanged
        env:
          SOURCE_SHA: 85141290603c9e506d1dd043a1014a0dc5a6359d
        run: |
          git diff --exit-code "$SOURCE_SHA" HEAD -- . ':(exclude).github/workflows/update-snapshots.yml'
          git diff --exit-code
          git diff --cached --exit-code
          git diff --check
