name: Update e2e snapshots
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      specs:
        required: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format changed files and retain exact mechanical patch
        run: |
          npx prettier --write apps/server/src/api/api.test.ts apps/server/src/api/booking-bulk-596.test.ts apps/server/src/api/bookings.ts apps/server/src/api/schemas.ts apps/web/src/ledger/api.ts apps/web/src/ledger/booking-selection-bar.tsx apps/web/src/ledger/booking-table.tsx apps/web/src/ledger/bookings-page.tsx apps/web/src/ledger/cache.ts apps/web/src/ledger/labels.ts apps/web/src/ledger/ledger.css apps/web/src/ledger/mutations.ts docs/bulk-change-bar-596.md e2e/issue-596-bulk-change-bar.spec.ts packages/db/src/repos/booking-bulk-eligibility.ts packages/db/src/repos/index.ts
          git diff --binary > /tmp/596-format.patch
      - name: Scoped ESLint
        run: npx eslint apps/server/src/api/api.test.ts apps/server/src/api/booking-bulk-596.test.ts apps/server/src/api/bookings.ts apps/server/src/api/schemas.ts apps/web/src/ledger/api.ts apps/web/src/ledger/booking-selection-bar.tsx apps/web/src/ledger/booking-table.tsx apps/web/src/ledger/bookings-page.tsx apps/web/src/ledger/cache.ts apps/web/src/ledger/labels.ts apps/web/src/ledger/mutations.ts e2e/issue-596-bulk-change-bar.spec.ts packages/db/src/repos/booking-bulk-eligibility.ts packages/db/src/repos/index.ts
      - name: Typecheck
        if: always()
        run: npm run typecheck
      - name: Literal API and affected existing unit tests
        if: always()
        run: npx vitest run apps/server/src/api/booking-bulk-596.test.ts apps/server/src/api/api.test.ts apps/web/src/ledger/cache.test.ts apps/web/src/ledger/ledger-helpers.test.ts apps/web/src/ledger/mutations.test.tsx apps/web/src/ledger/booking-table-581.test.tsx
      - name: Build E2E
        if: always()
        run: npm run build:e2e
      - name: Three-profile first-attempt browser acceptance
        if: always()
        run: npx playwright test e2e/issue-596-bulk-change-bar.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bulk-596-focused-proof
          path: |
            /tmp/596-format.patch
            test-results/
          retention-days: 7
