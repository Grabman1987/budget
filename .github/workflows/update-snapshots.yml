name: Reports 801 old compatibility and approved visual proof
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      specs:
        required: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 2
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pin baseline source and complete formatting allowlist
        run: |
          git fetch --no-tags origin ee6b85bd73df1a08a77d7ec588df5db3cda4bebe
          git cat-file -e 'ee6b85bd73df1a08a77d7ec588df5db3cda4bebe^{commit}'
          test "$(git rev-parse HEAD^)" = 5ac6cdc5de195d17a7f8e1b4ab7f3624fdf3c66d
          git cat-file -e '5ac6cdc5de195d17a7f8e1b4ab7f3624fdf3c66d^{commit}'
          git rev-parse HEAD
          git rev-parse HEAD^
          git diff --name-only ee6b85bd73df1a08a77d7ec588df5db3cda4bebe 5ac6cdc5de195d17a7f8e1b4ab7f3624fdf3c66d > /tmp/801-format-paths.txt
          test "$(wc -l < /tmp/801-format-paths.txt)" -eq 8
          cat /tmp/801-format-paths.txt
          cp /tmp/801-format-paths.txt /tmp/801-all-paths.txt
          grep -E '\.(ts|tsx|css|md)$' /tmp/801-all-paths.txt > /tmp/801-format-paths.txt
          test "$(wc -l < /tmp/801-format-paths.txt)" -eq 6
      - name: Scoped Prettier check
        run: xargs -d '\n' npx prettier --check < /tmp/801-format-paths.txt
      - name: Retain exact whole formatting patch
        if: always()
        run: |
          xargs -d '\n' npx prettier --write < /tmp/801-format-paths.txt
          git diff --binary > /tmp/801-format.patch
          sha256sum /tmp/801-format.patch
          git diff --stat
      - name: Scoped ESLint
        if: always()
        run: grep -E '\.(ts|tsx)$' /tmp/801-format-paths.txt | xargs -d '\n' npx eslint
      - name: CSS token scale
        if: always()
        run: node packages/ui/scripts/check-css-scale.mjs
      - name: Full typecheck
        if: always()
        run: npm run typecheck
      - name: Complete unchanged old AreaHead compatibility units
        if: always()
        run: npx vitest run apps/web/src/pages/area-head-566.test.tsx apps/web/src/pages/area-head.test.tsx --maxWorkers=1 --reporter=verbose
      - name: Build E2E
        if: always()
        run: npm run build:e2e
      - name: Old exact 64px desktop report frame cases
        if: always()
        run: npx playwright test e2e/issue-552-report-frame.spec.ts --grep 'one period control, head of 64 px' --project=desktop --workers=1 --retries=0 --update-snapshots=none
      - name: Retain original frame results before next default invocation
        if: always()
        run: cp -a test-results /tmp/801-frame-results
      - name: Old full ranges active-route and exact Reports-light baselines
        if: always()
        run: npx playwright test e2e/income-targets-report-ranges.spec.ts e2e/shell.spec.ts --grep 'shared ranges, custom URL reload and optional trend|the active area is marked|light reports' --project=desktop --project=mobile --workers=1 --retries=0 --update-snapshots=none
      - name: Tracked baseline source mutation guard
        if: always()
        run: |
          git diff --name-only
          test -z "$(git diff --name-only -- 'e2e/*snapshots*')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reports-801-compatibility-proof
          path: |
            /tmp/801-format.patch
            /tmp/801-format-paths.txt
            /tmp/801-all-paths.txt
            /tmp/801-frame-results/
            test-results/
          retention-days: 7
