name: Portfolio follow-on narrow proof
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Disposable exact-d5 proof branch
        required: true
      specs:
        description: Reserved; exact selections pinned below
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: portfolio-followon-narrow-${{ inputs.branch }}
  cancel-in-progress: false
jobs:
  focused:
    if: inputs.branch == 'codex/portfolio-followon-narrow-d5bee3'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Narrow exact-source checks and unchanged mobile trace diagnosis
        run: |
          set +e
          set -o pipefail
          mkdir -p proof-output
          source_sha=d5bee3f69f1e2609a0d8418e941a2dd9730dc399
          test "$(git rev-parse HEAD^)" = "$source_sha" || exit 70
          git diff --exit-code "$source_sha" HEAD -- apps packages e2e docs/handoff || exit 71
          printf 'SOURCE=%s PROOF=%s\n' "$source_sha" "$(git rev-parse HEAD)" | tee proof-output/source.txt
          mapfile -t targets < <(git diff --name-only 98f650cf6e2ae811a4e7686f0095f2e08626ffe5 "$source_sha" -- apps packages e2e docs/handoff)
          printf '%s\n' "${targets[@]}" > proof-output/source-allowlist.txt
          npx prettier --check "${targets[@]}" 2>&1 | tee proof-output/format.log
          format_code=${PIPESTATUS[0]}
          if [ "$format_code" -ne 0 ]; then
            npx prettier --write "${targets[@]}" 2>&1 | tee proof-output/format-write.log
            git diff --binary -- "${targets[@]}" > proof-output/format.patch
            git diff --numstat -- "${targets[@]}" > proof-output/format-numstat.txt
            sha256sum proof-output/format.patch | tee proof-output/format.sha256
            git restore -- "${targets[@]}"
          fi
          mapfile -t typescript < <(printf '%s\n' "${targets[@]}" | grep -E '\.(ts|tsx)$')
          npx eslint "${typescript[@]}" 2>&1 | tee proof-output/eslint.log
          lint_code=${PIPESTATUS[0]}
          npm run typecheck 2>&1 | tee proof-output/typecheck.log
          type_code=${PIPESTATUS[0]}
          npx vitest run apps/server/src/api/instrument-history-547.test.ts apps/server/src/api/portfolio-metrics-546.test.ts apps/server/src/api/portfolio-performance.test.ts apps/server/src/api/portfolio-positions.test.ts apps/server/src/api/savings-schedules.test.ts apps/server/src/api/savings-confirmation.test.ts apps/web/src/wealth/price-history.test.tsx apps/web/src/wealth/instrument-axis-547.test.ts apps/web/src/wealth/savings-month-strip-548.test.ts apps/web/src/wealth/savings-model.test.ts apps/web/src/wealth/portfolio-format.test.ts packages/db/src/repos/portfolio-series.test.ts packages/db/src/repos/portfolio-missing-quotes.test.ts packages/db/src/repos/portfolio-risk-policy.test.ts packages/db/src/repos/portfolio-summary-fx.test.ts --maxWorkers=1 2>&1 | tee proof-output/unit.log
          unit_code=${PIPESTATUS[0]}
          npm run build:e2e 2>&1 | tee proof-output/build.log
          build_code=${PIPESTATUS[0]}
          collect() {
            mkdir -p "proof-output/$1"
            find test-results -type f \( -name '*.png' -o -name 'error-context.md' -o -name 'trace.zip' -o -name '*.json' \) ! -path '*/.auth/*' -exec cp --parents '{}' "proof-output/$1/" \;
          }
          metrics_code=1
          details_code=1
          registers_code=1
          legacy_code=1
          if [ "$build_code" -eq 0 ]; then
            date -u '+metrics-start %FT%TZ' | tee -a proof-output/timing.log
            npx playwright test e2e/issue-546-portfolio-metrics.spec.ts --grep '546 metrics share|representative thirteen-date' --project=desktop --workers=1 --retries=0 --update-snapshots=none 2>&1 | tee proof-output/metrics.log
            metrics_code=${PIPESTATUS[0]}
            collect metrics
            date -u '+details-start %FT%TZ' | tee -a proof-output/timing.log
            npx playwright test e2e/issue-547-548-portfolio-details.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --trace=on --update-snapshots=none 2>&1 | tee proof-output/details.log
            details_code=${PIPESTATUS[0]}
            collect details
            date -u '+registers-start %FT%TZ' | tee -a proof-output/timing.log
            npx playwright test e2e/issue-544-portfolio-registers.spec.ts --grep 'five portfolio registers preserve period' --project=desktop --workers=1 --retries=0 --update-snapshots=none 2>&1 | tee proof-output/registers.log
            registers_code=${PIPESTATUS[0]}
            collect registers
            date -u '+unchanged-mobile-start %FT%TZ' | tee -a proof-output/timing.log
            DEBUG=pw:api npx playwright test e2e/portfolio-positions.spec.ts e2e/portfolio-trades.spec.ts --grep 'portfolio instrument details support keyboard editing and survive reload|manual buy, partial sell, source edit and group undo refresh holdings and cash' --project=mobile --workers=1 --retries=0 --trace=on --update-snapshots=none 2>&1 | tee proof-output/legacy-mobile.log
            legacy_code=${PIPESTATUS[0]}
            collect legacy-mobile
            date -u '+proof-end %FT%TZ' | tee -a proof-output/timing.log
          fi
          git diff --stat | tee proof-output/final-diff.txt
          printf 'RESULT format=%s lint=%s type=%s unit=%s build=%s metrics=%s details=%s registers=%s unchanged-mobile=%s\n' "$format_code" "$lint_code" "$type_code" "$unit_code" "$build_code" "$metrics_code" "$details_code" "$registers_code" "$legacy_code" | tee proof-output/result.txt
          [ "$format_code" -eq 0 ] && [ "$lint_code" -eq 0 ] && [ "$type_code" -eq 0 ] && [ "$unit_code" -eq 0 ] && [ "$build_code" -eq 0 ] && [ "$metrics_code" -eq 0 ] && [ "$details_code" -eq 0 ] && [ "$registers_code" -eq 0 ] && [ "$legacy_code" -eq 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: portfolio-followon-narrow-d5
          path: proof-output/
          if-no-files-found: warn
          retention-days: 7
