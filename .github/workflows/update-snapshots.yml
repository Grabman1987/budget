name: Update e2e snapshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and workflow-only delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git show -s --format=%P HEAD)" = "9703f95f394692df5cd4f13629883f67d82c7fc4"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: format
        name: Scoped formatting with pinned patch collection
        continue-on-error: true
        run: |
          paths=(apps/web/src/nav/areas.ts apps/web/src/pages/area-head-report.test.tsx apps/web/src/pages/reports-pages.tsx apps/web/src/reports/explorer-report.css apps/web/src/reports/explorer-report.tsx apps/web/src/reports/explorer-view-api.ts apps/web/src/reports/report-hub-619.test.ts apps/web/src/reports/report-hub-model.ts apps/web/src/reports/report-hub.css apps/web/src/reports/report-hub.tsx apps/web/src/reports/report-navigation.css apps/web/src/reports/report-navigation.test.tsx apps/web/src/reports/report-navigation.tsx apps/web/src/reports/report-search.ts apps/web/src/reports/saved-explorer-628.test.tsx apps/web/src/reports/saved-explorer-links.css apps/web/src/reports/saved-explorer-links.tsx docs/handoff/reports-hub-619-628.md e2e/assets-debts-report.spec.ts e2e/issue-619-628-reports-hub.spec.ts e2e/nav-registers.spec.ts e2e/reports-search-package.spec.ts e2e/shell.spec.ts)
          : > proof-format.patch
          if npx prettier --check "${paths[@]}"; then exit 0; fi
          npx prettier --write "${paths[@]}"
          git diff --binary -- "${paths[@]}" > proof-format.patch
          git restore -- "${paths[@]}"
          test -s proof-format.patch
          exit 1
      - id: lint
        name: Scoped ESLint
        continue-on-error: true
        run: npx eslint apps/web/src/nav/areas.ts apps/web/src/pages/area-head-report.test.tsx apps/web/src/pages/reports-pages.tsx apps/web/src/reports/explorer-report.tsx apps/web/src/reports/explorer-view-api.ts apps/web/src/reports/report-hub-619.test.ts apps/web/src/reports/report-hub-model.ts apps/web/src/reports/report-hub.tsx apps/web/src/reports/report-navigation.test.tsx apps/web/src/reports/report-navigation.tsx apps/web/src/reports/report-search.ts apps/web/src/reports/saved-explorer-628.test.tsx apps/web/src/reports/saved-explorer-links.tsx e2e/assets-debts-report.spec.ts e2e/issue-619-628-reports-hub.spec.ts e2e/nav-registers.spec.ts e2e/reports-search-package.spec.ts e2e/shell.spec.ts
      - id: types
        name: Full workspace typecheck
        continue-on-error: true
        run: npm run typecheck
      - id: css
        name: Design-token CSS check
        continue-on-error: true
        run: node packages/ui/scripts/check-css-scale.mjs
      - id: units
        name: Literal hub and saved-entry units plus affected router fixtures
        continue-on-error: true
        run: npx vitest run apps/web/src/reports/report-hub-619.test.ts apps/web/src/reports/saved-explorer-628.test.tsx apps/web/src/reports/report-navigation.test.tsx apps/web/src/pages/area-head-report.test.tsx
      - id: build
        name: Build for browser proof
        continue-on-error: true
        run: npm run build:e2e
      - id: browser
        name: Full new hub and saved-entry cases in three profiles
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: npx playwright test e2e/issue-619-628-reports-hub.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - id: compatibility
        name: Direct old hub navigation and catalog consumers
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: npx playwright test e2e/shell.spec.ts e2e/nav-registers.spec.ts e2e/assets-debts-report.spec.ts e2e/reports-search-package.spec.ts --grep 'the report hub lists sixteen|other area register rows|mapped wealth report|navigation by clicking: areas|everyday terms keep' --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - id: baselines
        name: Assert no tracked mutation or baseline update
        continue-on-error: true
        run: git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reports-619-628-focused-evidence
          path: |
            proof-format.patch
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: ignore
          retention-days: 3
      - name: Report actual scoped result
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          CSS: ${{ steps.css.outcome }}
          UNITS: ${{ steps.units.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          COMPATIBILITY: ${{ steps.compatibility.outcome }}
          BASELINES: ${{ steps.baselines.outcome }}
        run: |
          echo "RESULT format=$FORMAT lint=$LINT types=$TYPES css=$CSS units=$UNITS build=$BUILD browser=$BROWSER compatibility=$COMPATIBILITY baselines=$BASELINES"
          test "$FORMAT" = success && test "$LINT" = success && test "$TYPES" = success && test "$CSS" = success && test "$UNITS" = success && test "$BUILD" = success && test "$BROWSER" = success && test "$COMPATIBILITY" = success && test "$BASELINES" = success
