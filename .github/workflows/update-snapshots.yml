name: Report answer exact formatting proof
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Disposable exact-source branch
        required: true
permissions:
  contents: read
concurrency:
  group: report-answer-format-${{ inputs.branch }}
  cancel-in-progress: false
jobs:
  format:
    if: inputs.branch == 'codex/report-answer-format-7a67ad43'
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check exact reviewed formatting without changing source
        run: |
          set +e
          set -o pipefail
          mkdir -p proof-output
          source_sha=7a67ad439a11be8e44647ccbda0a35aff0aaa372
          test "$(git rev-parse HEAD^)" = "$source_sha" || exit 70
          git diff --exit-code "$source_sha" HEAD -- apps packages e2e docs || exit 71
          printf 'SOURCE=%s PROOF=%s\n' "$source_sha" "$(git rev-parse HEAD)" | tee proof-output/source.txt
          mapfile -t targets < <(git diff --name-only 531e4b1b9cb642a4f44776beb5af705af8c4813a "$source_sha" -- apps e2e docs)
          printf '%s\n' "${targets[@]}" > proof-output/allowlist.txt
          npx prettier --check "${targets[@]}" 2>&1 | tee proof-output/format.log
          format_code=${PIPESTATUS[0]}
          git diff --binary -- apps packages e2e docs > proof-output/source.patch
          sha256sum proof-output/source.patch | tee proof-output/source.sha256
          printf 'RESULT format=%s\n' "$format_code" | tee proof-output/result.txt
          [ "$format_code" -eq 0 ] && [ ! -s proof-output/source.patch ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: report-answer-format-7a67ad43
          path: proof-output/
          if-no-files-found: warn
          retention-days: 7
