name: Focused DS2 DS3 residual proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Verify exact source and workflow-only delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = 'f7fdf696a3a7c9b8a34a3d0c2786c4a7dd5bd084'
          test "$(git diff --name-only HEAD^..HEAD)" = '.github/workflows/update-snapshots.yml'
          git rev-parse HEAD HEAD^ > source-proof.txt
          git diff --name-only HEAD^..HEAD >> source-proof.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Static, unit and browser checks on exact source
        run: |
          set +e
          npx prettier --check apps/web/src/charts/sankey-chart.tsx packages/ui/src/styles/charts.css apps/web/src/reports/mobile-charts.test.tsx apps/web/src/budget/plan.css e2e/issue-473-474-design-residuals.spec.ts > format.log 2>&1
          format_rc=$?
          npx prettier --write apps/web/src/charts/sankey-chart.tsx packages/ui/src/styles/charts.css apps/web/src/reports/mobile-charts.test.tsx apps/web/src/budget/plan.css e2e/issue-473-474-design-residuals.spec.ts > formatting-patch.log 2>&1
          git diff -- apps/web/src/charts/sankey-chart.tsx packages/ui/src/styles/charts.css apps/web/src/reports/mobile-charts.test.tsx apps/web/src/budget/plan.css e2e/issue-473-474-design-residuals.spec.ts > format.patch
          sha256sum format.patch > format.patch.sha256
          git restore -- apps/web/src/charts/sankey-chart.tsx packages/ui/src/styles/charts.css apps/web/src/reports/mobile-charts.test.tsx apps/web/src/budget/plan.css e2e/issue-473-474-design-residuals.spec.ts
          git diff --exit-code > restored.log 2>&1
          restored_rc=$?
          npx eslint apps/web/src/charts/sankey-chart.tsx apps/web/src/reports/mobile-charts.test.tsx e2e/issue-473-474-design-residuals.spec.ts > lint.log 2>&1
          lint_rc=$?
          node packages/ui/scripts/check-css-scale.mjs > css.log 2>&1
          css_rc=$?
          npm run typecheck > type.log 2>&1
          type_rc=$?
          npx vitest run apps/web/src/reports/mobile-charts.test.tsx packages/ui/src/css-scale.test.ts > unit.log 2>&1
          unit_rc=$?
          npm run build:e2e > build.log 2>&1
          build_rc=$?
          list_rc=1
          browser_rc=1
          if [ "$build_rc" -eq 0 ]; then
            npx playwright test e2e/issue-473-474-design-residuals.spec.ts e2e/chart-inspection.spec.ts e2e/plan-ghost.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none --list > discovery.txt 2>&1
            list_rc=$?
            if [ "$list_rc" -eq 0 ] && [ "$(grep -c 'Sankey keeps Archivo values' discovery.txt)" -eq 3 ] && [ "$(grep -c 'waterfall suggestion keeps' discovery.txt)" -eq 3 ] && grep -q '\[webkit-iphone\]' discovery.txt; then
              npx playwright test e2e/issue-473-474-design-residuals.spec.ts e2e/chart-inspection.spec.ts e2e/plan-ghost.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none > browser.log 2>&1
              browser_rc=$?
            else
              echo 'Expected three-profile design cases missing' > browser.log
              cat discovery.txt >> browser.log
            fi
          fi
          tail -n 20 format.log lint.log css.log type.log unit.log build.log discovery.txt browser.log 2>/dev/null
          echo "RESULT restored=$restored_rc format=$format_rc lint=$lint_rc css=$css_rc type=$type_rc unit=$unit_rc build=$build_rc list=$list_rc browser=$browser_rc"
          test "$restored_rc" -eq 0 && test "$format_rc" -eq 0 && test "$lint_rc" -eq 0 && test "$css_rc" -eq 0 && test "$type_rc" -eq 0 && test "$unit_rc" -eq 0 && test "$build_rc" -eq 0 && test "$list_rc" -eq 0 && test "$browser_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ds2-ds3-residual-proof
          path: |
            source-proof.txt
            format.log
            formatting-patch.log
            format.patch
            format.patch.sha256
            restored.log
            lint.log
            css.log
            type.log
            unit.log
            build.log
            discovery.txt
            browser.log
            test-results/**/*.png
            test-results/**/*.json
            test-results/**/trace.zip
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3
