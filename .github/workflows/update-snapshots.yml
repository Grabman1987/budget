name: Reproduce saved filter draft revision overwrite
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin buggy feature source and new real concurrency regression
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "5615add50b326c6b64635fb51d7e12e4ae428461"
          test "$(git rev-parse HEAD^^)" = "121b3928f8ada103eda8e2deefd8aeeadf90a674"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
          test "$(git diff --name-only HEAD^^ HEAD^)" = "e2e/issue-818-ledger-saved-filters.spec.ts"
          test "$(git rev-parse HEAD^:apps/web/src/ledger/booking-views.tsx)" = "$(git rev-parse HEAD^^:apps/web/src/ledger/booking-views.tsx)"
          git restore --source=HEAD^ --worktree -- .github/workflows/update-snapshots.yml
          git diff --exit-code HEAD^
          git rev-parse HEAD HEAD^ HEAD^^ HEAD^:apps/web/src/ledger/booking-views.tsx > source-proof.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check foundation and reproduce real two-client lost update
        run: |
          set +e
          npm run typecheck > type.log 2>&1
          type_rc=$?
          npx vitest run packages/domain/src/ledger/booking-views.test.ts apps/server/src/api/booking-views-818.test.ts apps/web/src/ledger/bookings-search.test.ts > unit.log 2>&1
          unit_rc=$?
          npm run build:e2e > build.log 2>&1
          build_rc=$?
          list_rc=1
          browser_rc=1
          if [ "$build_rc" -eq 0 ]; then
            npx playwright test e2e/issue-818-ledger-saved-filters.spec.ts --project=desktop --grep 'a real background refresh cannot rebase' --list > discovery.log 2>&1
            list_rc=$?
            grep -F '[desktop]' discovery.log | grep -Fq 'a real background refresh cannot rebase' || list_rc=1
            if [ "$list_rc" -eq 0 ]; then
              npx playwright test e2e/issue-818-ledger-saved-filters.spec.ts --project=desktop --grep 'a real background refresh cannot rebase' --workers=1 --retries=0 --update-snapshots=none > browser.log 2>&1
              browser_rc=$?
            fi
          fi
          git diff --quiet HEAD^
          source_rc=$?
          git restore --worktree -- .github/workflows/update-snapshots.yml
          git diff --quiet
          cleanup_rc=$?
          cat type.log unit.log build.log discovery.log browser.log 2>/dev/null
          echo "RESULT type=$type_rc unit=$unit_rc build=$build_rc list=$list_rc browser=$browser_rc original=$source_rc cleanup=$cleanup_rc"
          test "$type_rc" -eq 0 && test "$unit_rc" -eq 0 && test "$build_rc" -eq 0 && test "$list_rc" -eq 0 && test "$browser_rc" -eq 0 && test "$source_rc" -eq 0 && test "$cleanup_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue-818-real-draft-revision-red
          path: |
            source-proof.txt
            *.log
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: ignore
          retention-days: 3
