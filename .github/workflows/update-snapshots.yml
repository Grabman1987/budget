name: Validate pace 265 and triage 237 before PR publication

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Candidate branch to validate (never main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pace-265-linux-preflight-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  preflight:
    if: inputs.branch != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove the source parent and workflow-only helper before install
        env:
          SOURCE_SHA: ca6791486c9d1cae5c081be43bb7d85969d27298
        run: |
          git cat-file -e "$SOURCE_SHA^{commit}"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA" HEAD -- . ':(exclude).github/workflows/update-snapshots.yml'
          git diff --check "$SOURCE_SHA" HEAD
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "Verified helper parent $SOURCE_SHA and workflow-only diff before npm ci."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run focused pace regressions
        run: npx vitest run packages/domain/src/kpi/pace.test.ts apps/web/src/heute/charts.test.tsx --maxWorkers=1

      - name: Run full type, lint, format, and unit gate
        env:
          BUDGET_REQUIRE_AGE: '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          npm run check

      - name: Build production app
        run: npm run build

      - name: Install pinned Chromium and WebKit browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build E2E app
        run: npm run build:e2e

      - name: Verify pace, month close, and plan triage on desktop and mobile
        run: npx playwright test e2e/pace-cap-265.spec.ts e2e/month-close.spec.ts e2e/topbar-plan-triage-237.spec.ts --project=desktop --project=mobile --workers=1

      - name: Verify source, worktree, and index stayed clean
        if: always()
        env:
          SOURCE_SHA: ca6791486c9d1cae5c081be43bb7d85969d27298
        run: |
          git cat-file -e "$SOURCE_SHA^{commit}"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA" HEAD -- . ':(exclude).github/workflows/update-snapshots.yml'
          git diff --check "$SOURCE_SHA" HEAD
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "Source, worktree, and index are clean; no baseline or application changes were produced."

      - name: Upload browser reports and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pace-265-linux-preflight
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
