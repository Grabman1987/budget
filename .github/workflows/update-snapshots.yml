name: Ledger deletion accessibility focused proof
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      specs:
        required: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check reviewed fixture and docs formatting
        run: npx prettier --check apps/web/src/ledger/booking-delete-confirmation.tsx e2e/issue-597-ledger-delete.spec.ts docs/ledger-delete-597.md
      - name: Retain exact scoped formatting patch if needed
        if: always()
        run: |
          npx prettier --write apps/web/src/ledger/booking-delete-confirmation.tsx e2e/issue-597-ledger-delete.spec.ts docs/ledger-delete-597.md
          git diff --binary > /tmp/597-a11y-format.patch
          sha256sum /tmp/597-a11y-format.patch
          git diff --stat
      - name: Scoped ESLint
        run: npx eslint apps/web/src/ledger/booking-delete-confirmation.tsx e2e/issue-597-ledger-delete.spec.ts
      - name: Full typecheck
        if: always()
        run: npm run typecheck
      - name: Build E2E
        if: always()
        run: npm run build:e2e
      - name: Complete new deletion acceptance without retries or snapshots
        if: always()
        run: npx playwright test e2e/issue-597-ledger-delete.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ledger-597-a11y-proof
          path: |
            /tmp/597-a11y-format.patch
            test-results/
          retention-days: 7
