name: Update e2e snapshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and workflow-only delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git show -s --format=%P HEAD)" = "2401c9d8005acfcbb51c0653cc095292bedece1f"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: format
        name: Scoped formatting with pinned patch collection
        continue-on-error: true
        run: |
          paths=(apps/web/src/pages/payee-analysis-report.tsx apps/web/src/pages/reports-pages.tsx apps/web/src/reports/assets-debts-report.tsx apps/web/src/reports/report-consolidation-622-623.test.tsx apps/web/src/reports/report-search.ts apps/web/src/reports/report-views.css apps/web/src/reports/spending-analysis-report.tsx apps/web/src/reports/spending-report-views.tsx apps/web/src/reports/wealth-history-report.tsx apps/web/src/reports/wealth-report-views.tsx apps/web/src/reports/whole-picture-report.test.tsx apps/web/src/reports/whole-picture-report.tsx docs/handoff/report-consolidation-622-623.md e2e/issue-622-623-report-views.spec.ts)
          : > proof-format.patch
          if npx prettier --check "${paths[@]}"; then exit 0; fi
          npx prettier --write "${paths[@]}"
          git diff --binary -- "${paths[@]}" > proof-format.patch
          git restore -- "${paths[@]}"
          test -s proof-format.patch
          exit 1
      - id: lint
        name: Scoped ESLint
        continue-on-error: true
        run: npx eslint apps/web/src/pages/payee-analysis-report.tsx apps/web/src/pages/reports-pages.tsx apps/web/src/reports/assets-debts-report.tsx apps/web/src/reports/report-consolidation-622-623.test.tsx apps/web/src/reports/report-search.ts apps/web/src/reports/spending-analysis-report.tsx apps/web/src/reports/spending-report-views.tsx apps/web/src/reports/wealth-history-report.tsx apps/web/src/reports/wealth-report-views.tsx apps/web/src/reports/whole-picture-report.test.tsx apps/web/src/reports/whole-picture-report.tsx e2e/issue-622-623-report-views.spec.ts
      - id: types
        name: Full workspace typecheck
        continue-on-error: true
        run: npm run typecheck
      - id: css
        name: Design-token CSS check
        continue-on-error: true
        run: node packages/ui/scripts/check-css-scale.mjs
      - id: build
        name: Build for browser proof
        continue-on-error: true
        run: npm run build:e2e
      - id: browser
        name: Assert six real selected623 theme cases then execute all six
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          selection=(e2e/issue-622-623-report-views.spec.ts --grep '623 each fixed-date wealth view' --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0)
          npx playwright test "${selection[@]}" --list --update-snapshots=none > proof-selection.txt
          cat proof-selection.txt
          feature_count=$(grep -Fc '623 each fixed-date wealth view' proof-selection.txt)
          test "$feature_count" -eq 6
          for profile in desktop mobile webkit-iphone; do
            profile_count=$(grep -F "[$profile]" proof-selection.txt | grep -Fc '623 each fixed-date wealth view')
            test "$profile_count" -eq 2
          done
          npx playwright test "${selection[@]}" --update-snapshots=none
      - name: Preserve new622 and623 evidence before legacy cleanup
        if: always()
        run: |
          if test -d test-results; then cp -a test-results proof-new-case-results; fi
      - id: baselines
        name: Assert no tracked mutation or baseline update
        continue-on-error: true
        run: git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: report-consolidation-622-623-evidence
          path: |
            proof-format.patch
            proof-selection.txt
            proof-new-case-results/**/*.png
            proof-new-case-results/**/*.zip
            proof-new-case-results/**/*.md
            proof-new-case-results/**/*.json
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
            test-results/**/*.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Report actual scoped result
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          CSS: ${{ steps.css.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          BASELINES: ${{ steps.baselines.outcome }}
        run: |
          echo "RESULT format=$FORMAT lint=$LINT types=$TYPES css=$CSS build=$BUILD browser=$BROWSER baselines=$BASELINES"
          test "$FORMAT" = success && test "$LINT" = success && test "$TYPES" = success && test "$CSS" = success && test "$BUILD" = success && test "$BROWSER" = success && test "$BASELINES" = success
