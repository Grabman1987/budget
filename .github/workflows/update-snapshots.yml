name: Diagnose remaining Heute placeholder geometry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin exact diagnostic source and restore canonical workflow
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "02cf9f98ef0fcbbd9fe1ce77d70bd88f8c25de49"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
          printf '%s\n' apps/web/src/heute/attention-bar.tsx apps/web/src/heute/heute-page.tsx apps/web/src/heute/heute.css apps/web/src/heute/kennzahlen.tsx apps/web/src/heute/section-states.test.tsx apps/web/src/heute/valuation-attention-511.test.tsx apps/web/src/pwa/offline-wealth-comparison.test.tsx e2e/issue-574-heute-section-states.spec.ts e2e/issue-575-heute-phone-viewport.spec.ts > expected-paths.txt
          git diff --name-only dfd441a82b93813a8168d8fbc442349a5ad79475 HEAD^ > actual-paths.txt
          diff -u expected-paths.txt actual-paths.txt
          git restore --source=HEAD^ --worktree -- .github/workflows/update-snapshots.yml
          git diff --exit-code HEAD^
          git rev-parse HEAD HEAD^ > source-proof.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify state fixture and measure only the failing initial geometry
        run: |
          set +e
          npm run typecheck > type.log 2>&1
          type_rc=$?
          npx vitest run apps/web/src/heute apps/web/src/pwa/offline-wealth-comparison.test.tsx apps/server/src/api/heute.test.ts packages/fixtures/src/heute.test.ts > unit.log 2>&1
          unit_rc=$?
          npm run build:e2e > build.log 2>&1
          build_rc=$?
          list_rc=1
          browser_rc=1
          if [ "$build_rc" -eq 0 ]; then
            npx playwright test e2e/issue-574-heute-section-states.spec.ts --grep 'initial section placeholders keep above-fold geometry' --project=desktop --project=mobile --project=webkit-iphone --list > discovery.log 2>&1
            list_rc=$?
            for profile in desktop mobile webkit-iphone; do
              test "$(grep -c "\[$profile\].*issue-574-heute-section-states.spec.ts.*initial section placeholders keep above-fold geometry" discovery.log)" -eq 1 || list_rc=1
            done
            if [ "$list_rc" -eq 0 ]; then
              npx playwright test e2e/issue-574-heute-section-states.spec.ts --grep 'initial section placeholders keep above-fold geometry' --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none > browser.log 2>&1
              browser_rc=$?
            fi
          fi
          git restore --worktree -- .github/workflows/update-snapshots.yml
          git diff --name-status > post-runtime-changes.txt
          git diff --quiet
          cleanup_rc=$?
          cat type.log unit.log build.log discovery.log browser.log 2>/dev/null
          echo "RESULT type=$type_rc unit=$unit_rc build=$build_rc list=$list_rc browser=$browser_rc cleanup=$cleanup_rc"
          test "$type_rc" -eq 0 && test "$unit_rc" -eq 0 && test "$build_rc" -eq 0 && test "$list_rc" -eq 0 && test "$browser_rc" -eq 0 && test "$cleanup_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue-574-initial-geometry-diagnostic
          path: |
            source-proof.txt
            *paths.txt
            post-runtime-changes.txt
            *.log
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: ignore
          retention-days: 3
