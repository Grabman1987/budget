name: Asset composition literal and visual compatibility proof
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Disposable exact-source branch
        required: true
permissions:
  contents: read
concurrency:
  group: month-overview-${{ inputs.branch }}
  cancel-in-progress: false
jobs:
  focused:
    if: inputs.branch == 'codex/asset-composition-proof-7e41e381'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Exact owned composition literals and full new/old networth specs
        run: |
          set +e
          set -o pipefail
          mkdir -p proof-output
          source_sha=7e41e3816a2f7ce4eb4582306447600e2dc821d0
          test "$(git rev-parse HEAD^)" = "$source_sha" || exit 70
          git diff --exit-code "$source_sha" HEAD -- apps packages e2e docs || exit 71
          printf 'SOURCE=%s PROOF=%s\n' "$source_sha" "$(git rev-parse HEAD)" | tee proof-output/source.txt
          : > proof-output/format.patch
          git cat-file -e 1ad02264f33dd07104fafdf99a58688d34f2856f^{commit} || exit 72
          mapfile -t targets < <(git diff --name-only 1ad02264f33dd07104fafdf99a58688d34f2856f "$source_sha" -- apps packages e2e docs SPEC.md)
          printf '%s\n' "${targets[@]}" > proof-output/allowlist.txt
          npx prettier --check "${targets[@]}" 2>&1 | tee proof-output/format.log
          format_code=${PIPESTATUS[0]}
          if [ "$format_code" -ne 0 ]; then
            npx prettier --write "${targets[@]}" 2>&1 | tee proof-output/format-write.log
            git diff --binary -- "${targets[@]}" > proof-output/format.patch
            git diff --numstat -- "${targets[@]}" > proof-output/format-numstat.txt
            sha256sum proof-output/format.patch | tee proof-output/format.sha256
            git restore -- "${targets[@]}"
          fi
          mapfile -t ts < <(printf '%s\n' "${targets[@]}" | grep -E '\.(ts|tsx)$')
          npx eslint "${ts[@]}" 2>&1 | tee proof-output/eslint.log
          lint_code=${PIPESTATUS[0]}
          npm run typecheck 2>&1 | tee proof-output/typecheck.log
          type_code=${PIPESTATUS[0]}
          node packages/ui/scripts/check-css-scale.mjs 2>&1 | tee proof-output/css-scale.log
          css_code=${PIPESTATUS[0]}
          npx vitest run packages/domain/src/ledger/networth-composition-550.test.ts packages/db/src/repos/networth-composition-550.test.ts apps/server/src/api/networth-composition-550.test.ts apps/web/src/wealth/asset-composition-551.test.tsx packages/domain/src/ledger/networth.test.ts packages/domain/src/ledger/networth-window.test.ts packages/domain/src/ledger/networth-structure.test.ts packages/db/src/repos/portfolio-manual-valuation.test.ts apps/web/src/wealth/networth-model.test.ts apps/web/src/wealth/networth-gespart.test.tsx apps/server/src/api/wealth.test.ts apps/server/src/api/networth-history.test.ts 2>&1 | tee proof-output/unit.log
          unit_code=${PIPESTATUS[0]}
          npm run build:e2e 2>&1 | tee proof-output/build.log
          build_code=${PIPESTATUS[0]}
          browser=1
          if [ "$build_code" -eq 0 ]; then
            date -u '+browser-start %FT%TZ' | tee proof-output/timing.log
            npx playwright test e2e/issue-550-551-asset-composition.spec.ts e2e/networth.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --trace=on --update-snapshots=none 2>&1 | tee proof-output/browser.log
            browser=${PIPESTATUS[0]}
            cp -a test-results proof-output/browser-results
            date -u '+browser-end %FT%TZ' | tee -a proof-output/timing.log
          fi
          sha256sum proof-output/format.patch | tee proof-output/format.sha256
          git diff --binary -- apps packages e2e docs > proof-output/source.patch
          git diff --stat | tee proof-output/final-diff.txt
          printf 'RESULT format=%s lint=%s type=%s css=%s unit=%s build=%s browser=%s\n' "$format_code" "$lint_code" "$type_code" "$css_code" "$unit_code" "$build_code" "$browser" | tee proof-output/result.txt
          [ "$format_code" -eq 0 ] && [ "$lint_code" -eq 0 ] && [ "$type_code" -eq 0 ] && [ "$css_code" -eq 0 ] && [ "$unit_code" -eq 0 ] && [ "$build_code" -eq 0 ] && [ "$browser" -eq 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: asset-composition-7e41e381
          path: proof-output/
          if-no-files-found: warn
          retention-days: 7
