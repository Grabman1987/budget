name: Reports 801 WebKit maximum scrollport diagnostic
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      specs:
        required: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 2
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Exact source and workflow-only parent guard
        run: |
          test "$(git rev-parse HEAD^)" = 2de896ee9a1034bdbb4ef71523a1ce58e9602ff0
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/update-snapshots.yml
          git rev-parse HEAD HEAD^
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:e2e
      - name: Transient exact scrollport geometry before identical original assertion
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'e2e/issue-619-628-reports-hub.spec.ts';
          const original = readFileSync(path, 'utf8');
          const marker = '      expect(bounds.bottom).toBeLessThanOrEqual(bounds.scrollBottom);';
          if (original.split(marker).length !== 2) throw new Error('Expected one unchanged scrollport assertion');
          const logging = `      const scrollportGeometry = await link.evaluate((element) => {
            const container = element.closest('nav')!;
            const style = getComputedStyle(container);
            return { outerRect: container.getBoundingClientRect().toJSON(), clientTop: container.clientTop, clientLeft: container.clientLeft, clientHeight: container.clientHeight, clientWidth: container.clientWidth, scrollTop: container.scrollTop, scrollLeft: container.scrollLeft, scrollHeight: container.scrollHeight, scrollWidth: container.scrollWidth, borderTop: style.borderTopWidth, borderBottom: style.borderBottomWidth, borderLeft: style.borderLeftWidth, borderRight: style.borderRightWidth, boxSizing: style.boxSizing, paddingTop: style.paddingTop, paddingBottom: style.paddingBottom, overflowX: style.overflowX, overflowY: style.overflowY, linkRect: element.getBoundingClientRect().toJSON(), viewport: { width: innerWidth, height: innerHeight, dpr: devicePixelRatio }, centerHit: element.contains(document.elementFromPoint(element.getBoundingClientRect().x + element.getBoundingClientRect().width / 2, element.getBoundingClientRect().y + element.getBoundingClientRect().height / 2)) };
          });
          console.log('ACTUAL_MAX_SCROLLPORT ' + info.project.name + ' ' + theme + ' index=' + index + ' ' + JSON.stringify(scrollportGeometry));
          await info.attach('scrollport-' + theme + '-' + index + '.json', { body: JSON.stringify({ bounds, geometry: scrollportGeometry }, null, 2), contentType: 'application/json' });
          `;
          writeFileSync(path, original.replace(marker, logging + marker));
          NODE
      - name: Only existing full WebKit maximum state case
        id: browser
        run: npx playwright test e2e/issue-619-628-reports-hub.spec.ts --grep '619 supported maximum saved views' --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - name: Restore instrumentation and honest result
        if: always()
        run: |
          git restore -- e2e/issue-619-628-reports-hub.spec.ts
          git diff --exit-code
          echo 'RESULT browser=${{ steps.browser.outcome }} source-restored=true; diagnostic without oracle modification'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reports-801-webkit-scrollport-diagnostic
          path: test-results/
          retention-days: 7
