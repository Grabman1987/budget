name: Temporary native frame diagnostic (never integrate)
run-name: Native frame diagnostic ${{ github.sha }}

# Diagnostic branch only. This registered manual workflow runs its --ref version.
# It is never merged and never supplies acceptance or required-check evidence.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Must be diagnostic/589-native-frame-20261022
        required: true
      specs:
        description: Must remain empty; retained only for input compatibility
        required: false
        default: ''
      expected_sha:
        description: Exact independently reviewed diagnostic commit
        required: true

permissions:
  contents: read

concurrency:
  group: native-frame-diagnostic-589
  cancel-in-progress: false

jobs:
  diagnostic:
    if: >-
      github.ref == 'refs/heads/diagnostic/589-native-frame-20261022'
      && inputs.branch == 'diagnostic/589-native-frame-20261022'
      && inputs.specs == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify requested revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed diagnostic source
        run: echo '42b70eb85243d39246f4b40e04a13ba938ad8a5f23ba773b331e160595133007  scripts/diagnostics/webkit-native-frame-repro.cjs' | sha256sum --check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install pinned native WebKit
        run: npx playwright install --with-deps webkit
      - name: Record non-sensitive runtime metadata
        run: |
          node -e 'const os = require("node:os"); console.log(JSON.stringify({node:process.version, platform:process.platform, arch:process.arch, release:os.release(), cpuCount:os.cpus().length, availableParallelism:os.availableParallelism()}))'
          cat /etc/os-release
      - name: Run synthetic diagnostic (not product acceptance)
        run: node scripts/diagnostics/webkit-native-frame-repro.cjs "$GITHUB_WORKSPACE"
