name: Update e2e snapshots

# Manual only. Regenerates the Playwright screenshot baselines on Linux (the CI platform) for one
# branch and commits them back, for PRs that change the UI on purpose. The owner's Windows machine
# and the cloud sessions cannot produce Linux baselines themselves.
# Commits pushed with GITHUB_TOKEN do not start CI: push any commit afterwards (or re-run CI).
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose baselines to update (never main)
        required: true
      specs:
        description: Space-separated spec paths (e.g. e2e/shell.spec.ts); empty = every spec that compares screenshots
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-snapshots-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  update:
    if: inputs.branch != 'main'
    runs-on: ubuntu-24.04
    # Match the CI browser image instead of reinstalling its OS/browser dependencies.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    # A type-scale change regenerates nearly every baseline; give it room.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
      - name: Allow Git reads and baseline commits in the container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Focused exact-source portfolio proof
        env:
          SPECS: ${{ inputs.specs }}
        run: |
          set +e
          set -o pipefail
          mkdir -p test-results proof-output
          git rev-parse HEAD
          mapfile -t targets < <(git diff --name-only d930cfc627a87244fb0c65e66fc55ba6c3011e32 HEAD -- apps e2e docs/handoff/portfolio-registers-544.md)
          npx prettier --check "${targets[@]}" 2>&1 | tee proof-output/544-format.log
          format_code=${PIPESTATUS[0]}
          if [ "$format_code" -ne 0 ]; then
            npx prettier --write "${targets[@]}"
            git diff --binary -- "${targets[@]}" > proof-output/544-format.patch
            sha256sum proof-output/544-format.patch
            git restore -- "${targets[@]}"
          fi
          mapfile -t typescript < <(printf '%s\n' "${targets[@]}" | grep -E '\.(ts|tsx)$')
          npx eslint "${typescript[@]}" 2>&1 | tee proof-output/544-eslint.log
          lint_code=${PIPESTATUS[0]}
          npm run typecheck 2>&1 | tee proof-output/544-typecheck.log
          type_code=${PIPESTATUS[0]}
          npm run build:e2e 2>&1 | tee proof-output/544-build.log
          build_code=${PIPESTATUS[0]}
          browser_code=1
          if [ "$build_code" -eq 0 ]; then
            npx playwright test e2e/portfolio-allocation.spec.ts e2e/issue-511-valuation-quality.spec.ts e2e/mobile-chart-containers.spec.ts --grep 'Portfolio links to the shared settings editor|unknown current quote is estimated at cost with a hint|one current quote task and local disclosures|/vermoegen/portfolio/allokation stays inside the phone|portfolio tracks fill the whole row' --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none 2>&1 | tee proof-output/544-allocation-green.log
            browser_code=${PIPESTATUS[0]}
          fi
          git diff --stat
          printf 'RESULT format=%s lint=%s type=%s build=%s browser=%s\n' "$format_code" "$lint_code" "$type_code" "$build_code" "$browser_code"
          [ "$format_code" -eq 0 ] && [ "$lint_code" -eq 0 ] && [ "$type_code" -eq 0 ] && [ "$build_code" -eq 0 ] && [ "$browser_code" -eq 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scoped-browser-screenshots
          path: |
            test-results/**/*.png
            proof-output/544-*.log
            proof-output/544-format.patch
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit the new baselines
        if: false
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- e2e
          if git diff --cached --quiet; then echo 'No baseline changes.'; exit 0; fi
          git commit -m 'test: update e2e screenshot baselines (Linux)'
          git push origin "HEAD:refs/heads/$BRANCH"
