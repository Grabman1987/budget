name: Verify report contact drafts print and retained chart contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin reviewed source and canonical workflow
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "578dd98a7f81e603e9f7b9adc0db56f826b3cea3"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
          git merge-base --is-ancestor dfd441a82b93813a8168d8fbc442349a5ad79475 HEAD^
          git restore --source=HEAD^ --worktree -- .github/workflows/update-snapshots.yml
          git diff --exit-code HEAD^
          git rev-parse HEAD HEAD^ > source-proof.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check full candidate formatting and original-source behavior
        run: |
          set +e
          mapfile -t targets < <(git diff --name-only dfd441a82b93813a8168d8fbc442349a5ad79475 HEAD^ -- '*.ts' '*.tsx' '*.css' '*.md')
          mapfile -t units < <(git diff --name-only dfd441a82b93813a8168d8fbc442349a5ad79475 HEAD^ -- '*test.ts' '*test.tsx')
          mapfile -t changed_specs < <(git diff --name-only dfd441a82b93813a8168d8fbc442349a5ad79475 HEAD^ -- 'e2e/*.spec.ts')
          test "${#units[@]}" -eq 10 && test "${#changed_specs[@]}" -eq 28 && test "${#targets[@]}" -gt 0
          inventory_rc=$?
          npx prettier --check "${targets[@]}" > format.log 2>&1
          format_rc=$?
          npx prettier --write "${targets[@]}" > format-write.log 2>&1
          first_rc=$?
          git diff --binary HEAD^ -- "${targets[@]}" > format-first.patch
          npx prettier --write "${targets[@]}" > format-second.log 2>&1
          second_rc=$?
          git diff --binary HEAD^ -- "${targets[@]}" > format.patch
          sha256sum "${targets[@]}" > format-candidate-sha256.txt
          npx prettier --write "${targets[@]}" > format-third.log 2>&1
          third_rc=$?
          sha256sum --check format-candidate-sha256.txt > format-idempotence.log 2>&1
          idempotence_rc=$?
          git diff --binary HEAD^ -- "${targets[@]}" > format-third.patch
          printf '%s\n' "${targets[@]}" | sort > format-allowed-paths.txt
          git diff --name-only HEAD^ | sort > format-actual-paths.txt
          test -z "$(comm -23 format-actual-paths.txt format-allowed-paths.txt)"
          scope_rc=$?
          npm run lint > candidate-lint.log 2>&1
          candidate_lint_rc=$?
          git restore --source=HEAD^ --worktree -- "${targets[@]}"
          git diff --quiet HEAD^
          restored_rc=$?
          npm run typecheck > type.log 2>&1
          type_rc=$?
          npx vitest run "${units[@]}" apps/web/src/reports/report-frame.test.tsx apps/web/src/pages/goals-progress-query.test.ts apps/web/src/pages/goals-progress-model.test.ts packages/domain/src/overview/explorer-templates-625.test.ts packages/domain/src/overview/explorer-csv-627.test.ts > unit.log 2>&1
          unit_rc=$?
          npm run build:e2e > build.log 2>&1
          build_rc=$?
          list_rc=1
          browser_rc=1
          if [ "$build_rc" -eq 0 ]; then
            specs=(e2e/issue-738-contact-statement.spec.ts e2e/issue-556-table-print.spec.ts e2e/pace-marker.spec.ts e2e/capture.spec.ts)
            scenario_pattern='738 compact contact statement|landscape print preserves columns|specialized One-Pager|Pace reduces its lines|visible growing note, direct split'
            npx playwright test "${specs[@]}" --grep "$scenario_pattern" --project=desktop --project=mobile --project=webkit-iphone --list > discovery.log 2>&1
            list_rc=$?
            for spec in "${specs[@]}"; do
              test -f "$spec" || list_rc=1
              grep -q "$(basename "$spec")" discovery.log || list_rc=1
            done
            for profile in desktop mobile webkit-iphone; do
              test "$(grep -c "\[$profile\].*issue-738-contact-statement.spec.ts" discovery.log)" -eq 4 || list_rc=1
              test "$(grep -c "\[$profile\].*issue-556-table-print.spec.ts" discovery.log)" -eq 4 || list_rc=1
            done
            for profile in desktop mobile; do
              test "$(grep -c "\[$profile\].*pace-marker.spec.ts" discovery.log)" -eq 1 || list_rc=1
              test "$(grep -c "\[$profile\].*capture.spec.ts.*visible growing note" discovery.log)" -eq 1 || list_rc=1
            done
            if [ "$list_rc" -eq 0 ]; then
              npx playwright test "${specs[@]}" --grep "$scenario_pattern" --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none > browser.log 2>&1
              browser_rc=$?
            fi
          fi
          git restore --worktree -- .github/workflows/update-snapshots.yml
          git diff --name-status > post-runtime-changes.txt
          git status --porcelain --untracked-files=no > post-runtime-status.txt
          cleanup_rc=0
          mkdir -p generated-evidence
          for name in dialog-desktop dialog-mobile register-desktop register-mobile; do
            path="docs/evidence/capture-note-split/$name.png"
            if [ -f "$path" ]; then cp "$path" generated-evidence/; fi
          done
          mapfile -t runtime_changes < <(git diff --name-only)
          for changed in "${runtime_changes[@]}"; do
            case "$changed" in
              docs/evidence/capture-note-split/dialog-desktop.png|docs/evidence/capture-note-split/dialog-mobile.png|docs/evidence/capture-note-split/register-mobile.png)
                git restore --worktree -- "$changed" || cleanup_rc=1
                ;;
              *) cleanup_rc=1 ;;
            esac
          done
          git diff --quiet || cleanup_rc=1
          cat format.log format-idempotence.log candidate-lint.log type.log unit.log build.log discovery.log browser.log 2>/dev/null
          echo "RESULT inventory=$inventory_rc format=$format_rc first=$first_rc second=$second_rc third=$third_rc idempotence=$idempotence_rc scope=$scope_rc candidateLint=$candidate_lint_rc restored=$restored_rc cleanup=$cleanup_rc type=$type_rc unit=$unit_rc build=$build_rc list=$list_rc browser=$browser_rc"
          test "$inventory_rc" -eq 0 && test "$format_rc" -eq 0 && test "$first_rc" -eq 0 && test "$second_rc" -eq 0 && test "$third_rc" -eq 0 && test "$idempotence_rc" -eq 0 && test "$scope_rc" -eq 0 && test "$candidate_lint_rc" -eq 0 && test "$restored_rc" -eq 0 && test "$cleanup_rc" -eq 0 && test "$type_rc" -eq 0 && test "$unit_rc" -eq 0 && test "$build_rc" -eq 0 && test "$list_rc" -eq 0 && test "$browser_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue-620-contact-print-and-pace-evidence
          path: |
            source-proof.txt
            post-runtime-*.txt
            generated-evidence/*.png
            *paths.txt
            format*.txt
            format*.patch
            *.log
            test-results/**/*.pdf
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: ignore
          retention-days: 3
