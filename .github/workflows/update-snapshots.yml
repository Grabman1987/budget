name: Reports 801 read only mobile header geometry diagnostic
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      specs:
        required: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 2
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Pin exact diagnostic source parent
        run: |
          test "$(git rev-parse HEAD^)" = dfbc58f36fc48c55330a25741486759e7ae70418
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/update-snapshots.yml
          git rev-parse HEAD HEAD^
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:e2e
      - name: Transient read only geometry logging before identical assertion
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'e2e/income-targets-report-ranges.spec.ts';
          const original = readFileSync(path, 'utf8');
          const marker = '  expect(headerFits).toBe(true);';
          if (original.split(marker).length !== 2) throw new Error('Expected one unchanged geometry assertion');
          const diagnostic = `  const diagnosticGeometry = await page.locator('.titleblock').evaluate((header) =>
            [...header.querySelectorAll<HTMLElement>('.tb-cell')].map((cell) => ({
              cellClass: cell.className,
              cellRect: cell.getBoundingClientRect().toJSON(),
              candidates: [...cell.querySelectorAll<HTMLElement>('h1, input, select')].map((node) => {
                const style = getComputedStyle(node);
                const closed = node.closest('details:not([open])');
                return { tag: node.tagName, text: node.textContent?.slice(0, 120), label: node.getAttribute('aria-label'),
                  rect: node.getBoundingClientRect().toJSON(), clientRects: node.getClientRects().length,
                  display: style.display, visibility: style.visibility, contentVisibility: style.contentVisibility,
                  checkVisibility: node.checkVisibility(), closedDetails: closed?.className ?? null,
                  ancestors: [...(function* () { let parent = node.parentElement; while (parent && parent !== cell) { yield parent; parent = parent.parentElement; } })()].map(parent => ({ tag: parent.tagName, className: parent.className, display: getComputedStyle(parent).display, visibility: getComputedStyle(parent).visibility, contentVisibility: getComputedStyle(parent).contentVisibility })),
                };
              }),
            })),
          );
          console.log('ACTUAL_HEADER_GEOMETRY ' + JSON.stringify(diagnosticGeometry));
          await info.attach('actual-header-geometry.json', { body: JSON.stringify(diagnosticGeometry, null, 2), contentType: 'application/json' });
          `;
          writeFileSync(path, original.replace(marker, diagnostic + marker));
          NODE
      - name: Only unchanged full old mobile ranges case
        id: browser
        run: npx playwright test e2e/income-targets-report-ranges.spec.ts --grep 'shared ranges, custom URL reload and optional trend' --project=mobile --workers=1 --retries=0 --update-snapshots=none
      - name: Restore transient instrumentation and verify source
        if: always()
        run: |
          git restore -- e2e/income-targets-report-ranges.spec.ts
          git diff --exit-code
          echo 'RESULT browser=${{ steps.browser.outcome }}; source restored; no oracle modification'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reports-801-header-diagnostic
          path: test-results/
          retention-days: 7
