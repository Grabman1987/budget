name: Ledger phone controls focused proof
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      specs:
        required: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format selected control test and retain mechanical patch
        run: |
          npx prettier --write e2e/checkbox-appearance.spec.ts docs/ledger-filters-594.md
          git diff --binary > /tmp/594-phone-format.patch
          sha256sum /tmp/594-phone-format.patch
      - name: Scoped ESLint and typecheck
        run: |
          npx eslint e2e/checkbox-appearance.spec.ts
          npm run typecheck
      - name: Build E2E
        if: always()
        run: npm run build:e2e
      - name: Real phone checkbox and selected toolbar both themes
        if: always()
        run: npx playwright test e2e/checkbox-appearance.spec.ts --grep="a tap on the control" --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ledger-594-phone-controls-proof
          path: |
            /tmp/594-phone-format.patch
            test-results/
          retention-days: 7
