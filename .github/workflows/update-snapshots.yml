name: Update e2e snapshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and workflow-only delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "bf08d23cec498908d2b9779a239db728fe6efb74"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: format
        name: Scoped formatting with pinned patch collection
        continue-on-error: true
        run: |
          paths=(SPEC.md apps/server/src/api/plan-reset-592.test.ts apps/server/src/api/schemas.ts apps/web/src/budget/envelope-panel.tsx apps/web/src/budget/plan-automatic-592.test.ts apps/web/src/budget/plan-automatic.tsx apps/web/src/budget/plan-inspector.tsx apps/web/src/budget/plan-overview.tsx apps/web/src/budget/plan-page.tsx apps/web/src/budget/plan-panel-592-593.test.tsx apps/web/src/budget/plan.css docs/handoff/plan-panel-592-593.md e2e/issue-481-single-category-band.spec.ts e2e/issue-592-593-plan-panel.spec.ts e2e/plan-ghost.spec.ts e2e/plan-inspector.spec.ts packages/domain/src/ledger/quick-assign-reset-592.test.ts packages/domain/src/ledger/quick-assign.ts)
          if npx prettier --check "${paths[@]}"; then exit 0; fi
          npx prettier --write "${paths[@]}"
          git diff --binary -- "${paths[@]}" > proof-format.patch
          git restore -- "${paths[@]}"
          test -s proof-format.patch
          exit 1
      - id: lint
        name: Scoped ESLint
        continue-on-error: true
        run: npx eslint apps/server/src/api/plan-reset-592.test.ts apps/server/src/api/schemas.ts apps/web/src/budget/envelope-panel.tsx apps/web/src/budget/plan-automatic-592.test.ts apps/web/src/budget/plan-automatic.tsx apps/web/src/budget/plan-inspector.tsx apps/web/src/budget/plan-overview.tsx apps/web/src/budget/plan-page.tsx apps/web/src/budget/plan-panel-592-593.test.tsx e2e/issue-481-single-category-band.spec.ts e2e/issue-592-593-plan-panel.spec.ts e2e/plan-ghost.spec.ts e2e/plan-inspector.spec.ts packages/domain/src/ledger/quick-assign-reset-592.test.ts packages/domain/src/ledger/quick-assign.ts
      - id: types
        name: Full workspace typecheck
        continue-on-error: true
        run: npm run typecheck
      - id: css
        name: Design-token CSS check
        continue-on-error: true
        run: node packages/ui/scripts/check-css-scale.mjs
      - id: units
        name: New and directly affected literal unit regressions
        continue-on-error: true
        run: npx vitest run packages/domain/src/ledger/quick-assign-reset-592.test.ts packages/domain/src/ledger/quick-assign.test.ts packages/domain/src/ledger/cover.test.ts packages/db/src/repos/cover-limits.test.ts apps/server/src/api/plan-reset-592.test.ts apps/web/src/budget/plan-automatic-592.test.ts apps/web/src/budget/plan-panel-592-593.test.tsx apps/web/src/budget/plan-overview-state-591.test.tsx apps/web/src/budget/plan-overview-591.test.ts apps/web/src/budget/plan-page-cover.test.tsx apps/web/src/budget/plan-menus.test.tsx
      - id: build
        name: Build for browser proof
        continue-on-error: true
        run: npm run build:e2e
      - id: browser
        name: Split Plan browser cases in three profiles
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          npx playwright test e2e/issue-592-593-plan-panel.spec.ts --project=desktop --project=mobile --project=webkit-iphone --list
          npx playwright test e2e/issue-592-593-plan-panel.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - id: baselines
        name: Assert no tracked mutation or baseline update
        continue-on-error: true
        run: git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue-781-plan-split-evidence
          path: |
            proof-format.patch
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: ignore
          retention-days: 3
      - name: Report actual scoped result
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          CSS: ${{ steps.css.outcome }}
          UNITS: ${{ steps.units.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          BASELINES: ${{ steps.baselines.outcome }}
        run: |
          echo "RESULT format=$FORMAT lint=$LINT types=$TYPES css=$CSS units=$UNITS build=$BUILD browser=$BROWSER baselines=$BASELINES"
          test "$FORMAT" = success && test "$LINT" = success && test "$TYPES" = success && test "$CSS" = success && test "$UNITS" = success && test "$BUILD" = success && test "$BROWSER" = success && test "$BASELINES" = success
