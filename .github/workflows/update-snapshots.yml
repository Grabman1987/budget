name: Portfolio Instrument exact-source proof
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Disposable exact-adb Instrument proof
        required: true
      specs:
        description: Reserved; one Instrument case pinned below
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: portfolio-instrument-${{ inputs.branch }}
  cancel-in-progress: false
jobs:
  focused:
    if: inputs.branch == 'codex/portfolio-instrument-proof-adb53958'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Scoped static and unchanged three-profile Instrument case
        run: |
          set +e
          set -o pipefail
          mkdir -p proof-output
          source_sha=adb53958c22da91c8f2f2e4e2a91e3b6de0ed0e6
          test "$(git rev-parse HEAD^)" = "$source_sha" || exit 70
          git diff --exit-code "$source_sha" HEAD -- apps packages e2e docs/handoff || exit 71
          printf 'SOURCE=%s PROOF=%s\n' "$source_sha" "$(git rev-parse HEAD)" | tee proof-output/source.txt
          mapfile -t targets < <(git diff --name-only 1f7a2cbde4653eeae36c0459b229a5f74dd5a003 "$source_sha" -- apps e2e docs/handoff)
          printf '%s\n' "${targets[@]}" > proof-output/allowlist.txt
          npx prettier --check "${targets[@]}" 2>&1 | tee proof-output/format.log
          format_code=${PIPESTATUS[0]}
          if [ "$format_code" -ne 0 ]; then
            npx prettier --write "${targets[@]}" 2>&1 | tee proof-output/format-write.log
            git diff --binary -- "${targets[@]}" > proof-output/format.patch
            git diff --numstat -- "${targets[@]}" > proof-output/format-numstat.txt
            sha256sum proof-output/format.patch | tee proof-output/format.sha256
            git restore -- "${targets[@]}"
          fi
          mapfile -t typescript < <(printf '%s\n' "${targets[@]}" | grep -E '\.(ts|tsx)$')
          npx eslint "${typescript[@]}" 2>&1 | tee proof-output/eslint.log
          lint_code=${PIPESTATUS[0]}
          npm run typecheck 2>&1 | tee proof-output/typecheck.log
          type_code=${PIPESTATUS[0]}
          npm run build:e2e 2>&1 | tee proof-output/build.log
          build_code=${PIPESTATUS[0]}
          browser_code=1
          if [ "$build_code" -eq 0 ]; then
            date -u '+instrument-start %FT%TZ' | tee proof-output/timing.log
            npx playwright test e2e/issue-547-548-portfolio-details.spec.ts --grep '547 instrument shares literal value/basis' --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --trace=on --update-snapshots=none 2>&1 | tee proof-output/instrument.log
            browser_code=${PIPESTATUS[0]}
            date -u '+instrument-end %FT%TZ' | tee -a proof-output/timing.log
          fi
          git diff --stat | tee proof-output/final-diff.txt
          printf 'RESULT format=%s lint=%s type=%s build=%s instrument=%s\n' "$format_code" "$lint_code" "$type_code" "$build_code" "$browser_code" | tee proof-output/result.txt
          [ "$format_code" -eq 0 ] && [ "$lint_code" -eq 0 ] && [ "$type_code" -eq 0 ] && [ "$build_code" -eq 0 ] && [ "$browser_code" -eq 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: portfolio-instrument-adb53958
          path: |
            proof-output/
            test-results/**/*.png
            test-results/**/trace.zip
            test-results/**/error-context.md
            test-results/**/attachments/**
          if-no-files-found: warn
          retention-days: 7
