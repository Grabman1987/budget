name: Focused final report bookmark and retained capability proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin final source and workflow-only delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "c054d6c655ec275c3b9cba28b443371e27f3c082"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
          git rev-parse HEAD HEAD^ > source-proof.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check retained financial consumers and canonical bookmark targets
        run: |
          set +e
          mapfile -t targets < <(git diff --name-only ea86c24fe21b524cd90d88c04389f988e7b1bc1d HEAD^ -- '*.ts' '*.tsx' '*.css' '*.md')
          mapfile -t code < <(git diff --name-only ea86c24fe21b524cd90d88c04389f988e7b1bc1d HEAD^ -- '*.ts' '*.tsx')
          mapfile -t units < <(git diff --name-only ea86c24fe21b524cd90d88c04389f988e7b1bc1d HEAD^ -- '*test.ts' '*test.tsx')
          mapfile -t specs < <(git diff --name-only ea86c24fe21b524cd90d88c04389f988e7b1bc1d HEAD^ -- 'e2e/*.spec.ts')
          test "${#units[@]}" -eq 7 && test "${#specs[@]}" -eq 17
          scope_rc=$?
          npx prettier --check "${targets[@]}" > format.log 2>&1
          format_rc=$?
          if [ "$format_rc" -ne 0 ]; then
            npx prettier --write "${targets[@]}" > format-write.log 2>&1
            git diff --binary -- "${targets[@]}" > format.patch
            git restore -- "${targets[@]}"
          fi
          git diff --quiet -- "${targets[@]}"
          restored_rc=$?
          node packages/ui/scripts/check-css-scale.mjs > css.log 2>&1
          css_rc=$?
          npx eslint "${code[@]}" > lint.log 2>&1
          lint_rc=$?
          npm run typecheck > type.log 2>&1
          type_rc=$?
          unit_rc=1
          if [ "$scope_rc" -eq 0 ]; then
            npx vitest run "${units[@]}" apps/web/src/reports/report-frame.test.tsx apps/web/src/pages/goals-progress-query.test.ts apps/web/src/pages/goals-progress-model.test.ts packages/domain/src/overview/explorer-templates-625.test.ts packages/domain/src/overview/explorer-csv-627.test.ts > unit.log 2>&1
            unit_rc=$?
          fi
          npm run build:e2e > build.log 2>&1
          build_rc=$?
          list_rc=1
          browser_rc=1
          if [ "$scope_rc" -eq 0 ] && [ "$build_rc" -eq 0 ]; then
            npx playwright test e2e/contact-report.spec.ts e2e/report-tables.spec.ts --grep "fixed EUR report preserves credit|all 36 months with the running month marked" --project=desktop --project=mobile --project=webkit-iphone --list > discovery.log 2>&1
            list_rc=$?
            test "$(grep -c 'contact-report.spec.ts.*fixed EUR report preserves credit' discovery.log)" -eq 2 || list_rc=1
            test "$(grep -c 'report-tables.spec.ts.*all 36 months with the running month marked' discovery.log)" -eq 3 || list_rc=1
            for profile in desktop mobile webkit-iphone; do
              grep -q "\[$profile\].*all 36 months with the running month marked" discovery.log || list_rc=1
            done
            if [ "$list_rc" -eq 0 ]; then
              npx playwright test e2e/contact-report.spec.ts e2e/report-tables.spec.ts --grep "fixed EUR report preserves credit|all 36 months with the running month marked" --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none > browser.log 2>&1
              browser_rc=$?
            fi
          fi
          cat format.log css.log lint.log type.log unit.log build.log discovery.log browser.log 2>/dev/null
          echo "RESULT scope=$scope_rc format=$format_rc restored=$restored_rc css=$css_rc lint=$lint_rc type=$type_rc unit=$unit_rc build=$build_rc list=$list_rc browser=$browser_rc"
          test "$scope_rc" -eq 0 && test "$format_rc" -eq 0 && test "$restored_rc" -eq 0 && test "$css_rc" -eq 0 && test "$lint_rc" -eq 0 && test "$type_rc" -eq 0 && test "$unit_rc" -eq 0 && test "$build_rc" -eq 0 && test "$list_rc" -eq 0 && test "$browser_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue-620-final-source-contract-evidence
          path: |
            source-proof.txt
            format.log
            format-write.log
            format.patch
            css.log
            lint.log
            type.log
            unit.log
            build.log
            discovery.log
            browser.log
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: ignore
          retention-days: 3
