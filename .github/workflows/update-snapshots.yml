name: Update e2e snapshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and workflow-only delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git show -s --format=%P HEAD)" = "6f82288fdef5b29cf6753cae8579232f0830e6ab"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: format
        name: Scoped formatting with pinned patch collection
        continue-on-error: true
        run: |
          paths=(apps/web/src/pages/payee-analysis-report.tsx apps/web/src/pages/reports-pages.tsx apps/web/src/reports/assets-debts-report.tsx apps/web/src/reports/report-consolidation-622-623.test.tsx apps/web/src/reports/report-search.ts apps/web/src/reports/report-views.css apps/web/src/reports/spending-analysis-report.tsx apps/web/src/reports/spending-report-views.tsx apps/web/src/reports/wealth-history-report.tsx apps/web/src/reports/wealth-report-views.tsx apps/web/src/reports/whole-picture-report.tsx docs/handoff/report-consolidation-622-623.md e2e/issue-622-623-report-views.spec.ts)
          : > proof-format.patch
          if npx prettier --check "${paths[@]}"; then exit 0; fi
          npx prettier --write "${paths[@]}"
          git diff --binary -- "${paths[@]}" > proof-format.patch
          git restore -- "${paths[@]}"
          test -s proof-format.patch
          exit 1
      - id: lint
        name: Scoped ESLint
        continue-on-error: true
        run: npx eslint apps/web/src/pages/payee-analysis-report.tsx apps/web/src/pages/reports-pages.tsx apps/web/src/reports/assets-debts-report.tsx apps/web/src/reports/report-consolidation-622-623.test.tsx apps/web/src/reports/report-search.ts apps/web/src/reports/spending-analysis-report.tsx apps/web/src/reports/spending-report-views.tsx apps/web/src/reports/wealth-history-report.tsx apps/web/src/reports/wealth-report-views.tsx apps/web/src/reports/whole-picture-report.tsx e2e/issue-622-623-report-views.spec.ts
      - id: types
        name: Full workspace typecheck
        continue-on-error: true
        run: npm run typecheck
      - id: css
        name: Design-token CSS check
        continue-on-error: true
        run: node packages/ui/scripts/check-css-scale.mjs
      - id: units
        name: View URL contracts and existing literal report regressions
        continue-on-error: true
        run: |
          npx vitest run apps/web/src/reports/report-consolidation-622-623.test.tsx apps/web/src/reports/income-project-621.test.ts apps/web/src/reports/assets-debts-chart-accessibility-555.test.tsx apps/web/src/reports/whole-picture-report.test.tsx apps/web/src/reports/spending-pilot-554.test.ts apps/server/src/api/payee-report.test.ts apps/server/src/api/assets-debts-history.test.ts apps/server/src/api/networth-history.test.ts apps/server/src/api/whole-picture.test.ts apps/server/src/api/spending-pilot-554.test.ts
      - id: build
        name: Build for browser proof
        continue-on-error: true
        run: npm run build:e2e
      - id: browser
        name: Full new622 and623 cases in three canonical profiles
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          npx playwright test e2e/issue-622-623-report-views.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - name: Preserve new622 and623 evidence before legacy cleanup
        if: always()
        run: |
          if test -d test-results; then cp -a test-results proof-new-case-results; fi
      - id: compatibility
        name: Old payee and wealth financial period detail and CSV consumers
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          npx playwright test e2e/payee-analysis-report.spec.ts e2e/assets-debts-report.spec.ts e2e/wealth-history-report.spec.ts e2e/whole-picture.spec.ts e2e/issue-554-spending-pilot.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - name: Preserve legacy financial evidence before Hub cleanup
        if: always()
        run: |
          if test -d test-results; then cp -a test-results proof-legacy-case-results; fi
      - id: verdict
        name: Preserved spending verdict consumers
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          npx playwright test e2e/verdicts.spec.ts --grep 'Fazit: Ausgaben' --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - id: baselines
        name: Assert no tracked mutation or baseline update
        continue-on-error: true
        run: git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: report-consolidation-622-623-evidence
          path: |
            proof-format.patch
            proof-legacy-case-results/**/*.png
            proof-legacy-case-results/**/*.zip
            proof-legacy-case-results/**/*.md
            proof-new-case-results/**/*.png
            proof-new-case-results/**/*.zip
            proof-new-case-results/**/*.md
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: ignore
          retention-days: 3
      - name: Report actual scoped result
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          CSS: ${{ steps.css.outcome }}
          UNITS: ${{ steps.units.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          COMPATIBILITY: ${{ steps.compatibility.outcome }}
          VERDICT: ${{ steps.verdict.outcome }}
          BASELINES: ${{ steps.baselines.outcome }}
        run: |
          echo "RESULT format=$FORMAT lint=$LINT types=$TYPES css=$CSS units=$UNITS build=$BUILD browser=$BROWSER compatibility=$COMPATIBILITY verdict=$VERDICT baselines=$BASELINES"
          test "$FORMAT" = success && test "$LINT" = success && test "$TYPES" = success && test "$CSS" = success && test "$UNITS" = success && test "$BUILD" = success && test "$BROWSER" = success && test "$COMPATIBILITY" = success && test "$VERDICT" = success && test "$BASELINES" = success
