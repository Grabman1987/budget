name: Update e2e snapshots

# Manual only. Regenerates the Playwright screenshot baselines on Linux (the CI platform) for one
# branch and commits them back, for PRs that change the UI on purpose. The owner's Windows machine
# and the cloud sessions cannot produce Linux baselines themselves.
# Commits pushed with GITHUB_TOKEN do not start CI: push any commit afterwards (or re-run CI).
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose baselines to update (never main)
        required: true
      specs:
        description: Space-separated spec paths (e.g. e2e/shell.spec.ts); empty = every spec that compares screenshots
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-snapshots-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  update:
    if: inputs.branch != 'main'
    runs-on: ubuntu-24.04
    # Match the CI browser image instead of reinstalling its OS/browser dependencies.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    defaults:
      run:
        shell: bash
    # A type-scale change regenerates nearly every baseline; give it room.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
      - name: Allow Git reads and baseline commits in the container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Non-screenshot failures are reported by the normal CI run on the PR, not here.
      - name: Regenerate changed screenshots
        env:
          SPECS: ${{ inputs.specs }}
        run: |
          npm run build:e2e
          read -r -a specs <<< "$SPECS"
          if [ "${#specs[@]}" -eq 0 ]; then
            mapfile -t specs < <(grep -lE 'expectScreenshot|toHaveScreenshot' e2e/*.spec.ts)
          fi
          npx playwright test --update-snapshots=changed "${specs[@]}" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scoped-browser-screenshots
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit the new baselines
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- e2e
          if git diff --cached --quiet; then echo 'No baseline changes.'; exit 0; fi
          git commit -m 'test: update e2e screenshot baselines (Linux)'
          git push origin "HEAD:refs/heads/$BRANCH"
