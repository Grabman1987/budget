name: Reproduce Heute wealth inspection and history gaps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Pin tests-only source
        run: |
          test "$(git rev-parse HEAD^)" = "d50201986fcaa69624f4712bb84a9249fa41ea4b"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
          git rev-parse HEAD HEAD^ > source-proof.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run unchanged base behavior against new regression tests
        run: |
          set +e
          npx vitest run apps/server/src/api/heute.test.ts apps/web/src/heute/charts.test.tsx > unit.log 2>&1
          unit_rc=$?
          cat unit.log
          echo "RESULT unit=$unit_rc"
          test "$unit_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue-572-red-regressions
          path: |
            source-proof.txt
            unit.log
          retention-days: 3
