name: Validate month-close 243 before PR publication

# Temporary helper branch only; never copy this workflow into the task PR.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Frozen helper branch to validate (never main)
        required: true

permissions:
  contents: read

concurrency:
  group: month-close-preflight-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.branch != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Focused financial and workflow regressions
        run: npx vitest run packages/domain/src/month-close.test.ts apps/server/src/api/month-close.test.ts apps/web/src/month-close/next-month-plan.test.tsx packages/db/src/repos/portfolio-manual-valuation.test.ts --maxWorkers=1
      - name: Complete repository check
        env:
          BUDGET_REQUIRE_AGE: '1'
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium
      - name: Desktop and phone month-close workflow
        run: npm run build:e2e && npx playwright test e2e/month-close.spec.ts --project=desktop --project=mobile --workers=1
      - name: Verify tracked source stayed unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: month-close-243-preflight
          path: |
            playwright-report/
            test-results/
          retention-days: 7
