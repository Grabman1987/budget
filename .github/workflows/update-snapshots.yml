name: Focused report palette title proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and workflow-only delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "c6c9aaace066cac5ebcf095182e1a754dc3d5380"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
          git rev-parse HEAD HEAD^ > source-proof.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check canonical report palette in all profiles
        run: |
          set +e
          target=e2e/global-search.spec.ts
          npx prettier --check "$target" > format.log 2>&1
          format_rc=$?
          if [ "$format_rc" -ne 0 ]; then
            npx prettier --write "$target" > format-write.log 2>&1
            git diff --binary -- "$target" > format.patch
            git restore -- "$target"
          fi
          git diff --quiet -- "$target"
          restored_rc=$?
          npx eslint "$target" > lint.log 2>&1
          lint_rc=$?
          npm run typecheck > type.log 2>&1
          type_rc=$?
          npx vitest run apps/web/src/reports/remaining-target-search-487.test.ts > unit.log 2>&1
          unit_rc=$?
          npm run build:e2e > build.log 2>&1
          build_rc=$?
          list_rc=1
          browser_rc=1
          if [ "$build_rc" -eq 0 ]; then
            npx playwright test e2e/global-search.spec.ts --project=desktop --project=mobile --project=webkit-iphone --grep 'palette: reports, pages, recent choices, actions and shortcut help' --list > discovery.log 2>&1
            list_rc=$?
            for profile in desktop mobile webkit-iphone; do
              grep -q "\[$profile\].*palette: reports, pages, recent choices, actions and shortcut help" discovery.log || list_rc=1
            done
            if [ "$list_rc" -eq 0 ]; then
              npx playwright test e2e/global-search.spec.ts --project=desktop --project=mobile --project=webkit-iphone --grep 'palette: reports, pages, recent choices, actions and shortcut help' --workers=1 --retries=0 --update-snapshots=none > browser.log 2>&1
              browser_rc=$?
            fi
          fi
          cat format.log lint.log type.log unit.log build.log discovery.log browser.log 2>/dev/null
          echo "RESULT format=$format_rc restored=$restored_rc lint=$lint_rc type=$type_rc unit=$unit_rc build=$build_rc list=$list_rc browser=$browser_rc"
          test "$format_rc" -eq 0 && test "$restored_rc" -eq 0 && test "$lint_rc" -eq 0 && test "$type_rc" -eq 0 && test "$unit_rc" -eq 0 && test "$build_rc" -eq 0 && test "$list_rc" -eq 0 && test "$browser_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue-487-global-search-evidence
          path: |
            source-proof.txt
            format.log
            format-write.log
            format.patch
            lint.log
            type.log
            unit.log
            build.log
            discovery.log
            browser.log
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: ignore
          retention-days: 3
