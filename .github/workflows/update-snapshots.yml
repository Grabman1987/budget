name: Instrument lazy table regression proof
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Disposable exact-source branch
        required: true
permissions:
  contents: read
concurrency:
  group: portfolio-lazy-${{ inputs.branch }}
  cancel-in-progress: false
jobs:
  focused:
    if: inputs.branch == 'codex/portfolio-lazy-proof-4fc68b7f'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Exact source static, literal units and traced regression cases
        run: |
          set +e
          set -o pipefail
          mkdir -p proof-output
          source_sha=4fc68b7fc5160cdf6e0ab0cf8bbfa502171cc9be
          test "$(git rev-parse HEAD^)" = "$source_sha" || exit 70
          git diff --exit-code "$source_sha" HEAD -- apps packages e2e docs || exit 71
          printf 'SOURCE=%s PROOF=%s\n' "$source_sha" "$(git rev-parse HEAD)" | tee proof-output/source.txt
          mapfile -t targets < <(git diff --name-only bcb8446c8fe8be7f0d7767cd61bbe137fd5f0b6c "$source_sha" -- apps packages e2e docs)
          printf '%s\n' "${targets[@]}" > proof-output/allowlist.txt
          npx prettier --check "${targets[@]}" 2>&1 | tee proof-output/format.log
          format_code=${PIPESTATUS[0]}
          if [ "$format_code" -ne 0 ]; then
            npx prettier --write "${targets[@]}" 2>&1 | tee proof-output/format-write.log
            git diff --binary -- "${targets[@]}" > proof-output/format.patch
            git diff --numstat -- "${targets[@]}" > proof-output/format-numstat.txt
            sha256sum proof-output/format.patch | tee proof-output/format.sha256
            git restore -- "${targets[@]}"
          fi
          mapfile -t ts < <(printf '%s\n' "${targets[@]}" | grep -E '\.(ts|tsx)$')
          npx eslint "${ts[@]}" 2>&1 | tee proof-output/eslint.log
          lint_code=${PIPESTATUS[0]}
          npm run typecheck 2>&1 | tee proof-output/typecheck.log
          type_code=${PIPESTATUS[0]}
          git show bcb8446c8fe8be7f0d7767cd61bbe137fd5f0b6c:apps/web/src/wealth/price-history.tsx > apps/web/src/wealth/price-history.tsx
          npx vitest run apps/web/src/wealth/price-history.test.tsx -t 'mounts every exact instrument' 2>&1 | tee proof-output/eager-red.log
          red_code=${PIPESTATUS[0]}
          git restore -- apps/web/src/wealth/price-history.tsx
          git diff --exit-code -- apps packages e2e docs || exit 72
          npx vitest run apps/web/src/wealth/price-history.test.tsx packages/ui/src/charts/accessibility.test.tsx 2>&1 | tee proof-output/unit.log
          unit_code=${PIPESTATUS[0]}
          npm run build:e2e 2>&1 | tee proof-output/build.log
          build_code=${PIPESTATUS[0]}
          old_mobile=1
          exposure=1
          instrument=1
          if [ "$build_code" -eq 0 ]; then
            date -u '+old-mobile-start %FT%TZ' | tee proof-output/timing.log
            npx playwright test e2e/portfolio-positions.spec.ts e2e/portfolio-trades.spec.ts --grep 'portfolio instrument details support keyboard editing and survive reload|manual buy, partial sell, source edit and group undo refresh holdings and cash' --project=mobile --workers=1 --retries=0 --trace=on --update-snapshots=none 2>&1 | tee proof-output/old-mobile.log
            old_mobile=${PIPESTATUS[0]}
            cp -a test-results proof-output/old-mobile-results
            date -u '+exposure-start %FT%TZ' | tee -a proof-output/timing.log
            npx playwright test e2e/asset-exposure.spec.ts --project=webkit-iphone --workers=1 --retries=0 --trace=on --update-snapshots=none 2>&1 | tee proof-output/exposure.log
            exposure=${PIPESTATUS[0]}
            cp -a test-results proof-output/exposure-results
            date -u '+instrument-start %FT%TZ' | tee -a proof-output/timing.log
            npx playwright test e2e/issue-547-548-portfolio-details.spec.ts --grep '547 instrument shares literal' --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --trace=on --update-snapshots=none 2>&1 | tee proof-output/instrument.log
            instrument=${PIPESTATUS[0]}
            cp -a test-results proof-output/instrument-results
            date -u '+instrument-end %FT%TZ' | tee -a proof-output/timing.log
          fi
          git diff --stat | tee proof-output/final-diff.txt
          printf 'RESULT format=%s lint=%s type=%s red=%s unit=%s build=%s old_mobile=%s exposure=%s instrument=%s\n' "$format_code" "$lint_code" "$type_code" "$red_code" "$unit_code" "$build_code" "$old_mobile" "$exposure" "$instrument" | tee proof-output/result.txt
          [ "$format_code" -eq 0 ] && [ "$lint_code" -eq 0 ] && [ "$type_code" -eq 0 ] && [ "$red_code" -eq 1 ] && [ "$unit_code" -eq 0 ] && [ "$build_code" -eq 0 ] && [ "$old_mobile" -eq 0 ] && [ "$exposure" -eq 0 ] && [ "$instrument" -eq 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: portfolio-lazy-4fc68b7f
          path: proof-output/
          if-no-files-found: warn
          retention-days: 7
