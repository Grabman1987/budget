name: Ledger projected balance focused proof
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      specs:
        required: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format only repair paths and retain exact patch
        run: |
          npx prettier --write apps/web/src/ledger/booking-table.tsx apps/web/src/ledger/booking-table-581.test.tsx docs/ledger-filters-594.md
          git diff --binary > /tmp/594-projected-format.patch
          sha256sum /tmp/594-projected-format.patch
      - name: Scoped ESLint and full typecheck
        run: |
          npx eslint apps/web/src/ledger/booking-table.tsx apps/web/src/ledger/booking-table-581.test.tsx
          npm run typecheck
      - name: Complete existing booking table regression file
        if: always()
        run: npx vitest run apps/web/src/ledger/booking-table-581.test.tsx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ledger-594-projected-balance-proof
          path: /tmp/594-projected-format.patch
          retention-days: 7
