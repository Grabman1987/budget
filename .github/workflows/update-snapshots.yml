name: Focused report alias contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 4
          persist-credentials: false
      - name: Pin source and workflow-only delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "5b387f1995f5b47c96861f95d67982abdd7a4897"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
          git rev-parse HEAD HEAD^ > source-proof.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify aliases and retained target contracts
        run: |
          set +e
          mapfile -t targets < <(git diff --name-only ea86c24fe21b524cd90d88c04389f988e7b1bc1d HEAD^ -- '*.ts' '*.tsx' '*.md')
          mapfile -t code < <(git diff --name-only ea86c24fe21b524cd90d88c04389f988e7b1bc1d HEAD^ -- '*.ts' '*.tsx')
          npx prettier --check "${targets[@]}" > format.log 2>&1
          format_rc=$?
          if [ "$format_rc" -ne 0 ]; then
            npx prettier --write "${targets[@]}" > format-write.log 2>&1
            git diff --binary -- "${targets[@]}" > format.patch
            git restore -- "${targets[@]}"
          fi
          git diff --quiet -- "${targets[@]}"
          restored_rc=$?
          npx eslint "${code[@]}" > lint.log 2>&1
          lint_rc=$?
          npm run typecheck > type.log 2>&1
          type_rc=$?
          npx vitest run apps/web/src/nav/redirects.test.ts apps/web/src/pages/report-trend-620.test.tsx apps/web/src/reports/explorer-templates-625.test.tsx > unit.log 2>&1
          unit_rc=$?
          npm run build:e2e > build.log 2>&1
          build_rc=$?
          list_rc=1
          browser_rc=1
          if [ "$build_rc" -eq 0 ]; then
            specs=(e2e/issue-620-report-aliases.spec.ts e2e/issue-621-income-project-views.spec.ts e2e/issue-622-623-report-views.spec.ts e2e/issue-487-remaining-target-views.spec.ts e2e/issue-487-budget-contract-views.spec.ts)
            npx playwright test "${specs[@]}" --project=desktop --project=mobile --project=webkit-iphone --list > discovery.log 2>&1
            list_rc=$?
            for profile in desktop mobile webkit-iphone; do
              grep -q "\[$profile\].*620" discovery.log || list_rc=1
            done
            if [ "$list_rc" -eq 0 ]; then
              npx playwright test "${specs[@]}" --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none > browser.log 2>&1
              browser_rc=$?
            fi
          fi
          cat format.log lint.log type.log unit.log build.log discovery.log browser.log 2>/dev/null
          echo "RESULT format=$format_rc restored=$restored_rc lint=$lint_rc type=$type_rc unit=$unit_rc build=$build_rc list=$list_rc browser=$browser_rc"
          test "$format_rc" -eq 0 && test "$restored_rc" -eq 0 && test "$lint_rc" -eq 0 && test "$type_rc" -eq 0 && test "$unit_rc" -eq 0 && test "$build_rc" -eq 0 && test "$list_rc" -eq 0 && test "$browser_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue-620-source-contract-evidence
          path: |
            source-proof.txt
            format.log
            format-write.log
            format.patch
            lint.log
            type.log
            unit.log
            build.log
            discovery.log
            browser.log
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: ignore
          retention-days: 3
