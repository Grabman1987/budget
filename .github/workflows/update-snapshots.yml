name: Focused Windows queue and PDF shard proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify frozen source and sole workflow delta
        shell: pwsh
        run: |
          $source = git rev-parse HEAD^
          if ($source -ne '17171715fc8a7c52f1dbcee23e6d9489f646c53e') { throw "Unexpected source $source" }
          $paths = @(git diff --name-only HEAD^ HEAD)
          if ($paths.Count -ne 1 -or $paths[0] -ne '.github/workflows/update-snapshots.yml') { throw "Unexpected diff: $paths" }
          git rev-parse HEAD HEAD^ | Out-File -FilePath source-proof.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked test tooling
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Original Windows unit shard 1/2 including queue and protected PDF
        shell: pwsh
        run: |
          npx vitest run --shard=1/2 --reporter=verbose --reporter=json --outputFile.json=windows-results.json *> windows-unit.log
          $result = $LASTEXITCODE
          Get-Content -LiteralPath windows-unit.log -Tail 80
          "RESULT vitest=$result" | Out-File -FilePath result.txt
          exit $result
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-shard-one-proof
          path: |
            source-proof.txt
            windows-unit.log
            windows-results.json
            result.txt
          if-no-files-found: ignore
          retention-days: 3
