name: Plan overview status compatibility union proof
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Disposable exact-source branch
        required: true
permissions:
  contents: read
concurrency:
  group: month-overview-${{ inputs.branch }}
  cancel-in-progress: false
jobs:
  focused:
    if: inputs.branch == 'codex/plan-overview-union-proof-7f208ba9'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Exact restored status and old browser compatibility union
        run: |
          set +e
          set -o pipefail
          mkdir -p proof-output
          source_sha=7f208ba94094c37ae23ec5957566179b3f02e5c2
          test "$(git rev-parse HEAD^)" = "$source_sha" || exit 70
          git diff --exit-code "$source_sha" HEAD -- apps packages e2e docs || exit 71
          printf 'SOURCE=%s PROOF=%s\n' "$source_sha" "$(git rev-parse HEAD)" | tee proof-output/source.txt
          : > proof-output/format.patch
          git cat-file -e a820e56bb354e336f4b3c2aa81fcddfd9ed8f689^{commit} || exit 72
          mapfile -t targets < <(git diff --name-only fd324c24cdc4eafba8839844e852a4c0ee8b0e59 "$source_sha" -- apps e2e docs)
          printf '%s\n' "${targets[@]}" > proof-output/allowlist.txt
          npx prettier --check "${targets[@]}" 2>&1 | tee proof-output/format.log
          format_code=${PIPESTATUS[0]}
          if [ "$format_code" -ne 0 ]; then
            npx prettier --write "${targets[@]}" 2>&1 | tee proof-output/format-write.log
            git diff --binary -- "${targets[@]}" > proof-output/format.patch
            git diff --numstat -- "${targets[@]}" > proof-output/format-numstat.txt
            sha256sum proof-output/format.patch | tee proof-output/format.sha256
            git restore -- "${targets[@]}"
          fi
          mapfile -t ts < <(printf '%s\n' "${targets[@]}" | grep -E '\.(ts|tsx)$')
          npx eslint "${ts[@]}" 2>&1 | tee proof-output/eslint.log
          lint_code=${PIPESTATUS[0]}
          npm run typecheck 2>&1 | tee proof-output/typecheck.log
          type_code=${PIPESTATUS[0]}
          node packages/ui/scripts/check-css-scale.mjs 2>&1 | tee proof-output/css-scale.log
          css_code=${PIPESTATUS[0]}
          npx vitest run apps/web/src/budget/plan-separated-headings-481.test.tsx apps/web/src/budget/plan-model.test.ts 2>&1 | tee proof-output/unit.log
          unit_code=${PIPESTATUS[0]}
          npm run build:e2e 2>&1 | tee proof-output/build.log
          build_code=${PIPESTATUS[0]}
          overview=1
          compatibility=1
          if [ "$build_code" -eq 0 ]; then
            date -u '+overview-start %FT%TZ' | tee proof-output/timing.log
            npx playwright test e2e/issue-591-month-overview.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --trace=on --update-snapshots=none 2>&1 | tee proof-output/overview.log
            overview=${PIPESTATUS[0]}
            cp -a test-results proof-output/overview-results
            date -u '+compatibility-start %FT%TZ' | tee -a proof-output/timing.log
            npx playwright test e2e/plan-inspector.spec.ts e2e/plan-views.spec.ts e2e/plan.spec.ts e2e/heute-hints-1009.spec.ts e2e/issue-471-icons.spec.ts --grep 'inspector discloses month figures|plan views: status|plan: distinguish an empty target inventory|plan: the guard refuses assigning|tiny actual income stays the denominator|icon sizes, swatches and disclosure carets' --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --trace=on --update-snapshots=none 2>&1 | tee proof-output/compatibility.log
            compatibility=${PIPESTATUS[0]}
            cp -a test-results proof-output/compatibility-results
          fi
          sha256sum proof-output/format.patch | tee proof-output/format.sha256
          git diff --binary -- apps packages e2e docs > proof-output/source.patch
          git diff --stat | tee proof-output/final-diff.txt
          printf 'RESULT format=%s lint=%s type=%s css=%s unit=%s build=%s overview=%s compatibility=%s\n' "$format_code" "$lint_code" "$type_code" "$css_code" "$unit_code" "$build_code" "$overview" "$compatibility" | tee proof-output/result.txt
          [ "$format_code" -eq 0 ] && [ "$lint_code" -eq 0 ] && [ "$type_code" -eq 0 ] && [ "$css_code" -eq 0 ] && [ "$unit_code" -eq 0 ] && [ "$build_code" -eq 0 ] && [ "$overview" -eq 0 ] && [ "$compatibility" -eq 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: plan-overview-union-7f208ba9
          path: proof-output/
          if-no-files-found: warn
          retention-days: 7
