name: Focused final report target layout proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify frozen source and workflow-only delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = 'caf3857330b103b05f884dbbee634759bc37024e'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/update-snapshots.yml'
          git rev-parse HEAD HEAD^ > source-proof.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Retain corrected report target viewport images
        run: |
          set +e
          changed=(apps/web/src/pages/portfolio-contributions-report.css apps/web/src/reports/portfolio-report-views.tsx apps/web/src/reports/report-views.css apps/web/src/reports/projects-report.tsx e2e/issue-487-remaining-target-views.spec.ts)
          npx prettier --check "${changed[@]}" > format.log 2>&1
          format_rc=$?
          if [ "$format_rc" -ne 0 ]; then
            npx prettier --write "${changed[@]}" > format-write.log 2>&1
            git diff --binary -- "${changed[@]}" > format.patch
            git restore -- "${changed[@]}"
          fi
          git diff --quiet -- "${changed[@]}"
          restored_rc=$?
          npx eslint apps/web/src/reports/portfolio-report-views.tsx apps/web/src/reports/projects-report.tsx e2e/issue-487-remaining-target-views.spec.ts > lint.log 2>&1
          lint_rc=$?
          npm run typecheck > type.log 2>&1
          type_rc=$?
          npm run build:e2e > build.log 2>&1
          build_rc=$?
          browser_new_rc=1
          discovery_rc=1
          if [ "$build_rc" -eq 0 ]; then
            npx playwright test e2e/issue-487-remaining-target-views.spec.ts --project=desktop --project=webkit-iphone --grep '487 global project results|487 Portfolio (rendite|verteilung|einzahlungen)' --workers=1 --retries=0 --update-snapshots=none --list > discovery.txt 2>&1
            discovery_rc=$?
            found=1
            for profile in desktop webkit-iphone; do
              for name in '487 global project results' '487 Portfolio rendite' '487 Portfolio verteilung' '487 Portfolio einzahlungen'; do
                grep -q "\[$profile\].*$name" discovery.txt || found=0
              done
            done
            if [ "$discovery_rc" -eq 0 ] && [ "$found" -eq 1 ]; then
              npx playwright test e2e/issue-487-remaining-target-views.spec.ts --project=desktop --project=webkit-iphone --grep '487 global project results|487 Portfolio (rendite|verteilung|einzahlungen)' --workers=1 --retries=0 --update-snapshots=none > browser-new.log 2>&1
              browser_new_rc=$?
            else
              echo 'Required four image cases not discovered in both selected profiles' > browser-new.log
            fi
          fi
          cat format.log lint.log type.log build.log discovery.txt browser-new.log 2>/dev/null
          echo "RESULT format=$format_rc restored=$restored_rc lint=$lint_rc type=$type_rc build=$build_rc discovery=$discovery_rc new=$browser_new_rc"
          test "$format_rc" -eq 0 && test "$restored_rc" -eq 0 && test "$lint_rc" -eq 0 && test "$type_rc" -eq 0 && test "$build_rc" -eq 0 && test "$discovery_rc" -eq 0 && test "$browser_new_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: final-report-target-viewport-images
          path: |
            source-proof.txt
            format.log
            format-write.log
            format.patch
            lint.log
            type.log
            build.log
            discovery.txt
            browser-new.log
            browser-old.log
            test-results/**/*.png
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 3
