name: Reports 801 readable max state and complete portfolio contracts
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      specs:
        required: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 2
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Exact source parent and three changed paths
        run: |
          test "$(git rev-parse HEAD^)" = d65bb226a0a106c24f29ceb69b018718b4e4f48b
          test "$(git diff --name-only HEAD^ HEAD)" = .github/workflows/update-snapshots.yml
          git fetch --no-tags origin 2de896ee9a1034bdbb4ef71523a1ce58e9602ff0
          git cat-file -e '2de896ee9a1034bdbb4ef71523a1ce58e9602ff0^{commit}'
          git diff --name-only 2de896ee9a1034bdbb4ef71523a1ce58e9602ff0 d65bb226a0a106c24f29ceb69b018718b4e4f48b > /tmp/801-final-paths.txt
          test "$(wc -l < /tmp/801-final-paths.txt)" -eq 3
          cat /tmp/801-final-paths.txt
          git rev-parse HEAD HEAD^
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Scoped formatter
        id: format
        run: xargs -d '\n' npx prettier --check < /tmp/801-final-paths.txt
      - name: Exact durable full formatting patch
        if: always()
        run: |
          xargs -d '\n' npx prettier --write < /tmp/801-final-paths.txt
          git diff --binary > /tmp/801-final-format.patch
          sha256sum /tmp/801-final-format.patch
          git diff --stat
      - name: Scoped lint
        id: lint
        if: always()
        run: grep -E '\.(ts|tsx)$' /tmp/801-final-paths.txt | xargs -d '\n' npx eslint
      - name: CSS scale
        id: css
        if: always()
        run: node packages/ui/scripts/check-css-scale.mjs
      - name: Full typecheck
        id: types
        if: always()
        run: npm run typecheck
      - name: Build
        id: build
        if: always()
        run: npm run build:e2e
      - name: Discover and guard actual current case names in all profiles
        id: discovery
        if: always()
        run: |
          npx playwright test e2e/issue-544-portfolio-registers.spec.ts e2e/issue-619-628-reports-hub.spec.ts --grep 'portfolio navigation rows|five portfolio registers preserve period across navigation and reload|portfolio register fits accessible light and dark pages|portfolio endpoint|a closed calendar month|619 supported maximum saved views' --project=desktop --project=mobile --project=webkit-iphone --list | tee /tmp/801-final-discovery.txt
          test "$(grep -c 'portfolio register fits accessible light and dark pages' /tmp/801-final-discovery.txt)" -eq 15
          test "$(grep -c 'five portfolio registers preserve period across navigation and reload' /tmp/801-final-discovery.txt)" -eq 3
          test "$(grep -c '619 supported maximum saved views' /tmp/801-final-discovery.txt)" -eq 3
          grep -F 'Total: 33 tests' /tmp/801-final-discovery.txt
      - name: Complete existing portfolio spec and maximum keyboard state
        id: browser
        if: always() && steps.discovery.outcome == 'success'
        run: npx playwright test e2e/issue-544-portfolio-registers.spec.ts e2e/issue-619-628-reports-hub.spec.ts --grep 'portfolio navigation rows|five portfolio registers preserve period across navigation and reload|portfolio register fits accessible light and dark pages|portfolio endpoint|a closed calendar month|619 supported maximum saved views' --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - name: Baseline guard and honest actual outcomes
        if: always()
        run: |
          test -z "$(git diff --name-only -- 'e2e/*snapshots*')"
          echo 'RESULT format=${{ steps.format.outcome }} lint=${{ steps.lint.outcome }} CSS=${{ steps.css.outcome }} types=${{ steps.types.outcome }} build=${{ steps.build.outcome }} discovery=${{ steps.discovery.outcome }} browser=${{ steps.browser.outcome }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reports-801-final-impacted-proof
          path: |
            /tmp/801-final-format.patch
            /tmp/801-final-paths.txt
            /tmp/801-final-discovery.txt
            test-results/
          retention-days: 7
