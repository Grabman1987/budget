name: Focused corrected class mini proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Verify exact source and workflow-only delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = 'f98b816965faa14a877174d601c2a03621c82dc9'
          test "$(git diff --name-only HEAD^..HEAD)" = '.github/workflows/update-snapshots.yml'
          git rev-parse HEAD HEAD^ > source-proof.txt
          git diff --name-only HEAD^..HEAD >> source-proof.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Static, literal unit and full scoped browser proof
        run: |
          set +e
          files=(apps/web/src/wealth/portfolio-class-histories.tsx apps/web/src/wealth/portfolio-class-histories.test.tsx apps/web/src/wealth/portfolio-page.tsx apps/web/src/wealth/portfolio.css e2e/issue-544-portfolio-registers.spec.ts docs/handoff/portfolio-class-mini-525.md)
          npx prettier --check "${files[@]}" > format.log 2>&1
          format_rc=$?
          # Capture formatting mechanically, then restore the exact frozen source before every check.
          npx prettier --write "${files[@]}" > formatting-patch.log 2>&1
          git diff -- "${files[@]}" > format.patch
          sha256sum format.patch > format.patch.sha256
          git restore -- "${files[@]}"
          git diff --exit-code >> source-proof.txt
          restored_rc=$?
          test "$(git rev-parse HEAD^)" = 'f98b816965faa14a877174d601c2a03621c82dc9'
          source_rc=$?
          npx eslint apps/web/src/wealth/portfolio-class-histories.tsx apps/web/src/wealth/portfolio-class-histories.test.tsx apps/web/src/wealth/portfolio-page.tsx e2e/issue-544-portfolio-registers.spec.ts > lint.log 2>&1
          lint_rc=$?
          node packages/ui/scripts/check-css-scale.mjs > css.log 2>&1
          css_rc=$?
          npm run typecheck > type.log 2>&1
          type_rc=$?
          npx vitest run apps/web/src/wealth/portfolio-class-histories.test.tsx > unit.log 2>&1
          unit_rc=$?
          npm run build:e2e > build.log 2>&1
          build_rc=$?
          browser_rc=1
          list_rc=1
          if [ "$build_rc" -eq 0 ]; then
            specs=(e2e/issue-544-portfolio-registers.spec.ts)
            filter=(--grep 'class mini histories retain the shared period')
            profiles=(--project=desktop --project=mobile --project=webkit-iphone)
            npx playwright test "${specs[@]}" "${profiles[@]}" "${filter[@]}" --workers=1 --retries=0 --update-snapshots=none --list > discovery.txt 2>&1
            list_rc=$?
            if [ "$list_rc" -eq 0 ] && [ "$(grep -c 'class mini histories retain the shared period' discovery.txt)" -eq 3 ] && grep -q '\[desktop\]' discovery.txt && grep -q '\[mobile\]' discovery.txt && grep -q '\[webkit-iphone\]' discovery.txt; then
              npx playwright test "${specs[@]}" "${profiles[@]}" "${filter[@]}" --workers=1 --retries=0 --update-snapshots=none > browser.log 2>&1
              browser_rc=$?
            else
              echo 'Expected nonzero class mini cases missing from discovery' > browser.log
              cat discovery.txt >> browser.log
            fi
          fi
          cat source-proof.txt format.log lint.log css.log type.log unit.log build.log discovery.txt browser.log 2>/dev/null
          echo "RESULT restored=$restored_rc source=$source_rc format=$format_rc lint=$lint_rc css=$css_rc type=$type_rc unit=$unit_rc build=$build_rc list=$list_rc browser=$browser_rc"
          test "$restored_rc" -eq 0 && test "$source_rc" -eq 0 && test "$format_rc" -eq 0 && test "$lint_rc" -eq 0 && test "$css_rc" -eq 0 && test "$type_rc" -eq 0 && test "$unit_rc" -eq 0 && test "$build_rc" -eq 0 && test "$list_rc" -eq 0 && test "$browser_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: portfolio-class-mini-proof
          path: |
            source-proof.txt
            format.log
            lint.log
            css.log
            type.log
            unit.log
            build.log
            discovery.txt
            browser.log
            formatting-patch.log
            format.patch
            format.patch.sha256
            test-results/**/*.png
            test-results/**/trace.zip
            test-results/**/error-context.md
          if-no-files-found: ignore
          retention-days: 3
