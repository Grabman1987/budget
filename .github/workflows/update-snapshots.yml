name: Reconciliation 564 565 focused exact source proof
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      specs:
        required: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 2
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pin baseline source and complete formatting allowlist
        run: |
          git fetch --no-tags origin 31f919d62383a28becabe75e8397f6e1b64860c0
          git cat-file -e '31f919d62383a28becabe75e8397f6e1b64860c0^{commit}'
          test "$(git rev-parse HEAD^)" = ecba75ef3e4da6a00ffda8dc360f07d36f4e8bd9
          git cat-file -e 'ecba75ef3e4da6a00ffda8dc360f07d36f4e8bd9^{commit}'
          git rev-parse HEAD
          git rev-parse HEAD^
          git diff --name-only 31f919d62383a28becabe75e8397f6e1b64860c0 ecba75ef3e4da6a00ffda8dc360f07d36f4e8bd9 > /tmp/564-format-paths.txt
          test "$(wc -l < /tmp/564-format-paths.txt)" -eq 12
          cat /tmp/564-format-paths.txt
      - name: Scoped Prettier check
        run: xargs -d '\n' npx prettier --check < /tmp/564-format-paths.txt
      - name: Retain exact whole formatting patch
        if: always()
        run: |
          xargs -d '\n' npx prettier --write < /tmp/564-format-paths.txt
          git diff --binary > /tmp/564-format.patch
          sha256sum /tmp/564-format.patch
          git diff --stat
      - name: Scoped ESLint
        if: always()
        run: grep -E '\.(ts|tsx)$' /tmp/564-format-paths.txt | xargs -d '\n' npx eslint
      - name: CSS token scale
        if: always()
        run: node packages/ui/scripts/check-css-scale.mjs
      - name: Full typecheck
        if: always()
        run: npm run typecheck
      - name: Literal candidate category and canonical compatibility units
        if: always()
        run: npx vitest run apps/web/src/ledger/reconcile-candidates-564.test.tsx apps/web/src/ledger/reconcile-category-565.test.ts apps/web/src/ledger/reconcile-model.test.ts apps/web/src/ledger/reconcile-panel.test.tsx apps/server/src/api/reconcile-candidates-564.test.ts apps/server/src/api/api.test.ts apps/server/src/api/month-close.test.ts apps/web/src/month-close/month-close-page.test.tsx --maxWorkers=1 --reporter=verbose
      - name: Build E2E
        if: always()
        run: npm run build:e2e
      - name: Complete candidates and contextual category three profiles
        if: always()
        run: npx playwright test e2e/issue-564-reconcile-candidates.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: reconcile-564-565-focused-proof
          path: |
            /tmp/564-format.patch
            /tmp/564-format-paths.txt
            test-results/
          retention-days: 7
