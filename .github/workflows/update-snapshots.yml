name: Update e2e snapshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and workflow-only delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git show -s --format=%P HEAD)" = "6e5b25be172af3c3c2a9eab4dd0f52e21bc5f50d"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: format
        name: Scoped formatting with pinned patch collection
        continue-on-error: true
        run: |
          paths=(e2e/fab-focus-q5.spec.ts e2e/ledger.spec.ts)
          : > proof-format.patch
          if npx prettier --check "${paths[@]}"; then exit 0; fi
          npx prettier --write "${paths[@]}"
          git diff --binary -- "${paths[@]}" > proof-format.patch
          git restore -- "${paths[@]}"
          test -s proof-format.patch
          exit 1
      - id: lint
        name: Scoped ESLint
        continue-on-error: true
        run: npx eslint e2e/fab-focus-q5.spec.ts e2e/ledger.spec.ts
      - id: types
        name: Full workspace typecheck
        continue-on-error: true
        run: npm run typecheck
      - id: css
        name: Design-token CSS check
        continue-on-error: true
        run: node packages/ui/scripts/check-css-scale.mjs
      - id: build
        name: Build for browser proof
        continue-on-error: true
        run: npm run build:e2e
      - id: browser
        name: Strict detail focus and isolated bulk-delete browser cases
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: npx playwright test e2e/fab-focus-q5.spec.ts e2e/ledger.spec.ts --grep 'detail has one name|Alle Buchungen: filter in the URL' --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - id: baselines
        name: Assert no tracked mutation or baseline update
        continue-on-error: true
        run: git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: qa-542-797-focused-evidence
          path: |
            proof-format.patch
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: ignore
          retention-days: 3
      - name: Report actual scoped result
        if: always()
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPES: ${{ steps.types.outcome }}
          CSS: ${{ steps.css.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          BASELINES: ${{ steps.baselines.outcome }}
        run: |
          echo "RESULT format=$FORMAT lint=$LINT types=$TYPES css=$CSS build=$BUILD browser=$BROWSER baselines=$BASELINES"
          test "$FORMAT" = success && test "$LINT" = success && test "$TYPES" = success && test "$CSS" = success && test "$BUILD" = success && test "$BROWSER" = success && test "$BASELINES" = success
