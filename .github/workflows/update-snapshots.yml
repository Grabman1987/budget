name: Focused bank legend repair proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Verify exact source and workflow-only delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = '4b887e4b8f62a46bd20a5eca3aa04c1bc5f276f4'
          test "$(git diff --name-only HEAD^..HEAD)" = '.github/workflows/update-snapshots.yml'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Static and bank browser proof
        run: |
          set +e
          npx prettier --check apps/web/src/reports/bank-costs-report.tsx apps/web/src/reports/spending-reports.css e2e/issue-487-budget-contract-views.spec.ts > format.log 2>&1
          format_rc=$?
          npx eslint apps/web/src/reports/bank-costs-report.tsx e2e/issue-487-budget-contract-views.spec.ts > lint.log 2>&1
          lint_rc=$?
          node packages/ui/scripts/check-css-scale.mjs > css.log 2>&1
          css_rc=$?
          npm run typecheck > type.log 2>&1
          type_rc=$?
          npm run build:e2e > build.log 2>&1
          build_rc=$?
          browser_rc=1
          if [ "$build_rc" -eq 0 ]; then
            npx playwright test e2e/issue-487-budget-contract-views.spec.ts e2e/bank-costs-report.spec.ts --project=desktop --project=mobile --project=webkit-iphone --grep 'Verträge und Kosten retains separate source periods|shows monthly cost stacks, sources and separate earnings' --workers=1 --retries=0 --update-snapshots=none --list > discovery.txt 2>&1
            list_rc=$?
            if [ "$list_rc" -eq 0 ] && grep -q 'Verträge und Kosten retains separate source periods' discovery.txt && grep -q 'shows monthly cost stacks, sources and separate earnings' discovery.txt; then
              npx playwright test e2e/issue-487-budget-contract-views.spec.ts e2e/bank-costs-report.spec.ts --project=desktop --project=mobile --project=webkit-iphone --grep 'Verträge und Kosten retains separate source periods|shows monthly cost stacks, sources and separate earnings' --workers=1 --retries=0 --update-snapshots=none > browser.log 2>&1
              browser_rc=$?
            else
              echo 'Expected cases missing from discovery' >> browser.log
              cat discovery.txt >> browser.log
            fi
          fi
          cat format.log lint.log css.log type.log build.log discovery.txt browser.log 2>/dev/null
          echo "RESULT format=$format_rc lint=$lint_rc css=$css_rc type=$type_rc build=$build_rc browser=$browser_rc"
          test "$format_rc" -eq 0 && test "$lint_rc" -eq 0 && test "$css_rc" -eq 0 && test "$type_rc" -eq 0 && test "$build_rc" -eq 0 && test "$browser_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bank-wrap-proof
          path: |
            format.log
            lint.log
            css.log
            type.log
            build.log
            discovery.txt
            browser.log
            test-results/**/*.png
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 3
