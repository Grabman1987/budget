name: Verify report aliases and all affected existing consumers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin reviewed source and canonical workflow
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "0dc3845c1bf8d4f2800be35d19a5809107f68208"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
          git merge-base --is-ancestor dfd441a82b93813a8168d8fbc442349a5ad79475 HEAD^
          git restore --source=HEAD^ --worktree -- .github/workflows/update-snapshots.yml
          git diff --exit-code HEAD^
          git rev-parse HEAD HEAD^ > source-proof.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check full candidate formatting and original-source behavior
        run: |
          set +e
          mapfile -t targets < <(git diff --name-only dfd441a82b93813a8168d8fbc442349a5ad79475 HEAD^ -- '*.ts' '*.tsx' '*.css' '*.md')
          mapfile -t units < <(git diff --name-only dfd441a82b93813a8168d8fbc442349a5ad79475 HEAD^ -- '*test.ts' '*test.tsx')
          mapfile -t changed_specs < <(git diff --name-only dfd441a82b93813a8168d8fbc442349a5ad79475 HEAD^ -- 'e2e/*.spec.ts')
          test "${#units[@]}" -eq 10 && test "${#changed_specs[@]}" -eq 29 && test "${#targets[@]}" -gt 0
          inventory_rc=$?
          npx prettier --check "${targets[@]}" > format.log 2>&1
          format_rc=$?
          npx prettier --write "${targets[@]}" > format-write.log 2>&1
          first_rc=$?
          git diff --binary HEAD^ -- "${targets[@]}" > format-first.patch
          npx prettier --write "${targets[@]}" > format-second.log 2>&1
          second_rc=$?
          git diff --binary HEAD^ -- "${targets[@]}" > format.patch
          sha256sum "${targets[@]}" > format-candidate-sha256.txt
          npx prettier --write "${targets[@]}" > format-third.log 2>&1
          third_rc=$?
          sha256sum --check format-candidate-sha256.txt > format-idempotence.log 2>&1
          idempotence_rc=$?
          git diff --binary HEAD^ -- "${targets[@]}" > format-third.patch
          printf '%s\n' "${targets[@]}" | sort > format-allowed-paths.txt
          git diff --name-only HEAD^ | sort > format-actual-paths.txt
          test -z "$(comm -23 format-actual-paths.txt format-allowed-paths.txt)"
          scope_rc=$?
          npm run lint > candidate-lint.log 2>&1
          candidate_lint_rc=$?
          git restore --source=HEAD^ --worktree -- "${targets[@]}"
          git diff --quiet HEAD^
          restored_rc=$?
          npm run typecheck > type.log 2>&1
          type_rc=$?
          npx vitest run "${units[@]}" apps/web/src/reports/report-frame.test.tsx apps/web/src/pages/goals-progress-query.test.ts apps/web/src/pages/goals-progress-model.test.ts packages/domain/src/overview/explorer-templates-625.test.ts packages/domain/src/overview/explorer-csv-627.test.ts > unit.log 2>&1
          unit_rc=$?
          npm run build:e2e > build.log 2>&1
          build_rc=$?
          list_rc=1
          browser_rc=1
          if [ "$build_rc" -eq 0 ]; then
            specs=(e2e/heute.spec.ts e2e/glossary.spec.ts e2e/income-targets-report-ranges.spec.ts e2e/whole-picture.spec.ts e2e/chart-inspection.spec.ts e2e/issue-512-visible-quality.spec.ts e2e/issue-546-portfolio-metrics.spec.ts e2e/verdicts.spec.ts e2e/issue-620-report-aliases.spec.ts)
            npx playwright test "${specs[@]}" --project=desktop --project=mobile --project=webkit-iphone --list > discovery.log 2>&1
            list_rc=$?
            for spec in "${specs[@]}"; do
              test -f "$spec" || list_rc=1
              grep -q "$(basename "$spec")" discovery.log || list_rc=1
            done
            scenarios=('Heute month forecast ends two days after month end and names payments in the shared tooltip' 'Heute payday forecast follows the bracket and last axis label' 'a direct R07 visit falls back to Bis Gehalt without a stored choice' 'R07 remembers Heute period and retains its API forecast and low point in either mode' 'a past month has no out-of-range today marker in the balance or pace chart' 'settled balance reaches the forecast and the composition measures its parts in both motion modes')
            for profile in desktop mobile; do
              for scenario in "${scenarios[@]}"; do
                test "$(grep -F "[$profile]" discovery.log | grep -F 'heute.spec.ts' | grep -F "$scenario" | wc -l)" -eq 1 || list_rc=1
              done
              for group in 'Monat und Einkommen' 'Ausgaben und Plan' 'Zukunft und Vermögen' 'Portfolio' 'Überblick'; do
                test "$(grep -F "[$profile]" discovery.log | grep -F 'verdicts.spec.ts' | grep -F "Fazit: $group" | wc -l)" -eq 1 || list_rc=1
              done
              test "$(grep -F "[$profile]" discovery.log | grep -F 'issue-620-report-aliases.spec.ts' | grep -F ' opens ' | wc -l)" -eq 34 || list_rc=1
            done
            test "$(grep -F '[webkit-iphone]' discovery.log | grep -F 'issue-620-report-aliases.spec.ts' | grep -F ' opens ' | wc -l)" -eq 34 || list_rc=1
            for spec in glossary.spec.ts issue-512-visible-quality.spec.ts issue-546-portfolio-metrics.spec.ts; do
              grep -F '[webkit-iphone]' discovery.log | grep -qF "$spec" || list_rc=1
            done
            dark='dark Heute text and chart status remain readable without colour alone'
            npx playwright test e2e/booking-acceptance.spec.ts --grep "$dark" --project=desktop --project=mobile --project=webkit-iphone --list > discovery-dark.log 2>&1
            dark_list_rc=$?
            test "$dark_list_rc" -eq 0 || list_rc=1
            for profile in desktop mobile; do
              test "$(grep -F "[$profile]" discovery-dark.log | grep -F 'booking-acceptance.spec.ts' | grep -F "$dark" | wc -l)" -eq 1 || list_rc=1
            done
            if [ "$list_rc" -eq 0 ]; then
              npx playwright test "${specs[@]}" --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none --output=test-results-broad > browser.log 2>&1
              broad_rc=$?
              npx playwright test e2e/booking-acceptance.spec.ts --grep "$dark" --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none --output=test-results-dark > browser-dark.log 2>&1
              dark_rc=$?
              browser_rc=1
              if [ "$broad_rc" -eq 0 ] && [ "$dark_rc" -eq 0 ]; then browser_rc=0; fi
            fi
          fi
          git restore --worktree -- .github/workflows/update-snapshots.yml
          git diff --name-status > post-runtime-changes.txt
          git diff --quiet
          cleanup_rc=$?
          cat format.log format-idempotence.log candidate-lint.log type.log unit.log build.log discovery.log discovery-dark.log browser.log browser-dark.log 2>/dev/null
          echo "RESULT inventory=$inventory_rc format=$format_rc first=$first_rc second=$second_rc third=$third_rc idempotence=$idempotence_rc scope=$scope_rc candidateLint=$candidate_lint_rc restored=$restored_rc cleanup=$cleanup_rc type=$type_rc unit=$unit_rc build=$build_rc list=$list_rc browser=$browser_rc"
          test "$inventory_rc" -eq 0 && test "$format_rc" -eq 0 && test "$first_rc" -eq 0 && test "$second_rc" -eq 0 && test "$third_rc" -eq 0 && test "$idempotence_rc" -eq 0 && test "$scope_rc" -eq 0 && test "$candidate_lint_rc" -eq 0 && test "$restored_rc" -eq 0 && test "$cleanup_rc" -eq 0 && test "$type_rc" -eq 0 && test "$unit_rc" -eq 0 && test "$build_rc" -eq 0 && test "$list_rc" -eq 0 && test "$browser_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue-620-broad-consumer-evidence
          path: |
            source-proof.txt
            post-runtime-changes.txt
            *paths.txt
            format*.txt
            format*.patch
            *.log
            test-results-broad/**/*.pdf
            test-results-broad/**/*.png
            test-results-broad/**/*.zip
            test-results-broad/**/*.md
            test-results-dark/**/*.png
            test-results-dark/**/*.zip
            test-results-dark/**/*.md
            test-results/**/*.pdf
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: ignore
          retention-days: 3
