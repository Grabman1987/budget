name: Update e2e snapshots

# Manual only. Regenerates the Playwright screenshot baselines on Linux (the CI platform) for one
# branch and commits them back, for PRs that change the UI on purpose. The owner's Windows machine
# and the cloud sessions cannot produce Linux baselines themselves.
# Commits pushed with GITHUB_TOKEN do not start CI: push any commit afterwards (or re-run CI).
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch whose baselines to update (never main)
        required: true
      specs:
        description: Space-separated spec paths (e.g. e2e/shell.spec.ts); empty = every spec that compares screenshots
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-snapshots-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  update:
    if: inputs.branch != 'main'
    runs-on: ubuntu-24.04
    # A type-scale change regenerates nearly every baseline; give it room.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      # Non-screenshot failures are reported by the normal CI run on the PR, not here.
      - name: Regenerate changed screenshots
        env:
          SPECS: ${{ inputs.specs }}
        run: |
          npm run build:e2e
          read -r -a specs <<< "$SPECS"
          if [ "${#specs[@]}" -eq 0 ]; then
            mapfile -t specs < <(grep -lE 'expectScreenshot|toHaveScreenshot' e2e/*.spec.ts)
          fi
          npx playwright test --update-snapshots=changed "${specs[@]}" || true
      - name: Commit the new baselines
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- e2e
          if git diff --cached --quiet; then echo 'No baseline changes.'; exit 0; fi
          git commit -m 'test: update e2e screenshot baselines (Linux)'
          git push origin "HEAD:refs/heads/$BRANCH"
