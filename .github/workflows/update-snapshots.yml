name: Update e2e snapshots
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Disposable proof branch; never main
        required: true
      specs:
        description: Fixed original P0 specs; ignored by this proof
        required: false
        default: ''
permissions:
  contents: read
jobs:
  update:
    if: inputs.branch != 'main'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 3
      - name: Verify immutable source and proof-only workflow
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git cat-file -e ae96107794fe3218a4aad408a42f8fa7f473ddee^{commit}
          test "$(git diff --name-only ae96107794fe3218a4aad408a42f8fa7f473ddee HEAD)" = .github/workflows/update-snapshots.yml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build and run original P0 browser specs in all three profiles
        run: |
          npm run build:e2e
          npx playwright test e2e/glossary.spec.ts e2e/wealth-ux-v1.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: p0-513-screens
          path: |
            test-results/**/*.png
            docs/evidence/wealth-performance-499/*.jpg
          if-no-files-found: error
          retention-days: 7
