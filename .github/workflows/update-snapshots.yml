name: Reproduce missing named booking filters
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin tests-first source and unchanged production
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "85f178dfa467b3bc739cb6c8bc6e9e15d156be3e"
          test "$(git rev-parse HEAD^^)" = "656b2bbb3bd7c178857c64f82cebd96e6d87ff16"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
          printf '%s\n' apps/server/src/api/booking-views-818.test.ts e2e/issue-818-ledger-saved-filters.spec.ts > expected-paths.txt
          git diff --name-only HEAD^^ HEAD^ > actual-paths.txt
          diff -u expected-paths.txt actual-paths.txt
          git restore --source=HEAD^ --worktree -- .github/workflows/update-snapshots.yml
          git diff --exit-code HEAD^
          git rev-parse HEAD HEAD^ HEAD^^ > source-proof.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Reproduce missing API and menu on unchanged production
        run: |
          set +e
          npm run typecheck > type.log 2>&1
          type_rc=$?
          npx vitest run apps/server/src/api/booking-views-818.test.ts > unit.log 2>&1
          unit_rc=$?
          npm run build:e2e > build.log 2>&1
          build_rc=$?
          list_rc=1
          browser_rc=1
          if [ "$build_rc" -eq 0 ]; then
            npx playwright test e2e/issue-818-ledger-saved-filters.spec.ts --project=desktop --project=mobile --project=webkit-iphone --list > discovery.log 2>&1
            list_rc=$?
            for profile in desktop mobile webkit-iphone; do
              grep -F "[$profile]" discovery.log | grep -Fq 'issue-818-ledger-saved-filters.spec.ts' || list_rc=1
            done
            if [ "$list_rc" -eq 0 ]; then
              npx playwright test e2e/issue-818-ledger-saved-filters.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none > browser.log 2>&1
              browser_rc=$?
            fi
          fi
          git diff --quiet HEAD^
          source_rc=$?
          git restore --worktree -- .github/workflows/update-snapshots.yml
          git diff --quiet
          cleanup_rc=$?
          cat type.log unit.log build.log discovery.log browser.log 2>/dev/null
          echo "RESULT type=$type_rc unit=$unit_rc build=$build_rc list=$list_rc browser=$browser_rc original=$source_rc cleanup=$cleanup_rc"
          test "$type_rc" -eq 0 && test "$unit_rc" -eq 0 && test "$build_rc" -eq 0 && test "$list_rc" -eq 0 && test "$browser_rc" -eq 0 && test "$source_rc" -eq 0 && test "$cleanup_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue-818-tests-first-missing-feature-red
          path: |
            source-proof.txt
            *paths.txt
            *.log
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: ignore
          retention-days: 3
