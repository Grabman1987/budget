name: Validate overspending triage 237 on Linux

# Temporary, read-only helper. Do not copy this workflow into the task PR.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Frozen helper branch to validate (never main)
        required: true
        default: codex/topchip-237-linux-preflight-1009

permissions:
  contents: read

concurrency:
  group: topchip-237-linux-preflight-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.branch != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_SHA: e5b8d7ff9dfa8e53e7b763c498ff33019731dfa6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 2
          persist-credentials: false
      - name: Prove frozen task source before checks
        run: |
          git cat-file -e "$SOURCE_SHA^{commit}"
          git diff --exit-code "$SOURCE_SHA" HEAD -- . ':(exclude).github/workflows/update-snapshots.yml'
          git diff --check "$SOURCE_SHA" HEAD
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Focused overspending regressions
        run: npx vitest run apps/web/src/shell/overspent-chip.test.tsx apps/web/src/heute/attention-bar.test.tsx apps/web/src/shell/mobile-chrome.test.tsx --maxWorkers=1
      - name: Complete repository check
        env:
          BUDGET_REQUIRE_AGE: '1'
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Install pinned Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Build E2E app
        run: npm run build:e2e
      - name: Overspending navigation and real cover workflows
        run: npx playwright test e2e/topbar-plan-triage-237.spec.ts e2e/overspent-counts.spec.ts e2e/attention.spec.ts e2e/ux-cover-limits.spec.ts --project=desktop --project=mobile --workers=1
      - name: Compare targeted Linux visual baselines without updating them
        run: >-
          npx playwright test e2e/shell.spec.ts e2e/rules.spec.ts e2e/networth.spec.ts
          e2e/goals.spec.ts e2e/expected.spec.ts --project=desktop --project=mobile --workers=1
          --grep 'regression baselines of the shell|stages and rules show the rule book, axe clean in both themes|own baseline, (light|dark)|baseline and axe in the (light|dark) theme|the 90 days and (a payment panel|the Einnahmen panel)'
      - name: Prove task source stayed unchanged
        if: always()
        run: |
          git diff --exit-code "$SOURCE_SHA" HEAD -- . ':(exclude).github/workflows/update-snapshots.yml'
          git diff --exit-code
          git diff --cached --exit-code
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: topchip-237-linux-preflight-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
