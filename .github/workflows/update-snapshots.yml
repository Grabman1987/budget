name: Spending pilot 554 complete privacy and drill proof
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      specs:
        required: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 2
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pin baseline source and complete formatting allowlist
        run: |
          git fetch --no-tags origin 9d41432cbaeff2dd7937976af666cbf8b4d0b662
          git cat-file -e '9d41432cbaeff2dd7937976af666cbf8b4d0b662^{commit}'
          test "$(git rev-parse HEAD^)" = 2ae7ddd489471eb7815627b8281272a1a3941f01
          git cat-file -e '2ae7ddd489471eb7815627b8281272a1a3941f01^{commit}'
          git rev-parse HEAD
          git rev-parse HEAD^
          git diff --name-only 9d41432cbaeff2dd7937976af666cbf8b4d0b662 2ae7ddd489471eb7815627b8281272a1a3941f01 > /tmp/554-format-paths.txt
          test "$(wc -l < /tmp/554-format-paths.txt)" -eq 20
          cat /tmp/554-format-paths.txt
      - name: Scoped Prettier check
        run: xargs -d '\n' npx prettier --check < /tmp/554-format-paths.txt
      - name: Retain exact whole formatting patch
        if: always()
        run: |
          xargs -d '\n' npx prettier --write < /tmp/554-format-paths.txt
          git diff --binary > /tmp/554-format.patch
          sha256sum /tmp/554-format.patch
          git diff --stat
      - name: Scoped ESLint
        if: always()
        run: grep -E '\.(ts|tsx)$' /tmp/554-format-paths.txt | xargs -d '\n' npx eslint
      - name: CSS token scale
        if: always()
        run: node packages/ui/scripts/check-css-scale.mjs
      - name: Full typecheck
        if: always()
        run: npm run typecheck
      - name: Build E2E
        if: always()
        run: npm run build:e2e
      - name: Complete new pilot privacy group drill and Explorer three profiles
        if: always()
        run: npx playwright test e2e/issue-554-spending-pilot.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: spending-554-privacy-drill-proof
          path: |
            /tmp/554-format.patch
            /tmp/554-format-paths.txt
            test-results/
          retention-days: 7
