name: Validate wealth detail navigation 248 before PR publication

# Temporary helper branch only; never copy this workflow into the task PR.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Frozen helper branch to validate (never main)
        required: true

permissions:
  contents: read

concurrency:
  group: wealth-248-preflight-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.branch != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Focused wealth regressions
        run: npx vitest run packages/domain/src/invest/savings-plan.test.ts apps/web/src/wealth/savings-model.test.ts apps/server/src/api/savings-schedules.test.ts apps/server/src/api/savings-confirmation.test.ts apps/server/src/api/portfolio-positions.test.ts packages/db/src/repos/portfolio-missing-quotes.test.ts --maxWorkers=1
      - name: Complete repository check
        env:
          BUDGET_REQUIRE_AGE: '1'
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Install pinned Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Build E2E app
        run: npm run build:e2e
      - name: Desktop and mobile wealth detail workflows
        run: npx playwright test e2e/wealth-detail-pages.spec.ts e2e/portfolio-instruments.spec.ts e2e/portfolio-positions.spec.ts e2e/missing-quotes.spec.ts e2e/savings-plans.spec.ts e2e/trade-confirmation.spec.ts --project=desktop --project=mobile --workers=1
      - name: Verify source diff stayed empty
        env:
          SOURCE_SHA: 189226ba1f775f2ecae3bbe8b7643fe4b18572b8
        run: |
          git diff --exit-code "$SOURCE_SHA" HEAD -- . ':(exclude).github/workflows/update-snapshots.yml'
          git diff --exit-code
          git diff --cached --exit-code
          git diff --check "$SOURCE_SHA" HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wealth-248-linux-preflight
          path: |
            playwright-report/
            test-results/
          retention-days: 7
