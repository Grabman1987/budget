name: Ledger filters focused proof
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      specs:
        required: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format changed files and retain full mechanical patch
        run: |
          npx prettier --write apps/server/src/api/booking-csv.ts apps/server/src/api/booking-filter-594.test.ts apps/server/src/api/bookings.ts apps/web/src/ledger/api.ts apps/web/src/ledger/booking-table.tsx apps/web/src/ledger/bookings-page.tsx apps/web/src/ledger/bookings-search.test.ts apps/web/src/ledger/bookings-search.ts apps/web/src/ledger/cache.test.ts apps/web/src/ledger/cache.ts apps/web/src/ledger/ledger.css apps/web/src/ledger/mutations.test.tsx apps/web/src/ledger/scheduled-register-row.tsx apps/web/src/ledger/types.ts docs/ledger-filters-594.md e2e/accounts-sidebar-profile.spec.ts e2e/issue-594-ledger-filters.spec.ts e2e/ledger-filters.spec.ts e2e/ledger-helpers.ts packages/db/src/repos/ledger-queries.ts
          git diff --binary > /tmp/594-format.patch
          sha256sum /tmp/594-format.patch
          git diff --stat
      - name: Scoped ESLint
        run: npx eslint apps/server/src/api/booking-csv.ts apps/server/src/api/booking-filter-594.test.ts apps/server/src/api/bookings.ts apps/web/src/ledger/api.ts apps/web/src/ledger/booking-table.tsx apps/web/src/ledger/bookings-page.tsx apps/web/src/ledger/bookings-search.test.ts apps/web/src/ledger/bookings-search.ts apps/web/src/ledger/cache.test.ts apps/web/src/ledger/cache.ts apps/web/src/ledger/mutations.test.tsx apps/web/src/ledger/scheduled-register-row.tsx apps/web/src/ledger/types.ts e2e/accounts-sidebar-profile.spec.ts e2e/issue-594-ledger-filters.spec.ts e2e/ledger-filters.spec.ts e2e/ledger-helpers.ts packages/db/src/repos/ledger-queries.ts
      - name: Full typecheck
        if: always()
        run: npm run typecheck
      - name: Literal API cache rollback and affected existing guards
        if: always()
        run: npx vitest run apps/server/src/api/booking-filter-594.test.ts apps/server/src/api/booking-ux.test.ts apps/server/src/api/api.test.ts apps/server/src/api/export.test.ts apps/web/src/ledger/mutations.test.tsx apps/web/src/ledger/cache.test.ts apps/web/src/ledger/bookings-search.test.ts packages/db/src/repos/ledger-api.test.ts
      - name: Build E2E
        if: always()
        run: npm run build:e2e
      - name: Default configured profile acceptance without retries or snapshot changes
        if: always()
        run: npx playwright test e2e/issue-594-ledger-filters.spec.ts e2e/ledger-filters.spec.ts e2e/ledger.spec.ts e2e/booking-ux.spec.ts e2e/accounts-sidebar-profile.spec.ts e2e/checkbox-appearance.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ledger-filters-594-focused-proof
          path: |
            /tmp/594-format.patch
            test-results/
          retention-days: 7
