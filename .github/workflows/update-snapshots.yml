name: RED Heute section isolation and offline timestamp units
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin tests-first source and unchanged production
        run: |
          test "$(git rev-parse HEAD^)" = "1f716d722082b1e4b6111427ee8ea7a5588e8dcd"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
          git diff --exit-code dfd441a82b93813a8168d8fbc442349a5ad79475 HEAD^ -- apps/server packages apps/web/src/heute/heute-page.tsx apps/web/src/heute/kennzahlen.tsx apps/web/src/heute/attention-bar.tsx apps/web/src/heute/heute.css
          printf '%s\n' apps/web/src/heute/section-states.test.tsx apps/web/src/pwa/offline-wealth-comparison.test.tsx > expected-paths.txt
          git diff --name-only dfd441a82b93813a8168d8fbc442349a5ad79475 HEAD^ > actual-paths.txt
          diff -u expected-paths.txt actual-paths.txt
          git rev-parse HEAD HEAD^ > source-proof.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run real API-backed state regressions before production changes
        run: |
          set +e
          npm run typecheck > type.log 2>&1
          type_rc=$?
          npx vitest run apps/web/src/heute/section-states.test.tsx apps/web/src/pwa/offline-wealth-comparison.test.tsx > unit.log 2>&1
          unit_rc=$?
          cat type.log unit.log
          echo "RESULT type=$type_rc unit=$unit_rc"
          test "$type_rc" -eq 0 && test "$unit_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue-574-tests-first-state-unit-evidence
          path: |
            source-proof.txt
            expected-paths.txt
            actual-paths.txt
            type.log
            unit.log
          if-no-files-found: ignore
          retention-days: 3
