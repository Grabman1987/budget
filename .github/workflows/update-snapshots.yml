name: Ledger deletion focused proof
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      specs:
        required: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format reviewed source and durably retain whole exact patch
        run: |
          npx prettier --write apps/server/src/api/booking-delete-597.test.ts apps/server/src/api/bookings.ts apps/server/src/api/schemas.ts apps/web/src/ledger/api.ts apps/web/src/ledger/booking-delete-confirmation.tsx apps/web/src/ledger/booking-panel.tsx apps/web/src/ledger/bookings-page.tsx apps/web/src/ledger/capture-form.tsx apps/web/src/ledger/ledger.css apps/web/src/ledger/mutations.ts docs/ledger-delete-597.md e2e/issue-597-ledger-delete.spec.ts packages/db/src/repos/bank-transfer-component-597.test.ts packages/db/src/repos/booking-bulk-eligibility.ts packages/db/src/repos/bookings.ts packages/db/src/repos/index.ts packages/db/src/repos/invariants.ts
          git diff --binary > /tmp/597-format.patch
          sha256sum /tmp/597-format.patch
          git diff --stat
      - name: Scoped ESLint
        run: npx eslint apps/server/src/api/booking-delete-597.test.ts apps/server/src/api/bookings.ts apps/server/src/api/schemas.ts apps/web/src/ledger/api.ts apps/web/src/ledger/booking-delete-confirmation.tsx apps/web/src/ledger/booking-panel.tsx apps/web/src/ledger/bookings-page.tsx apps/web/src/ledger/capture-form.tsx apps/web/src/ledger/mutations.ts e2e/issue-597-ledger-delete.spec.ts packages/db/src/repos/bank-transfer-component-597.test.ts packages/db/src/repos/booking-bulk-eligibility.ts packages/db/src/repos/bookings.ts packages/db/src/repos/index.ts packages/db/src/repos/invariants.ts
      - name: Full typecheck
        if: always()
        run: npm run typecheck
      - name: Complete literal deletion bank compatibility and original protected unit files
        if: always()
        run: npx vitest run apps/server/src/api/booking-delete-597.test.ts apps/server/src/api/booking-bulk-596.test.ts apps/server/src/api/api.test.ts apps/server/src/api/invest.test.ts apps/server/src/api/contacts.test.ts packages/db/src/repos/bookings.test.ts packages/db/src/repos/bank-followups.test.ts packages/db/src/repos/contacts.test.ts packages/db/src/repos/bank-transfer-component-597.test.ts apps/web/src/ledger/capture-form.test.tsx apps/web/src/ledger/mutations.test.tsx apps/web/src/ledger/cache.test.ts
      - name: Build E2E
        if: always()
        run: npm run build:e2e
      - name: Default-profile deletion and original transfer Undo acceptance
        if: always()
        run: npx playwright test e2e/issue-597-ledger-delete.spec.ts e2e/ledger.spec.ts e2e/bank-followups.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ledger-597-focused-proof
          path: |
            /tmp/597-format.patch
            test-results/
          retention-days: 7
