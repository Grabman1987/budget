name: Update e2e snapshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact source and workflow-only delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "28cc64c1304a024692e6f08c4774f1efa0ad0812"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check scoped formatting and retain exact patch if needed
        run: |
          paths=(apps/server/src/api/portfolio-allocation.test.ts apps/web/src/wealth/allocation-section.tsx packages/db/src/repos/allocation-inputs.ts packages/db/src/repos/portfolio-allocation.ts e2e/issue-521-allocation-provenance.spec.ts)
          if ! npx prettier --check "${paths[@]}"; then
            npx prettier --write "${paths[@]}"
            git diff --binary -- "${paths[@]}" > proof-format.patch
            exit 1
          fi
      - name: Scoped ESLint
        run: npx eslint apps/server/src/api/portfolio-allocation.test.ts apps/web/src/wealth/allocation-section.tsx packages/db/src/repos/allocation-inputs.ts packages/db/src/repos/portfolio-allocation.ts e2e/issue-521-allocation-provenance.spec.ts
      - name: Full workspace typecheck
        run: npm run typecheck
      - name: Build for browser proof
        run: npm run build:e2e
      - name: Three-profile UI provenance and privacy proof
        run: npx playwright test e2e/issue-521-allocation-provenance.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - name: Assert no baseline mutation
        run: git diff --exit-code -- e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue-521-focused-evidence
          path: |
            proof-format.patch
            test-results/**/*.png
            test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 3
