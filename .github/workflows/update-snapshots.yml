name: Reproduce canonical report navigation self loops
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin tests-first source and unchanged legacy production navigation
        run: |
          test "$(git rev-parse HEAD^)" = "e736f34d29e1419513141bdd576841befb59daf4"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
          test "$(git rev-parse HEAD^:apps/web/src/reports/report-navigation.tsx)" = "49e1363521e7aef5c0e92d29b30a5b4729067a01"
          git restore --source=HEAD^ --worktree -- .github/workflows/update-snapshots.yml
          git diff --exit-code HEAD^
          git rev-parse HEAD HEAD^ HEAD^:apps/web/src/reports/report-navigation.tsx > source-proof.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck and reproduce the canonical navigation contract on original production
        run: |
          set +e
          npm run typecheck > type.log 2>&1
          type_rc=$?
          npx vitest run apps/web/src/reports/report-navigation.test.tsx apps/web/src/reports/report-hub-619.test.ts > unit.log 2>&1
          unit_rc=$?
          git diff --quiet HEAD^
          source_rc=$?
          git restore --worktree -- .github/workflows/update-snapshots.yml
          git diff --quiet
          cleanup_rc=$?
          cat type.log unit.log
          echo "RESULT type=$type_rc unit=$unit_rc original=$source_rc cleanup=$cleanup_rc"
          test "$type_rc" -eq 0 && test "$unit_rc" -eq 0 && test "$source_rc" -eq 0 && test "$cleanup_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue-620-canonical-navigation-unit-red
          path: |
            source-proof.txt
            type.log
            unit.log
          if-no-files-found: ignore
          retention-days: 3
