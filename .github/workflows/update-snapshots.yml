name: Focused remaining report target proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify frozen source and workflow-only delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = 'f676e3ebbc9ae9772c62297ee5353340f160ce88'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/update-snapshots.yml'
          git rev-parse HEAD HEAD^ > source-proof.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Static and three-profile target-view proof
        run: |
          set +e
          changed=(apps/web/src/nav/reports-catalog.ts apps/web/src/pages/portfolio-allocation-report.tsx apps/web/src/pages/portfolio-contributions-report.tsx apps/web/src/pages/portfolio-performance-report.tsx apps/web/src/pages/reports-pages.tsx apps/web/src/reports/income-cashflow-report.tsx apps/web/src/reports/portfolio-report-views.tsx apps/web/src/reports/projects-report.tsx apps/web/src/reports/remaining-target-search-487.test.ts apps/web/src/reports/report-search.ts e2e/issue-487-remaining-target-views.spec.ts)
          npx prettier --check "${changed[@]}" > format.log 2>&1
          format_rc=$?
          if [ "$format_rc" -ne 0 ]; then
            npx prettier --write "${changed[@]}" > format-write.log 2>&1
            git diff --binary -- "${changed[@]}" > format.patch
            git restore -- "${changed[@]}"
          fi
          git diff --quiet -- "${changed[@]}"
          restored_rc=$?
          npx eslint "${changed[@]}" > lint.log 2>&1
          lint_rc=$?
          npm run typecheck > type.log 2>&1
          type_rc=$?
          npx vitest run apps/web/src/reports/remaining-target-search-487.test.ts > unit.log 2>&1
          unit_rc=$?
          npm run build:e2e > build.log 2>&1
          build_rc=$?
          browser_rc=1
          discovery_rc=1
          specs=(e2e/issue-487-remaining-target-views.spec.ts e2e/issue-621-income-project-views.spec.ts e2e/portfolio-performance-report.spec.ts e2e/portfolio-allocation-report.spec.ts e2e/portfolio-contributions-report.spec.ts)
          if [ "$build_rc" -eq 0 ]; then
            npx playwright test "${specs[@]}" --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none --list > discovery.txt 2>&1
            discovery_rc=$?
            if [ "$discovery_rc" -eq 0 ] && grep -q '\[desktop\].*487 global project results' discovery.txt && grep -q '\[mobile\].*487 global project results' discovery.txt && grep -q '\[webkit-iphone\].*487 global project results' discovery.txt && grep -q '\[desktop\].*487 Portfolio switching' discovery.txt && grep -q '\[mobile\].*487 Portfolio switching' discovery.txt && grep -q '\[webkit-iphone\].*487 Portfolio switching' discovery.txt; then
              npx playwright test "${specs[@]}" --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none > browser.log 2>&1
              browser_rc=$?
            else
              echo 'Required new cases not discovered in all three profiles' > browser.log
            fi
          fi
          cat format.log lint.log type.log unit.log build.log discovery.txt browser.log 2>/dev/null
          echo "RESULT format=$format_rc restored=$restored_rc lint=$lint_rc type=$type_rc unit=$unit_rc build=$build_rc discovery=$discovery_rc browser=$browser_rc"
          test "$format_rc" -eq 0 && test "$restored_rc" -eq 0 && test "$lint_rc" -eq 0 && test "$type_rc" -eq 0 && test "$unit_rc" -eq 0 && test "$build_rc" -eq 0 && test "$discovery_rc" -eq 0 && test "$browser_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: remaining-report-target-proof
          path: |
            source-proof.txt
            format.log
            format-write.log
            format.patch
            lint.log
            type.log
            unit.log
            build.log
            discovery.txt
            browser.log
            test-results/**/*.png
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 3
