name: Diagnose report table formatting and retain exact browser coverage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin PR source and restore its canonical workflow for the full lint check
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = "a616dc2a3da8ed388921db8c349c16789ce7f2f0"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/update-snapshots.yml"
          git merge-base --is-ancestor dfd441a82b93813a8168d8fbc442349a5ad79475 HEAD^
          git restore --source=HEAD^ --worktree -- .github/workflows/update-snapshots.yml
          git diff --exit-code HEAD^
          git rev-parse HEAD HEAD^ > source-proof.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Diagnose formatter idempotence and test the unmodified PR source
        run: |
          set +e
          mapfile -t units < <(git diff --name-only dfd441a82b93813a8168d8fbc442349a5ad79475 HEAD^ -- '*test.ts' '*test.tsx')
          mapfile -t specs < <(git diff --name-only dfd441a82b93813a8168d8fbc442349a5ad79475 HEAD^ -- 'e2e/*.spec.ts')
          test "${#units[@]}" -eq 7 && test "${#specs[@]}" -eq 17
          inventory_rc=$?
          cp e2e/report-tables.spec.ts format-input.txt
          sha256sum e2e/report-tables.spec.ts > format-input-sha256.txt
          npx prettier --check e2e/report-tables.spec.ts > format.log 2>&1
          format_rc=$?
          npx prettier --write e2e/report-tables.spec.ts > format-write.log 2>&1
          write_rc=$?
          git diff --name-only HEAD^ > format-paths.txt
          test "$(cat format-paths.txt)" = "e2e/report-tables.spec.ts"
          scope_rc=$?
          git diff --binary HEAD^ -- e2e/report-tables.spec.ts > format.patch
          cp e2e/report-tables.spec.ts format-candidate.txt
          sha256sum e2e/report-tables.spec.ts > format-candidate-sha256.txt
          npx prettier --write e2e/report-tables.spec.ts > format-third.log 2>&1
          third_rc=$?
          cmp -s format-candidate.txt e2e/report-tables.spec.ts
          idempotence_rc=$?
          git diff --binary HEAD^ -- e2e/report-tables.spec.ts > format-third.patch
          npm run lint > candidate-lint.log 2>&1
          candidate_lint_rc=$?
          git restore --source=HEAD^ --worktree -- e2e/report-tables.spec.ts
          git diff --quiet HEAD^
          restored_rc=$?
          npm run typecheck > type.log 2>&1
          type_rc=$?
          unit_rc=1
          if [ "$inventory_rc" -eq 0 ]; then
            npx vitest run "${units[@]}" apps/web/src/reports/report-frame.test.tsx apps/web/src/pages/goals-progress-query.test.ts apps/web/src/pages/goals-progress-model.test.ts packages/domain/src/overview/explorer-templates-625.test.ts packages/domain/src/overview/explorer-csv-627.test.ts > unit.log 2>&1
            unit_rc=$?
          fi
          npm run build:e2e > build.log 2>&1
          build_rc=$?
          list_rc=1
          browser_rc=1
          if [ "$inventory_rc" -eq 0 ] && [ "$build_rc" -eq 0 ]; then
            npx playwright test e2e/contact-report.spec.ts e2e/report-tables.spec.ts --grep "fixed EUR report preserves credit|all 36 months with the running month marked" --project=desktop --project=mobile --project=webkit-iphone --list > discovery.log 2>&1
            list_rc=$?
            test "$(grep -c 'contact-report.spec.ts.*fixed EUR report preserves credit' discovery.log)" -eq 2 || list_rc=1
            test "$(grep -c 'report-tables.spec.ts.*all 36 months with the running month marked' discovery.log)" -eq 3 || list_rc=1
            for profile in desktop mobile webkit-iphone; do
              grep -q "\[$profile\].*all 36 months with the running month marked" discovery.log || list_rc=1
            done
            if [ "$list_rc" -eq 0 ]; then
              npx playwright test e2e/contact-report.spec.ts e2e/report-tables.spec.ts --grep "fixed EUR report preserves credit|all 36 months with the running month marked" --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none > browser.log 2>&1
              browser_rc=$?
            fi
          fi
          git restore --worktree -- .github/workflows/update-snapshots.yml
          git diff --quiet
          cleanup_rc=$?
          cat format.log format-write.log format-third.log candidate-lint.log type.log unit.log build.log discovery.log browser.log 2>/dev/null
          echo "RESULT inventory=$inventory_rc format=$format_rc write=$write_rc scope=$scope_rc third=$third_rc idempotence=$idempotence_rc candidateLint=$candidate_lint_rc restored=$restored_rc cleanup=$cleanup_rc type=$type_rc unit=$unit_rc build=$build_rc list=$list_rc browser=$browser_rc"
          test "$inventory_rc" -eq 0 && test "$format_rc" -eq 0 && test "$write_rc" -eq 0 && test "$scope_rc" -eq 0 && test "$third_rc" -eq 0 && test "$idempotence_rc" -eq 0 && test "$candidate_lint_rc" -eq 0 && test "$restored_rc" -eq 0 && test "$cleanup_rc" -eq 0 && test "$type_rc" -eq 0 && test "$unit_rc" -eq 0 && test "$build_rc" -eq 0 && test "$list_rc" -eq 0 && test "$browser_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: issue-620-format-idempotence-and-browser-evidence
          path: |
            source-proof.txt
            format*.txt
            format*.patch
            *.log
            test-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.md
          if-no-files-found: ignore
          retention-days: 3
