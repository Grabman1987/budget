name: Ledger delete final integrated proof
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      specs:
        required: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 2
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Record exact reviewed source and format allowlist
        run: |
          git fetch --no-tags origin 9d41432cbaeff2dd7937976af666cbf8b4d0b662
          git cat-file -e '9d41432cbaeff2dd7937976af666cbf8b4d0b662^{commit}'
          test "$(git rev-parse HEAD^)" = 49929f8c1cd14176d3da32a777ee787582504356
          git cat-file -e '49929f8c1cd14176d3da32a777ee787582504356^{commit}'
          git rev-parse HEAD
          git rev-parse HEAD^
          git diff --name-only 9d41432cbaeff2dd7937976af666cbf8b4d0b662 49929f8c1cd14176d3da32a777ee787582504356 > /tmp/597-integrated-format-paths.txt
          test "$(wc -l < /tmp/597-integrated-format-paths.txt)" -eq 22
          cat /tmp/597-integrated-format-paths.txt
      - name: Scoped Prettier check
        run: xargs -d '\n' npx prettier --check < /tmp/597-integrated-format-paths.txt
      - name: Retain whole exact scoped format patch
        if: always()
        run: |
          xargs -d '\n' npx prettier --write < /tmp/597-integrated-format-paths.txt
          git diff --binary > /tmp/597-integrated-format.patch
          sha256sum /tmp/597-integrated-format.patch
          git diff --stat
      - name: Scoped ESLint
        run: |
          grep -E '\.(ts|tsx)$' /tmp/597-integrated-format-paths.txt | xargs -d '\n' npx eslint
      - name: Full typecheck
        if: always()
        run: npm run typecheck
      - name: Scoped cache filter FX component and delete Undo units
        if: always()
        run: npx vitest run apps/web/src/ledger/booking-selected-fx-597.test.tsx apps/web/src/ledger/bulk-delete-summary-597.test.tsx apps/web/src/ledger/cache.test.ts apps/web/src/ledger/mutations.test.tsx apps/web/src/ledger/booking-table-581.test.tsx apps/web/src/ledger/account-review-581.test.tsx apps/web/src/ledger/fx-format.test.ts apps/web/src/ledger/upcoming-summary.test.tsx apps/server/src/api/booking-filter-594.test.ts apps/server/src/api/booking-delete-597.test.ts apps/server/src/api/booking-bulk-596.test.ts packages/db/src/repos/bank-transfer-component-597.test.ts
      - name: Build E2E
        if: always()
        run: npm run build:e2e
      - name: Complete delete and held account-month acceptance three profiles
        if: always()
        run: npx playwright test e2e/issue-597-ledger-delete.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ledger-597-final-integrated-proof
          path: |
            /tmp/597-integrated-format.patch
            /tmp/597-integrated-format-paths.txt
            test-results/
          retention-days: 7
