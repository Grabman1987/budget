name: Update e2e snapshots
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
      specs:
        required: false
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build E2E
        if: always()
        run: npm run build:e2e
      - name: Existing booking flows on configured profiles
        if: always()
        run: npx playwright test e2e/tap-targets.spec.ts --project=webkit-iphone --grep="phone navigation" --workers=1 --retries=0 --update-snapshots=none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: bulk-596-edge-diagnostic
          path: |
            /tmp/596-compatibility-format.patch
            test-results/
          retention-days: 7
