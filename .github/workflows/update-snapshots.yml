name: Diagnose report target overflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Verify exact source and diagnostic-only delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = '4549c32392e6c5cd1b08274bb8b0334c23f193c2'
          diff=$(git diff --name-only HEAD^..HEAD)
          test "$diff" = $'.github/workflows/update-snapshots.yml\ne2e/issue-487-budget-contract-views.spec.ts'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Diagnose one WebKit case without changing its oracle
        run: |
          npm run build:e2e
          npx playwright test e2e/issue-487-budget-contract-views.spec.ts --project=webkit-iphone --grep 'Verträge und Kosten retains separate source periods' --workers=1 --retries=0 --update-snapshots=none --list > discovery.txt
          grep -q 'Verträge und Kosten retains separate source periods' discovery.txt
          npx playwright test e2e/issue-487-budget-contract-views.spec.ts --project=webkit-iphone --grep 'Verträge und Kosten retains separate source periods' --workers=1 --retries=0 --update-snapshots=none
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bank-overflow-diagnostic
          path: |
            discovery.txt
            test-results/**/trace.zip
            test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 3
