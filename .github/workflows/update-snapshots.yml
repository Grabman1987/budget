name: Income scope 266 independent visual and keyboard proof

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to validate (must be a direct child of the frozen source)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: income-scope-266-final-retry-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  preflight:
    if: inputs.branch != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 2
          persist-credentials: false
      - name: Prove frozen source and clean checkout before installing anything
        env:
          SOURCE_SHA: 5ee28a96021b1be644fe549dbb140d5583bb103f
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA" HEAD -- . ':(exclude).github/workflows/update-snapshots.yml'
          git diff --check "$SOURCE_SHA" HEAD
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install age for required encrypted-backup coverage
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: E2E build
        run: npm run build:e2e
      - name: Regenerate only the six reviewed income and Heute Linux baselines
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/visual-update
        run: npx playwright test e2e/shell.spec.ts e2e/expected.spec.ts --project=desktop --project=mobile --workers=1 --grep 'light heute|dark heute|the 90 days and the Einnahmen panel' --update-snapshots=changed --output=test-results/visual-update
      - name: Reject any snapshot or source change outside the six-image allowlist
        run: |
          set -euo pipefail
          allowed=$(cat <<'EOF'
          e2e/shell.spec.ts-snapshots/shell-heute-light-desktop-linux.png
          e2e/shell.spec.ts-snapshots/shell-heute-light-mobile-linux.png
          e2e/shell.spec.ts-snapshots/shell-heute-dark-desktop-linux.png
          e2e/shell.spec.ts-snapshots/shell-heute-dark-mobile-linux.png
          e2e/expected.spec.ts-snapshots/expected-income-dark-desktop-linux.png
          e2e/expected.spec.ts-snapshots/expected-income-dark-mobile-linux.png
          EOF
          )
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if ! printf '%s\n' "$allowed" | grep -Fxq -- "$path"; then
              echo "Unexpected tracked change: $path" >&2
              exit 1
            fi
          done < <(git diff --name-only)
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git diff --name-only -- . ':(exclude)e2e/shell.spec.ts-snapshots/shell-heute-light-desktop-linux.png' ':(exclude)e2e/shell.spec.ts-snapshots/shell-heute-light-mobile-linux.png' ':(exclude)e2e/shell.spec.ts-snapshots/shell-heute-dark-desktop-linux.png' ':(exclude)e2e/shell.spec.ts-snapshots/shell-heute-dark-mobile-linux.png' ':(exclude)e2e/expected.spec.ts-snapshots/expected-income-dark-desktop-linux.png' ':(exclude)e2e/expected.spec.ts-snapshots/expected-income-dark-mobile-linux.png')"
          for path in \
            e2e/shell.spec.ts-snapshots/shell-heute-light-desktop-linux.png \
            e2e/shell.spec.ts-snapshots/shell-heute-light-mobile-linux.png \
            e2e/shell.spec.ts-snapshots/shell-heute-dark-desktop-linux.png \
            e2e/shell.spec.ts-snapshots/shell-heute-dark-mobile-linux.png \
            e2e/expected.spec.ts-snapshots/expected-income-dark-desktop-linux.png \
            e2e/expected.spec.ts-snapshots/expected-income-dark-mobile-linux.png; do
            test -f "$path"
          done
      - name: Verify regenerated visual cases without updating snapshots
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/visual-verify
        run: npx playwright test e2e/shell.spec.ts e2e/expected.spec.ts --project=desktop --project=mobile --workers=1 --grep 'light heute|dark heute|the 90 days and the Einnahmen panel' --output=test-results/visual-verify
      - name: Full typecheck, lint, and unit suite
        env:
          BUDGET_REQUIRE_AGE: '1'
        run: npm run check
      - name: Final source, parent, and checkout proof
        if: always()
        env:
          SOURCE_SHA: 5ee28a96021b1be644fe549dbb140d5583bb103f
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA" HEAD -- . ':(exclude).github/workflows/update-snapshots.yml'
          git diff --check "$SOURCE_SHA" HEAD
          git diff --cached --exit-code
          unexpected=$(git diff --name-only -- . ':(exclude)e2e/shell.spec.ts-snapshots/shell-heute-light-desktop-linux.png' ':(exclude)e2e/shell.spec.ts-snapshots/shell-heute-light-mobile-linux.png' ':(exclude)e2e/shell.spec.ts-snapshots/shell-heute-dark-desktop-linux.png' ':(exclude)e2e/shell.spec.ts-snapshots/shell-heute-dark-mobile-linux.png' ':(exclude)e2e/expected.spec.ts-snapshots/expected-income-dark-desktop-linux.png' ':(exclude)e2e/expected.spec.ts-snapshots/expected-income-dark-mobile-linux.png')
          test -z "$unexpected"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              playwright-report/*|test-results/*) ;;
              *) echo "Unexpected untracked file: $path" >&2; exit 1 ;;
            esac
          done < <(git ls-files --others --exclude-standard)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: income-scope-266-final-linux-independent
          path: |
            playwright-report/visual-update/
            playwright-report/visual-verify/
            test-results/
            e2e/shell.spec.ts-snapshots/shell-heute-light-desktop-linux.png
            e2e/shell.spec.ts-snapshots/shell-heute-light-mobile-linux.png
            e2e/shell.spec.ts-snapshots/shell-heute-dark-desktop-linux.png
            e2e/shell.spec.ts-snapshots/shell-heute-dark-mobile-linux.png
            e2e/expected.spec.ts-snapshots/expected-income-dark-desktop-linux.png
            e2e/expected.spec.ts-snapshots/expected-income-dark-mobile-linux.png
          retention-days: 7
