name: Validate income scope 266 before PR publication

# Temporary helper branch only; never copy this workflow into the task PR.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Frozen helper branch to validate (never main)
        required: true

permissions:
  contents: read

concurrency:
  group: income-scope-266-preflight-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.branch != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source base before running checks
        env:
          SOURCE_SHA: c3b31dbffdeab3f64a3f70180926d0299d391dd4
        run: |
          git cat-file -e "$SOURCE_SHA^{commit}"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA" HEAD -- . ':(exclude).github/workflows/update-snapshots.yml'
          git diff --check "$SOURCE_SHA" HEAD
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Focused income-scope unit regressions
        run: npx vitest run apps/web/src/heute/answer-cards.test.tsx apps/web/src/expected/income-panel.test.tsx apps/server/src/api/income-month.test.ts --maxWorkers=1
      - name: Complete repository check
        env:
          BUDGET_REQUIRE_AGE: '1'
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Install pinned Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Build E2E app
        run: npm run build:e2e
      - name: Functional income scope workflows
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/functional
        run: npx playwright test e2e/income-scope-266.spec.ts e2e/plan-detail-pages.spec.ts e2e/income-next-month.spec.ts --project=desktop --project=mobile --workers=1 --output=test-results/functional
      - name: Focused Heute and expected-income visual regressions
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/visual
        run: npx playwright test e2e/shell.spec.ts e2e/expected.spec.ts --project=desktop --project=mobile --workers=1 --grep 'light heute|dark heute|the 90 days and the Einnahmen panel' --output=test-results/visual
      - name: Verify source stayed unchanged
        if: always()
        env:
          SOURCE_SHA: c3b31dbffdeab3f64a3f70180926d0299d391dd4
        run: |
          git cat-file -e "$SOURCE_SHA^{commit}"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git diff --exit-code "$SOURCE_SHA" HEAD -- . ':(exclude).github/workflows/update-snapshots.yml'
          git diff --check "$SOURCE_SHA" HEAD
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: income-scope-266-linux-preflight
          path: |
            playwright-report/functional/
            playwright-report/visual/
            test-results/
          retention-days: 7
