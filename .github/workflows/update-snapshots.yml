name: Month overview scoped proof
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Disposable exact-source branch
        required: true
permissions:
  contents: read
concurrency:
  group: month-overview-${{ inputs.branch }}
  cancel-in-progress: false
jobs:
  focused:
    if: inputs.branch == 'codex/month-overview-proof-943d796b'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Exact month overview static, literal units and configured browser cases
        run: |
          set +e
          set -o pipefail
          mkdir -p proof-output
          source_sha=943d796b39d06f2b16e91bf3b89c0790295afb0c
          test "$(git rev-parse HEAD^)" = "$source_sha" || exit 70
          git diff --exit-code "$source_sha" HEAD -- apps packages e2e docs || exit 71
          printf 'SOURCE=%s PROOF=%s\n' "$source_sha" "$(git rev-parse HEAD)" | tee proof-output/source.txt
          mapfile -t targets < <(git diff --name-only a820e56bb354e336f4b3c2aa81fcddfd9ed8f689 "$source_sha" -- apps e2e docs)
          printf '%s\n' "${targets[@]}" > proof-output/allowlist.txt
          npx prettier --check "${targets[@]}" 2>&1 | tee proof-output/format.log
          format_code=${PIPESTATUS[0]}
          if [ "$format_code" -ne 0 ]; then
            npx prettier --write "${targets[@]}" 2>&1 | tee proof-output/format-write.log
            git diff --binary -- "${targets[@]}" > proof-output/format.patch
            git diff --numstat -- "${targets[@]}" > proof-output/format-numstat.txt
            sha256sum proof-output/format.patch | tee proof-output/format.sha256
            git restore -- "${targets[@]}"
          fi
          mapfile -t ts < <(printf '%s\n' "${targets[@]}" | grep -E '\.(ts|tsx)$')
          npx eslint "${ts[@]}" 2>&1 | tee proof-output/eslint.log
          lint_code=${PIPESTATUS[0]}
          npm run typecheck 2>&1 | tee proof-output/typecheck.log
          type_code=${PIPESTATUS[0]}
          node packages/ui/scripts/check-css-scale.mjs 2>&1 | tee proof-output/css-scale.log
          css_code=${PIPESTATUS[0]}
          npx vitest run apps/web/src/budget/plan-overview-591.test.ts apps/web/src/budget/plan-overview-state-591.test.tsx apps/web/src/budget/budget-ui.test.tsx apps/web/src/budget/plan-page-head.test.tsx apps/web/src/budget/plan-page-cover.test.tsx apps/web/src/budget/split-band.test.tsx apps/web/src/budget/plan-available.test.ts apps/web/src/budget/plan-activity-735.test.tsx 2>&1 | tee proof-output/unit.log
          unit_code=${PIPESTATUS[0]}
          npm run build:e2e 2>&1 | tee proof-output/build.log
          build_code=${PIPESTATUS[0]}
          overview=1
          parity=1
          compatibility=1
          if [ "$build_code" -eq 0 ]; then
            date -u '+overview-start %FT%TZ' | tee proof-output/timing.log
            npx playwright test e2e/issue-591-month-overview.spec.ts --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --trace=on --update-snapshots=none 2>&1 | tee proof-output/overview.log
            overview=${PIPESTATUS[0]}
            cp -a test-results proof-output/overview-results
            date -u '+parity-start %FT%TZ' | tee -a proof-output/timing.log
            npx playwright test e2e/issue-571-heute-kennzahlen.spec.ts --grep 'each value equals the same figure on Plan' --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --trace=on --update-snapshots=none 2>&1 | tee proof-output/parity.log
            parity=${PIPESTATUS[0]}
            cp -a test-results proof-output/parity-results
            date -u '+compatibility-start %FT%TZ' | tee -a proof-output/timing.log
            npx playwright test e2e/issue-587-plan-monat-kopf.spec.ts e2e/plan-compact-grid.spec.ts --grep 'rows carry no position numbers|head is accessible|compact groups retain' --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --trace=on --update-snapshots=none 2>&1 | tee proof-output/compatibility.log
            compatibility=${PIPESTATUS[0]}
            cp -a test-results proof-output/compatibility-results
            date -u '+compatibility-end %FT%TZ' | tee -a proof-output/timing.log
          fi
          git diff --stat | tee proof-output/final-diff.txt
          printf 'RESULT format=%s lint=%s type=%s css=%s unit=%s build=%s overview=%s parity=%s compatibility=%s\n' "$format_code" "$lint_code" "$type_code" "$css_code" "$unit_code" "$build_code" "$overview" "$parity" "$compatibility" | tee proof-output/result.txt
          [ "$format_code" -eq 0 ] && [ "$lint_code" -eq 0 ] && [ "$type_code" -eq 0 ] && [ "$css_code" -eq 0 ] && [ "$unit_code" -eq 0 ] && [ "$build_code" -eq 0 ] && [ "$overview" -eq 0 ] && [ "$parity" -eq 0 ] && [ "$compatibility" -eq 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: month-overview-943d796b
          path: proof-output/
          if-no-files-found: warn
          retention-days: 7
