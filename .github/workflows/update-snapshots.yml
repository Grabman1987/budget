name: Focused report target content proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Verify exact source and workflow-only delta
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD^)" = '4549c32392e6c5cd1b08274bb8b0334c23f193c2'
          test "$(git diff --name-only HEAD^..HEAD)" = '.github/workflows/update-snapshots.yml'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Scoped static, literal units and old/new report browsers
        run: |
          set +e
          files=(
            apps/web/src/pages/reports-pages.tsx
            apps/web/src/reports/bank-costs-report.tsx
            apps/web/src/reports/budget-adherence-report.tsx
            apps/web/src/reports/budget-contract-report-views.tsx
            apps/web/src/reports/budget-contract-search.test.ts
            apps/web/src/reports/contracts-report.tsx
            apps/web/src/reports/planning-accuracy-report.tsx
            apps/web/src/reports/report-search.ts
            docs/handoff/reports-target-487-a.md
            e2e/issue-487-budget-contract-views.spec.ts
          )
          mkdir -p proof-artifacts
          npx prettier --check "${files[@]}"; format_rc=$?
          if [ "$format_rc" -ne 0 ]; then
            npx prettier --write "${files[@]}"
            git diff -- "${files[@]}" > proof-artifacts/format.patch
            git restore -- "${files[@]}"
          fi
          npx eslint "${files[0]}" "${files[1]}" "${files[2]}" "${files[3]}" "${files[4]}" "${files[5]}" "${files[6]}" "${files[7]}" "${files[9]}"; lint_rc=$?
          node packages/ui/scripts/check-css-scale.mjs; css_rc=$?
          npm run typecheck; type_rc=$?
          npx vitest run apps/web/src/reports/budget-contract-search.test.ts apps/web/src/reports/report-detail-search.test.ts apps/web/src/reports/planning-accuracy-report.test.tsx; unit_rc=$?
          npm run build:e2e; build_rc=$?
          specs=(
            e2e/issue-487-budget-contract-views.spec.ts
            e2e/budget-adherence-report.spec.ts
            e2e/planning-accuracy.spec.ts
            e2e/contracts-report.spec.ts
            e2e/bank-costs-report.spec.ts
            e2e/reports-search-package.spec.ts
          )
          if [ "$build_rc" -eq 0 ]; then
            npx playwright test "${specs[@]}" --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none --list > proof-artifacts/list.txt 2>&1
            list_rc=$?
            feature_cases=$(grep -c 'issue-487-budget-contract-views.spec.ts' proof-artifacts/list.txt || true)
            echo "Discovered feature cases: $feature_cases"
            tail -n 4 proof-artifacts/list.txt
            if [ "$list_rc" -eq 0 ] && [ "$feature_cases" -ge 6 ]; then
              npx playwright test "${specs[@]}" --project=desktop --project=mobile --project=webkit-iphone --workers=1 --retries=0 --update-snapshots=none
              browser_rc=$?
            else
              browser_rc=98
            fi
          else
            list_rc=99
            browser_rc=99
          fi
          echo "RESULT format=$format_rc lint=$lint_rc css=$css_rc type=$type_rc unit=$unit_rc build=$build_rc list=$list_rc browser=$browser_rc"
          test "$format_rc" -eq 0 && test "$lint_rc" -eq 0 && test "$css_rc" -eq 0 && test "$type_rc" -eq 0 && test "$unit_rc" -eq 0 && test "$build_rc" -eq 0 && test "$list_rc" -eq 0 && test "$browser_rc" -eq 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: focused-report-target-evidence
          path: |
            proof-artifacts/**
            test-results/**/*.png
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
