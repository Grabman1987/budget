<!-- @dsCard group="Colors" viewport="700x230" name="Semantic signals" subtitle="Plus (teal) · Minus/act (orange-red) · Warning (amber) — ink + soft fill, both modes" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--ground)}.cap{font-family:var(--font-tech);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}.mono{font-family:var(--font-tech);font-size:12px;color:var(--muted)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.c{padding:10px 12px;border-radius:999px;font-weight:600;font-size:13px;display:inline-block}</style></head><body><div  style="background:var(--ground);padding:12px;margin:-4px 0 8px"><div class="cap" style="margin-bottom:8px">hell</div><div class="g"><div><span class="c" style="background:var(--positivesoft);color:var(--positive)">+4.323,68 € · gedeckt</span></div><div><span class="c" style="background:var(--negativesoft);color:var(--negative)">−38,20 € · überzogen</span></div><div><span class="c" style="background:var(--warningsoft);color:var(--warning)">▲ vorgemerkt · prüfen</span></div></div></div><div data-mode="dunkel" style="background:var(--ground);padding:12px;margin:-4px 0 8px"><div class="cap" style="margin-bottom:8px">dunkel</div><div class="g"><div><span class="c" style="background:var(--positivesoft);color:var(--positive)">+4.323,68 € · gedeckt</span></div><div><span class="c" style="background:var(--negativesoft);color:var(--negative)">−38,20 € · überzogen</span></div><div><span class="c" style="background:var(--warningsoft);color:var(--warning)">▲ vorgemerkt · prüfen</span></div></div></div></body></html>
