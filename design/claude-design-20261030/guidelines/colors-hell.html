<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--ground)}.cap{font-family:var(--font-tech);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}.mono{font-family:var(--font-tech);font-size:12px;color:var(--muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px"><div><div style="height:52px;border-radius:4px;background:var(--ground);box-shadow:inset 0 0 0 1px rgba(10,35,66,.15)"></div><div style="margin-top:6px;font-size:12px;color:var(--ink)">ground</div><div class="mono" style="color:var(--subtle)">#EEF3F9</div></div><div><div style="height:52px;border-radius:4px;background:var(--sidebar);box-shadow:inset 0 0 0 1px rgba(10,35,66,.15)"></div><div style="margin-top:6px;font-size:12px;color:var(--ink)">sidebar</div><div class="mono" style="color:var(--subtle)">#E3EBF5</div></div><div><div style="height:52px;border-radius:4px;background:var(--soft);box-shadow:inset 0 0 0 1px rgba(10,35,66,.15)"></div><div style="margin-top:6px;font-size:12px;color:var(--ink)">soft</div><div class="mono" style="color:var(--subtle)">#F5F8FC</div></div><div><div style="height:52px;border-radius:4px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(10,35,66,.15)"></div><div style="margin-top:6px;font-size:12px;color:var(--ink)">surface</div><div class="mono" style="color:var(--subtle)">#FFFFFF</div></div><div><div style="height:52px;border-radius:4px;background:var(--active);box-shadow:inset 0 0 0 1px rgba(10,35,66,.15)"></div><div style="margin-top:6px;font-size:12px;color:var(--ink)">active</div><div class="mono" style="color:var(--subtle)">#DCEAF8</div></div><div><div style="height:52px;border-radius:4px;background:var(--line);box-shadow:inset 0 0 0 1px rgba(10,35,66,.15)"></div><div style="margin-top:6px;font-size:12px;color:var(--ink)">line</div><div class="mono" style="color:var(--subtle)">#D3DEEC</div></div><div><div style="height:52px;border-radius:4px;background:var(--field);box-shadow:inset 0 0 0 1px rgba(10,35,66,.15)"></div><div style="margin-top:6px;font-size:12px;color:var(--ink)">field</div><div class="mono" style="color:var(--subtle)">#6786AC</div></div><div><div style="height:52px;border-radius:4px;background:var(--subtle);box-shadow:inset 0 0 0 1px rgba(10,35,66,.15)"></div><div style="margin-top:6px;font-size:12px;color:var(--ink)">subtle</div><div class="mono" style="color:var(--subtle)">#4D6A89</div></div><div><div style="height:52px;border-radius:4px;background:var(--muted);box-shadow:inset 0 0 0 1px rgba(10,35,66,.15)"></div><div style="margin-top:6px;font-size:12px;color:var(--ink)">muted</div><div class="mono" style="color:var(--subtle)">#36557A</div></div><div><div style="height:52px;border-radius:4px;background:var(--ink);box-shadow:inset 0 0 0 1px rgba(10,35,66,.15)"></div><div style="margin-top:6px;font-size:12px;color:var(--ink)">ink</div><div class="mono" style="color:var(--subtle)">#0A2342</div></div><div><div style="height:52px;border-radius:4px;background:var(--primary);box-shadow:inset 0 0 0 1px rgba(10,35,66,.15)"></div><div style="margin-top:6px;font-size:12px;color:var(--ink)">primary</div><div class="mono" style="color:var(--subtle)">#0D5EAE</div></div><div><div style="height:52px;border-radius:4px;background:var(--title);box-shadow:inset 0 0 0 1px rgba(10,35,66,.15)"></div><div style="margin-top:6px;font-size:12px;color:var(--ink)">title</div><div class="mono" style="color:var(--subtle)">#0D5EAE</div></div></div></body></html>
