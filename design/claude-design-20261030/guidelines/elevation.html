<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Flat hairline panels; shadow only for floating layers" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--ground)}.cap{font-family:var(--font-tech);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}.mono{font-family:var(--font-tech);font-size:12px;color:var(--muted)}.r{display:flex;gap:24px}.b{width:190px;height:100px;border-radius:4px;background:var(--surface);padding:12px;font-size:13px;color:var(--muted)}</style></head><body><div class="r"><div class="b" style="box-shadow:inset 0 0 0 1px var(--line)">Panel · 1px hairline<br><span class="mono">no shadow</span></div><div class="b" style="box-shadow:inset 0 0 0 1px var(--field)">Field · 1px field stroke<br><span class="mono">≥ 3:1</span></div><div class="b" style="border-radius:12px;box-shadow:var(--shadow-float)">Floating · dialog, toast, FAB<br><span class="mono">--shadow-float</span></div></div></body></html>
