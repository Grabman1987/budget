 class="mono" style="color:rgb(133,175,209)">#1F4D7C</div></div><div><div style="height:52px;border-radius:4px;background:var(--field);box-shadow:inset 0 0 0 1px rgb(114,180,222)"></div><div style="margin-top:6px;font-size:12px;color:rgb(242,250,255)">field</div><div class="mono" style="color:rgb(133,175,209)">#4987BC</div></div><div><div style="height:52px;border-radius:4px;background:var(--subtle);box-shadow:inset 0 0 0 1px rgb(114,180,222)"></div><div style="margin-top:6px;font-size:12px;color:rgb(242,250,255)">subtle</div><div class="mono" style="color:rgb(133,175,209)">#8FB4D1</div></div><div><div style="height:52px;border-radius:4px;background:var(--muted);box-shadow:inset 0 0 0 1px rgb(114,180,222)"></div><div style="margin-top:6px;font-size:12px;color:rgb(242,250,255)">muted</div><div class="mono" style="color:rgb(133,175,209)">#A6CEE9</div></div><div><div style="height:52px;border-radius:4px;background:var(--ink);box-shadow:inset 0 0 0 1px rgb(114,180,222)"></div><div style="margin-top:6px;font-size:12px;color:rgb(242,250,255)">ink</div><div class="mono" style="color:rgb(133,175,209)">#F4F9FE</div></div><div><div style="height:52px;border-radius:4px;background:var(--primary);box-shadow:inset 0 0 0 1px rgb(114,180,222)"></div><div style="margin-top:6px;font-size:12px;color:rgb(242,250,255)">primary</div><div class="mono" style="color:rgb(133,175,209)">#D0F4FF</div></div><div><div style="height:52px;border-radius:4px;background:var(--title);box-shadow:inset 0 0 0 1px rgb(114,180,222)"></div><div style="margin-top:6px;font-size:12px;color:rgb(242,250,255)">title</div><div class="mono" style="color:rgb(133,175,209)">#0D5EAE</div></div></div></body></html>
