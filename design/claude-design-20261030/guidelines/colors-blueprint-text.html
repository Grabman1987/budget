<!-- @dsCard group="Colors" viewport="700x130" name="Blueprint ink & signals" subtitle="Text tiers plus danger/success inks on the dark canvas" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--ground)}.cap{font-family:var(--font-tech);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}.mono{font-family:var(--font-tech);font-size:12px;color:var(--muted)}body{background:var(--color-canvas)}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px"><div><div style="height:52px;border-radius:4px;background:var(--color-text-primary);box-shadow:inset 0 0 0 1px rgb(114,180,222)"></div><div style="margin-top:6px;font-size:12px;color:rgb(242,250,255)">color-text-primary</div><div class="mono" style="color:rgb(133,175,209)">#FFFFFF</div></div><div><div style="height:52px;border-radius:4px;background:var(--color-text-secondary);box-shadow:inset 0 0 0 1px rgb(114,180,222)"></div><div style="margin-top:6px;font-size:12px;color:rgb(242,250,255)">color-text-secondary</div><div class="mono" style="color:rgb(133,175,209)">#DCEEFF</div></div><div><div style="height:52px;border-radius:4px;background:var(--color-text-tertiary);box-shadow:inset 0 0 0 1px rgb(114,180,222)"></div><div style="margin-top:6px;font-size:12px;color:rgb(242,250,255)">color-text-tertiary</div><div class="mono" style="color:rgb(133,175,209)">#A6CEE9</div></div><div><div style="height:52px;border-radius:4px;background:var(--color-danger);box-shadow:inset 0 0 0 1px rgb(114,180,222)"></div><div style="margin-top:6px;font-size:12px;color:rgb(242,250,255)">color-danger</div><div class="mono" style="color:rgb(133,175,209)">#FF958A</div></div><div><div style="height:52px;border-radius:4px;background:var(--color-danger-bg);box-shadow:inset 0 0 0 1px rgb(114,180,222)"></div><div style="margin-top:6px;font-size:12px;color:rgb(242,250,255)">color-danger-bg</div><div class="mono" style="color:rgb(133,175,209)">#623851</div></div><div><div style="height:52px;border-radius:4px;background:var(--color-success);box-shadow:inset 0 0 0 1px rgb(114,180,222)"></div><div style="margin-top:6px;font-size:12px;color:rgb(242,250,255)">color-success</div><div class="mono" style="color:rgb(133,175,209)">#54FFC3</div></div></div></body></html>
