<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--ground)}.cap{font-family:var(--font-tech);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}.mono{font-family:var(--font-tech);font-size:12px;color:var(--muted)}.r{display:flex;gap:0}.r div{flex:1;height:40px}</style></head><body><div  style="background:var(--ground);padding:8px"><div class="r"><div style="background:var(--heatmap-0)"></div><div style="background:var(--heatmap-1)"></div><div style="background:var(--heatmap-2)"></div><div style="background:var(--heatmap-3)"></div><div style="background:var(--heatmap-4)"></div></div></div><div data-mode="dunkel" style="background:var(--ground);padding:8px"><div class="r"><div style="background:var(--heatmap-0)"></div><div style="background:var(--heatmap-1)"></div><div style="background:var(--heatmap-2)"></div><div style="background:var(--heatmap-3)"></div><div style="background:var(--heatmap-4)"></div></div></div><div class="mono" style="display:flex;justify-content:space-between;margin-top:4px"><span>heatmap-0</span><span>heatmap-4</span></div></body></html>
